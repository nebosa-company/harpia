id = "py-s-human-number"
title = "Human-readable number formatter"
stack = "python"
tier = "simple"
prompt = '''
Create a module `humanize.py` in the project root (a stub is already
there) with one function:

- `human_number(n: int) -> str`

Format an integer compactly with the suffixes K (10^3), M (10^6),
B (10^9) and T (10^12), following these exact rules:

1. Negative numbers: format the absolute value, then prefix "-".
2. If abs(n) < 1000, return the plain decimal digits (e.g. 0 -> "0",
   999 -> "999").
3. Otherwise pick the largest unit not exceeding abs(n) (T is the largest
   unit; anything >= 10^12 uses T no matter how big). Divide abs(n) by
   the unit and format the quotient with exactly one decimal place, the
   way Python's `f"{value:.1f}"` does.
4. If that formatted quotient reads "1000.0" (the rounding crossed into
   the next unit) and a larger unit exists, switch to that next unit and
   format again.
5. Strip a trailing ".0" from the formatted quotient, then append the
   unit letter.

Examples: 1000 -> "1K", 1500 -> "1.5K", 999999 -> "1M" (999.999 rounds
to 1000.0, so the value moves up to M), 1234567 -> "1.2M",
2500000000 -> "2.5B", -1500 -> "-1.5K",
5000000000000000 -> "5000T".

Use only the Python standard library.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden.py"]
cmd = ["python", "tests_hidden.py"]
weight = 4.0

