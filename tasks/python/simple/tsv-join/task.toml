id = "py-s-tsv-join"
title = "TSV inner join"
stack = "python"
tier = "simple"
prompt = '''
Create a module `tsvjoin.py` in the project root (a stub is already there)
with one function:

- `inner_join(left: str, right: str, key: str) -> str`

`left` and `right` are TSV documents: lines separated by "\n" (an optional
single trailing newline is allowed), fields separated by tabs. The first
line of each document is a header of column names; every data row must
have exactly as many fields as its header — if any row does not, raise
ValueError. If `key` is missing from either header, raise ValueError.

Produce the inner join of the two tables on the `key` column:

- Output header: the key column first, then the left table's remaining
  columns in their original order, then the right table's remaining
  columns in their original order.
- One output row per (left row, right row) pair whose key values are
  equal (exact string comparison). Rows appear in left-table order; when
  a left row matches several right rows, those appear in right-table
  order. Left rows with no match are omitted.
- Output lines are joined with "\n" and the result always ends with a
  single trailing "\n". With no matching rows the output is just the
  header line.

The key column does not need to be the first column in either input.
Use only the Python standard library.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
