id = "py-s-dict-flatten"
title = "Dictionary flattener"
stack = "python"
tier = "simple"
prompt = '''
Create a module `flatten.py` in the project root (a stub is already there)
with two functions. All keys involved are strings.

- `flatten(d: dict, sep: str = ".") -> dict`
  Collapse nested dictionaries into a single level, joining key paths with
  `sep`. Values that are non-empty dicts are descended into; every other
  value — including lists, tuples, None, and *empty* dicts — is kept as a
  leaf at its joined key. Keys appear in depth-first order, following each
  dict's own insertion order. If two produced paths collide (possible when
  a literal key already contains `sep`), raise ValueError.

  Example: `flatten({"a": {"x": 1, "y": {}}, "b": 2})`
  returns `{"a.x": 1, "a.y": {}, "b": 2}`.

- `unflatten(d: dict, sep: str = ".") -> dict`
  The inverse: split each key on `sep` and rebuild the nesting. If the
  entries conflict — some path is both a leaf and a prefix of another
  entry's path (for example keys "a" and "a.b") — raise ValueError.

  For any nested dict `d` whose keys do not contain `sep`,
  `unflatten(flatten(d)) == d` must hold.

Use only the Python standard library.
'''
timeout_secs = 300
max_cost_usd = 0.25

