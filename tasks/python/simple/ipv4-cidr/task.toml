id = "py-s-ipv4-cidr"
title = "IPv4 and CIDR validator"
stack = "python"
tier = "simple"
prompt = '''
Create a module `netcheck.py` in the project root (a stub is already there)
with three functions:

- `is_ipv4(s: str) -> bool`
  True iff `s` is exactly four dot-separated decimal octets, each in the
  range 0-255, made of digits only. No leading zeros: "0" is fine but "00"
  and "01" are not. No whitespace, signs, or extra characters anywhere.

- `parse_cidr(s: str) -> tuple[str, int]`
  Parse "ADDR/PREFIX" where ADDR satisfies `is_ipv4` and PREFIX is a
  decimal integer 0-32, digits only, again with no leading zeros ("0" is
  valid, "00" and "08" are not). Return (ADDR, PREFIX as int). Raise
  ValueError for anything else (missing slash, bad address, bad prefix,
  extra slashes, empty parts).

- `network_contains(cidr: str, ip: str) -> bool`
  True iff `ip` belongs to the network `cidr`: the first PREFIX bits of
  `ip` equal the first PREFIX bits of the CIDR's address. The CIDR address
  does not have to be the canonical network address — only its top PREFIX
  bits matter. A prefix of 0 contains every address; a prefix of 32
  matches only the exact address. Raise ValueError if either argument is
  invalid (`cidr` per `parse_cidr`, `ip` per `is_ipv4`).

Use only the Python standard library.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden.py"]
cmd = ["python", "tests_hidden.py"]
weight = 4.0

