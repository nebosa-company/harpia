id = "py-c-diff-patch"
title = "Unified diff and patch application"
stack = "python"
tier = "complex"
prompt = '''
Create a module `difftool.py` in the project root (a stub is already
there) implementing unified diffs and, crucially, applying them:

    class PatchError(Exception): ...

    def diff(a: str, b: str) -> str
    def apply_patch(text: str, patch: str) -> str
    def revert(text: str, patch: str) -> str

Text convention for all three functions: a text is either the empty
string or a string whose every line ends with "\n" (the last character
of a non-empty text is "\n"). Raise ValueError for a non-empty input
text that does not end with "\n". Lines are the units of comparison.

- `diff(a, b)` produces a unified diff turning `a` into `b`, with 3
  lines of context, in EXACTLY the format of Python's
  `difflib.unified_diff(a_lines, b_lines, fromfile="a", tofile="b")`
  joined into one string, where the line lists preserve line endings
  (splitlines(keepends=True)). Identical inputs produce "".
  You may implement it with difflib or by hand, but the output must be
  byte-identical to that reference. Recap of the format: a "--- a\n"
  and "+++ b\n" header pair, then hunks headed by
  "@@ -START,COUNT +START,COUNT @@\n" (a ",COUNT" part is omitted when
  the count is 1; START is the 1-based first line of the hunk on each
  side, and for an empty range START is the line BEFORE the insertion
  point, 0 when inserting at the very beginning), containing " ", "-"
  and "+" prefixed lines.

- `apply_patch(text, patch)` applies such a patch strictly:
  * "" applies to anything and returns `text` unchanged.
  * The patch must start with the "--- ", "+++ " header pair; hunk
    headers must parse; every context (" ") and deletion ("-") line
    must match `text` exactly at the position the hunk claims; hunks
    must be in order and must not overlap. Any violation raises
    PatchError (never a bare IndexError or silent corruption).
  * On success, for any two conforming texts:
    apply_patch(a, diff(a, b)) == b.

- `revert(text, patch)` is the exact inverse: it undoes a patch that
  was already applied, so revert(apply_patch(a, p), p) == a for a patch
  p produced by `diff`. Validation is as strict as `apply_patch`
  (context and "+" lines must match; PatchError otherwise).

Use only the Python standard library.
'''
timeout_secs = 1800
max_cost_usd = 4.0

