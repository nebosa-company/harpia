id = "py-c-legacy-pricer"
title = "Legacy pricing package: bugs and coupons"
stack = "python"
tier = "complex"
prompt = '''
The package `pricer/` prices carts for the storefront back office
(catalog loading, carts, bulk discounts, invoices — see the module
docstrings for each piece's contract). Money is integer cents
everywhere. Three defects are open against it, and one feature is due.

Defects, by symptom:

1. Invoices crash for order forms that write SKUs in lowercase: the
   pricing step reports the product as unknown even though it is plainly
   in the catalog. SKUs are supposed to be case-insensitive everywhere.
2. Finance reconciliation keeps flagging invoices where an item rings up
   exactly one cent below its listed catalog price (a 19.99 item
   contributing 19.98, a 12.30 item contributing 12.29). Not every
   price is affected, which is why it survived review so long.
3. The bulk discount comes out absurdly small: a line with 10+ units
   gets roughly the discount a SINGLE unit would earn, not 10 percent
   of the line total as documented.

Fix all three without changing any existing public function name or
its documented return shape.

Feature — coupons:

- In `pricer/discounts.py`, add `class CouponError(Exception)` and
  `apply_coupon(code: str, amount_cents: int) -> int` returning the
  coupon's value in cents against the given amount:
  * "SAVE10": 10 percent of `amount_cents`, rounded down.
  * "TENOFF": 1000 cents, but never more than `amount_cents`.
  * any other code: raise CouponError.
- `build_invoice(cart, catalog, coupon=None)` in `pricer/invoice.py`
  gains the optional `coupon` argument (a code string or None). The
  coupon applies AFTER bulk discounts: its value is computed on
  subtotal minus bulk discount. The invoice dict gains two keys:
  "coupon_cents" (0 when no coupon) and "coupon_code" (the code, or
  None), and "total_cents" becomes subtotal - discounts - coupon.
- `format_invoice` renders a "Coupon (CODE) -$X.XX" line between the
  discount line and the Total line, only when a coupon was applied.
  Example with a coupon:

      WID-1 x2 Widget $39.98
      BOLT-9 x10 Bolt $1.00
      Subtotal $40.98
      Bulk discount -$0.10
      Coupon (SAVE10) -$4.08
      Total $36.80

- Re-export `apply_coupon` and `CouponError` from the package's
  `__init__.py` like the existing helpers.

Use only the Python standard library.
'''
timeout_secs = 1800
max_cost_usd = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden.py"]
cmd = ["python", "tests_hidden.py"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests_feature.py"]
cmd = ["python", "tests_feature.py"]
weight = 2.0

