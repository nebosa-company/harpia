id = "py-c-orm-lite"
title = "Tiny ORM over stdlib sqlite3"
stack = "python"
tier = "complex"
prompt = '''
Create a module `minorm.py` in the project root (a stub is already there)
implementing a miniature object-relational mapper on top of the standard
library's `sqlite3` — no third-party packages.

Field descriptors:

    class IntField(nullable=True)     # SQL type INTEGER
    class TextField(nullable=True)    # SQL type TEXT
    class FloatField(nullable=True)   # SQL type REAL

Models:

    class Model: ...

A user subclasses `Model` and declares fields as class attributes:

    class User(Model):
        name = TextField(nullable=False)
        age = IntField()

- Every model implicitly has an integer primary key `id`. It is NOT
  declared; instances expose it as `.id`, which is None until the
  instance is inserted.
- Instances are constructed with keyword arguments for declared fields:
  `User(name="ada", age=36)`. Omitted fields default to None. An unknown
  keyword raises TypeError.
- `Model.table_name()` (classmethod) returns the class name lowercased.
- `Model.model_fields()` (classmethod) returns a dict mapping field name
  to its descriptor, in declaration order, excluding `id`.

Database:

    class Database(path=":memory:")

with attribute `conn` (the underlying sqlite3 connection) and methods:

- `create_table(ModelCls)` — CREATE TABLE IF NOT EXISTS with column
  `id INTEGER PRIMARY KEY AUTOINCREMENT`, then one column per declared
  field, in declaration order, with its SQL type and `NOT NULL` when
  nullable=False.
- `insert(obj)` — INSERT the instance, set `obj.id` from the database,
  return `obj`.
- `get(ModelCls, id)` — the instance with that id, or None.
- `all(ModelCls)` — every row as instances, ordered by id ascending.
- `filter(ModelCls, **field_values)` — instances matching ALL the given
  equalities, ordered by id ascending. Filtering on a name that is not a
  declared field (or `id`) raises ValueError.
- `update(obj)` — write all of the instance's current field values back
  to its row (matched by `obj.id`; ValueError if `obj.id` is None).
- `delete(obj)` — delete the row (ValueError if `obj.id` is None) and
  set `obj.id` back to None.
- `count(ModelCls)` — number of rows.

All SQL values must be passed as parameters (never interpolated into the
SQL string), so field values containing quotes or SQL fragments are
stored and retrieved verbatim. Instances returned by queries are real
instances of the model class with every field and `id` populated.

Use only the Python standard library.
'''
timeout_secs = 1800
max_cost_usd = 4.0

