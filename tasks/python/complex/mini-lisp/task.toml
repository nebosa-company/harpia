id = "py-c-mini-lisp"
title = "Mini-Lisp interpreter"
stack = "python"
tier = "complex"
prompt = '''
Create a module `minilisp.py` in the project root (a stub is already
there) implementing a small Lisp interpreter:

    class LispError(Exception): ...

    def run(src: str)

`run` parses `src` as a sequence of expressions, evaluates them in order
in one fresh global environment, and returns the value of the LAST
expression (None for empty input).

Syntax:

- Parenthesized lists, whitespace-separated atoms. Any amount of
  whitespace (spaces, tabs, newlines) separates tokens.
- `;` starts a comment running to the end of the line.
- Integer literals (optional leading "-", digits) evaluate to Python
  int; literals with a decimal point (like 3.5 or -0.25) to Python
  float; `#t` / `#f` to Python True / False. Everything else is a
  symbol.
- Unbalanced or extra parentheses raise LispError.

Values map to Python: numbers to int/float, booleans to bool, lists
(from `list`, `cons`, `quote`) to Python lists, symbols under `quote` to
Python strings, functions to callables.

Special forms:

- `(define name expr)` — bind in the current environment; returns None.
- `(set! name expr)` — rebind the NEAREST enclosing binding of `name`;
  LispError if `name` is unbound anywhere. Returns None.
- `(if cond then else)` — evaluate `then` if cond is truthy, otherwise
  `else`. The ONLY falsy value is `#f` (Python False): 0 and the empty
  list are truthy. `else` may be omitted; an untaken omitted branch
  yields None. Only the taken branch is evaluated.
- `(lambda (params...) body...)` — closure over the defining
  environment; multiple body expressions run in order, the last one is
  the value. Calling with the wrong argument count raises LispError.
- `(let ((name expr)...) body...)` — new scope; bindings evaluated in
  the outer environment, body like lambda's.
- `(begin expr...)` — evaluate in order, value of the last.
- `(quote datum)` — the datum unevaluated: numbers/booleans as
  themselves, symbols as Python strings, lists as Python lists.

Builtins: `+ - * /` (numbers; `+` and `*` accept 2+ arguments, `-` and
`/` exactly 2; `/` is true division), comparisons `< > <= >= =` (exactly
2 numbers, `=` is numeric equality), `abs`, `min`, `max` (2+ args),
`not`, `equal?` (structural equality), `list`, `cons` (item + list),
`car`, `cdr` (LispError on an empty or non-list), `null?`, `length`.

Errors (all LispError): referencing an unbound symbol, calling a
non-function, wrong arity for a user lambda, car/cdr misuse, malformed
special forms, parse errors.

Recursion must work: a `define`d lambda can call itself (factorial,
fibonacci), and closures capture their environment (`set!` inside a
closure updates the captured binding).

Use only the Python standard library.
'''
timeout_secs = 1800
max_cost_usd = 4.0

