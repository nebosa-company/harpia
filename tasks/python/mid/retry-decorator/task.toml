id = "py-m-retry-decorator"
title = "Retry decorator with injectable sleep"
stack = "python"
tier = "mid"
prompt = '''
Create a module `retry.py` in the project root (a stub is already there)
with a decorator factory:

    def retry(times=3, delay=0.1, backoff=2.0,
              exceptions=(Exception,), sleep=time.sleep)

`@retry(...)` wraps a function so failing calls are retried:

- `times` is the TOTAL number of attempts (first call included). It must
  be >= 1; `retry` raises ValueError immediately (at decoration-factory
  call time) otherwise.
- When the wrapped function raises an exception that is an instance of
  one of `exceptions` and attempts remain, call `sleep(current_delay)`
  and try again. The first wait is `delay` seconds; each subsequent wait
  is the previous wait times `backoff`.
- When the attempts are exhausted, re-raise the last exception.
- An exception NOT matching `exceptions` propagates immediately — no
  further attempts, no sleep.
- On success the return value passes through; positional and keyword
  arguments are forwarded unchanged.
- All waiting must go through the `sleep` callable — never call
  `time.sleep` directly — so callers can inject a recorder or a no-op.
- The wrapper must preserve the wrapped function's `__name__` and
  `__doc__` (functools.wraps).

Use only the Python standard library.
'''
timeout_secs = 720
max_cost_usd = 1.0

