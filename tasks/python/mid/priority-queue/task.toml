id = "py-m-priority-queue"
title = "Priority task queue"
stack = "python"
tier = "mid"
prompt = '''
Create a module `taskqueue.py` in the project root (a stub is already
there) implementing:

    class TaskQueue:
        def add(self, name: str, priority: int = 0) -> None
        def pop(self) -> str
        def peek(self) -> str
        def cancel(self, name: str) -> bool
        def pop_all(self) -> list[str]
        def clear(self) -> None
        def __len__(self) -> int

A queue of named tasks ordered by priority:

- `pop` removes and returns the name of the highest-priority pending
  task. Among tasks with equal priority, the one added FIRST comes out
  first (FIFO within a priority level, no exceptions — insertion order
  must be honored even after cancellations and interleaved operations).
  Higher numbers mean higher priority; priorities may be negative.
- `peek` returns the same task `pop` would, without removing it.
- `pop` and `peek` raise IndexError when the queue is empty.
- The same name may be queued multiple times (with the same or different
  priorities); each `add` is a separate pending task.
- `cancel(name)` removes the pending task with that name that `pop`
  would reach soonest (the frontmost instance), returns True; if no
  pending task has that name, returns False.
- `pop_all` drains the queue, returning names in pop order.
- `len(q)` is the number of pending tasks; `clear()` empties the queue.

Use only the Python standard library.
'''
timeout_secs = 720
max_cost_usd = 1.0

