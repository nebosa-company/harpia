id = "py-m-ini-to-toml"
title = "INI to TOML converter"
stack = "python"
tier = "mid"
prompt = '''
Create a module `ini2toml.py` in the project root (a stub is already
there) with one function:

- `convert(ini_text: str) -> str`

It converts an INI document to a TOML document. The returned string must
be valid TOML: parsing it with `tomllib.loads` must succeed and yield the
structure described below.

INI dialect to accept:

- Lines are separated by "\n". Leading and trailing whitespace on each
  line is insignificant.
- Blank lines are ignored. Lines whose first non-whitespace character is
  ";" or "#" are comments and are ignored.
- "[section]" starts a section; the name is the text between the
  brackets. The same section may appear more than once — its keys merge.
- Other non-blank lines are "key = value" pairs, split on the FIRST "=",
  with whitespace trimmed from both sides of key and value. Pairs seen
  before any section header are top-level.
- If the same key appears more than once in the same scope, the last
  occurrence wins.
- Section names and keys consist of letters, digits, "_" and "-"
  (guaranteed by the caller; you may rely on it).

Value typing, checked in this order:

1. "true" / "false" (case-insensitive) -> TOML boolean.
2. An optional sign followed by digits only -> TOML integer.
3. An optional sign, digits, one ".", digits -> TOML float.
4. Anything else, including the empty string -> TOML string. Strings must
   be escaped correctly no matter what they contain (quotes, backslashes,
   Windows paths).

The TOML output maps top-level pairs to top-level keys and each INI
section to a TOML table with the same name. Sections that contain no keys
still appear as (empty) tables.

Use only the Python standard library.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden.py"]
cmd = ["python", "tests_hidden.py"]
weight = 4.0

