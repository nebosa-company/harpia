id = "py-m-lru-ttl-cache"
title = "LRU cache with per-entry TTL"
stack = "python"
tier = "mid"
prompt = '''
Create a module `ttlcache.py` in the project root (a stub is already
there) implementing:

    class TTLCache:
        def __init__(self, maxsize: int, ttl: float, clock=time.monotonic)

A bounded key-value cache combining LRU eviction with a time-to-live.
`clock` is a zero-argument callable returning a monotonically
non-decreasing float in seconds; all time arithmetic must go through it
(never call time functions directly), so callers can inject a fake clock.

Semantics:

- An entry expires when `clock() - stored_at >= ttl`, where `stored_at`
  is the clock value at the most recent `set` of that key. Expired
  entries behave exactly as if absent, whenever they are observed.
- `set(key, value)`: insert or replace. Both insert and replace record a
  fresh timestamp and make the key the most recently used. When inserting
  a NEW key into a full cache, first drop expired entries; if the cache
  is still full, evict the least recently used entry.
- `get(key, default=None)`: return the value, or `default` if the key is
  missing or expired (an expired entry found this way is removed). A hit
  makes the key the most recently used; it does NOT refresh the TTL.
- `key in cache`: True iff present and not expired. Does not change
  recency and does not refresh the TTL.
- `pop(key, default=None)`: remove and return the value (default if
  missing or expired).
- `expire() -> int`: remove every expired entry, return how many were
  removed.
- `len(cache)`: the number of non-expired entries.
- `keys() -> list`: keys of non-expired entries, most recently used
  first.
- `maxsize` must be at least 1 and `ttl` strictly positive; otherwise
  `__init__` raises ValueError.

Use only the Python standard library.
'''
timeout_secs = 720
max_cost_usd = 1.0

