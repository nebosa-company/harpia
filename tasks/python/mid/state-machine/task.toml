id = "py-m-state-machine"
title = "Declarative finite state machine"
stack = "python"
tier = "mid"
prompt = '''
Create a module `fsm.py` in the project root (a stub is already there)
with an exception class and a state machine:

    class TransitionError(Exception): ...

    class StateMachine:
        def __init__(self, initial: str, transitions)
        state          # current state (attribute or property)
        history        # list of applied (source, event, target) triples
        def can(self, event: str) -> bool
        def trigger(self, event: str) -> str
        def events(self) -> list[str]
        def reset(self) -> None

`transitions` is an iterable of (source, event, target) string triples
declaring the machine:

- A triple whose source is "*" is a wildcard: it applies from ANY state,
  but only when no exact (current state, event) triple exists — exact
  rules always win over wildcards.
- Declaring two triples with the same (source, event) pair — including
  two wildcards for the same event — raises ValueError at construction
  time.

Behavior:

- `trigger(event)` applies the matching rule for the current state:
  the machine moves to the target, the applied (source-state, event,
  target) triple — with the ACTUAL current state as source, even when a
  wildcard matched — is appended to `history`, and the new state is
  returned. If no rule matches, raise TransitionError with a message
  containing both the current state and the event; the state and the
  history must remain unchanged.
- `can(event)` is True iff `trigger(event)` would succeed.
- `events()` lists the events available from the current state (exact
  rules plus wildcard rules), sorted alphabetically, no duplicates.
- `reset()` returns the machine to the initial state and clears
  `history`.
- Self-transitions (target == current state) are legal and are recorded
  in history like any other transition.

Use only the Python standard library.
'''
timeout_secs = 720
max_cost_usd = 1.0

