id = "py-m-csv-pivot"
title = "CSV group and pivot report"
stack = "python"
tier = "mid"
prompt = '''
Create a module `pivot.py` in the project root (a stub is already there)
with one function:

- `pivot(csv_text: str, index: str, columns: str, values: str,
         aggregate: str = "sum") -> str`

Build a pivot table from a CSV document and return it as CSV text.

Input: standard CSV (comma-separated, RFC-4180-style quoting — fields may
be quoted with double quotes and contain commas or doubled quotes; use
the `csv` module rather than splitting on commas). The first row is the
header. `index`, `columns` and `values` name three of its columns; if any
of them is not in the header, raise ValueError.

- Output rows: one per distinct value of the `index` column, sorted
  ascending as strings. Output columns: one per distinct value of the
  `columns` column, sorted ascending as strings.
- The output header row is the `index` column's name followed by those
  distinct column values.
- Each cell aggregates the `values` field over the input rows matching
  that (row, column) pair:
  * "sum": the sum, with the field parsed as float
  * "mean": the arithmetic mean, parsed as float
  * "count": the number of matching rows (no parsing)
  Any other `aggregate` raises ValueError. For "sum"/"mean", a value
  that does not parse as float raises ValueError.
- Cell formatting: an empty cell (no matching rows) is the empty string;
  "count" cells are plain integers; "sum"/"mean" cells are formatted with
  Python's `f"{x:g}"` (so 12.0 renders as "12" and 2.5 as "2.5").
- The output is written CSV-style: fields containing commas, quotes or
  newlines are quoted, lines are joined with "\n", and the result ends
  with a single trailing "\n".

Use only the Python standard library.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden.py"]
cmd = ["python", "tests_hidden.py"]
weight = 4.0

