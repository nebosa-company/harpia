id = "dart-c-stack-vm"
title = "Stack VM with assembler"
stack = "dart"
tier = "complex"
prompt = '''
Implement a small integer stack machine and its assembler in
`lib/stack_vm.dart` (pure Dart, no packages).

Bytecode model: a program is a `List<int>`. Instructions occupy one cell
for the opcode plus one cell for the operand when they take one. Opcode
numbers are fixed:

    HALT=0, PUSH=1(n), ADD=2, SUB=3, MUL=4, DIV=5, MOD=6, NEG=7,
    DUP=8, DROP=9, SWAP=10, OVER=11, LOAD=12(slot), STORE=13(slot),
    JMP=14(addr), JZ=15(addr), CALL=16(addr), RET=17, PRINT=18

API to implement, exactly:

- `class VmResult` with final `List<int> stack` (bottom first) and
  `List<int> output`, and a `VmResult(this.stack, this.output)` constructor.
- `List<int> assemble(String source)`
- `VmResult runProgram(List<int> code, {int maxSteps = 1000000})`
- `VmResult runSource(String source, {int maxSteps = 1000000})` — assemble
  then run.

Assembler source format:
- One item per line. Blank lines are skipped; `;` starts a comment running
  to end of line. Tokens are separated by whitespace.
- A label definition is `name:` alone on its line; `name` is
  `[A-Za-z_][A-Za-z0-9_]*` and labels the address of the next emitted cell.
- An instruction is a mnemonic (case-insensitive) plus exactly its operand
  count. PUSH/LOAD/STORE take a decimal integer (PUSH may be negative;
  LOAD/STORE must be >= 0). JMP/JZ/CALL take a label name or a bare
  numeric address.
- `FormatException` on: an unknown mnemonic, a missing or extra operand, a
  malformed operand, a duplicate label, an undefined label, a negative
  LOAD/STORE slot.

Execution starts at address 0 and stops at HALT, yielding the final stack
and everything PRINT emitted. Semantics (b is the top of stack, a below
it — every binary op pops b then a and pushes the result):
- ADD a+b, SUB a-b, MUL a*b, DIV truncating division `a ~/ b`,
  MOD remainder `a - (a ~/ b) * b` (so `-7 DIV 2` is -3 and `-7 MOD 2`
  is -1), NEG negates the top.
- DUP duplicates the top; DROP pops it; SWAP swaps the top two; OVER
  pushes a copy of the second from the top.
- LOAD n pushes global slot n (0 when never stored); STORE n pops into
  slot n. Slots live for the whole run.
- JMP a jumps to address a; JZ a pops the top and jumps when it is 0.
- CALL a pushes the return address onto a separate call stack and jumps;
  RET pops it and continues there.
- PRINT pops the top and appends it to the output list.

`StateError` on runtime faults: popping an empty stack (or OVER/SWAP with
fewer than two values), DIV or MOD by zero, RET with an empty call stack,
the program counter leaving `[0, code.length)` without a HALT, an unknown
opcode, a missing operand at the end of code, a negative slot, or
executing more than `maxSteps` instructions.

Example: `runSource` of the program

    PUSH 5
    loop:
    DUP
    JZ end
    DUP
    PRINT
    PUSH 1
    SUB
    JMP loop
    end:
    HALT

yields output `[5, 4, 3, 2, 1]` and final stack `[0]`, and its assembled
bytecode is `[1, 5, 8, 15, 12, 8, 18, 1, 1, 3, 14, 2, 0]`.
'''
timeout_secs = 1800
max_cost_usd = 4.0

