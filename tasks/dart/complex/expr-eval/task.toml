id = "dart-c-expr-eval"
title = "Precedence-climbing expression evaluator"
stack = "dart"
tier = "complex"
prompt = '''
Implement an arithmetic expression evaluator in `lib/expr_eval.dart` (pure
Dart, no packages; `dart:math` is fine), as a top-level function:

    num evaluate(String expression, {Map<String, num> variables = const {}})

Lexical rules:
- Numbers: decimal digits with an optional fractional part (`3`, `3.5`).
  A digit is required before the dot, and a dot must be followed by at
  least one digit (`.5`, `2.`, and `2..5` are malformed).
- Identifiers: `[A-Za-z_][A-Za-z0-9_]*`. An identifier immediately followed
  by `(` is a function call; otherwise it is a variable reference.
- Operators and punctuation: `+ - * / % ^ ( ) ,`. Whitespace is ignored
  everywhere between tokens.

Grammar and precedence (loosest to tightest):
1. `+` `-` (binary, left-associative)
2. `*` `/` `%` (left-associative)
3. unary minus (may be repeated: `- -5`)
4. `^` (right-associative: `2^3^2` is `2^(3^2)`)
Parentheses group as usual. Note the unary-minus placement: `-2^2` is
`-(2^2)` = -4, while `2^-1` parses (the exponent position accepts a unary
expression) and is 0.5.

Semantics are ordinary Dart `num` arithmetic: `+ - * %` keep ints as ints,
`/` is Dart double division (`10/4` is 2.5), and `^` is `math.pow(a, b)`.

Built-in functions (only these): `min(a, b)`, `max(a, b)`, `abs(x)`,
`sqrt(x)` — `sqrt` always returns a double via `math.sqrt`.

Errors:
- `FormatException` for anything lexically or syntactically malformed:
  unknown characters, malformed numbers, missing operands or parentheses,
  trailing input, an empty expression, empty or malformed argument lists.
- `ArgumentError` for semantic problems in a syntactically valid
  expression: an unknown variable, an unknown function name, or a call to
  a built-in with the wrong number of arguments.

Examples:
- `evaluate('2+3*4')` == 14 (an int)
- `evaluate('2^3^2')` == 512
- `evaluate('-2^2')` == -4
- `evaluate('10/4')` == 2.5
- `evaluate('x*x+y', variables: {'x': 3, 'y': 1})` == 10
- `evaluate('min(3, max(1, 2))')` == 2
- `evaluate('sqrt(9)')` == 3.0
'''
timeout_secs = 1800
max_cost_usd = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tool/hidden_test.dart"]
cmd = ["cmd", "/c", "dart run --enable-asserts tool/hidden_test.dart"]
weight = 4.0

