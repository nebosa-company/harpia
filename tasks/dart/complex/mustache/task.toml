id = "dart-c-mustache"
title = "Mustache-subset template engine"
stack = "dart"
tier = "complex"
prompt = '''
Implement a mustache-subset template engine in `lib/mustache.dart` (pure
Dart, no packages), as a top-level function:

    String render(String template, Map<String, Object?> context)

Supported tags (nothing else: no partials, no delimiter changes, no
lambdas):
- `{{name}}` — interpolation, HTML-escaped: `&` `<` `>` `"` become
  `&amp;` `&lt;` `&gt;` `&quot;`, and the single quote becomes `&#39;`.
- `{{{name}}}` — raw interpolation, no escaping.
- `{{#name}}...{{/name}}` — section.
- `{{^name}}...{{/name}}` — inverted section.
- `{{! anything }}` — comment, produces nothing.
- Whitespace around the name inside a tag is trimmed: `{{ name }}` works.
  No whitespace stripping ever happens around tags in the output; text
  between tags is preserved exactly as written.

Name resolution:
- Rendering maintains a context stack, starting with the root map.
- A plain name resolves by scanning the stack from the innermost frame
  outward; a frame resolves the name only when it is a `Map` containing
  that key. Unresolved names interpolate as the empty string.
- A dotted name `a.b.c` resolves its first part like a plain name, then
  descends: each further part requires the current value to be a `Map`
  containing it, otherwise the whole name is unresolved.
- The name `.` resolves to the innermost frame itself.

Interpolation stringifies with `toString()`; null and unresolved render as
the empty string.

Section semantics, where `v` is the resolved value:
- Falsy (`null`, unresolved, `false`, or an empty `List`): a `{{#}}`
  section renders nothing; a `{{^}}` section renders its body once without
  pushing anything.
- A non-empty `List`: `{{#}}` renders the body once per element, pushing
  the element as the innermost frame; `{{^}}` renders nothing.
- Any other value (maps, `true`, numbers, strings — the empty string and 0
  are truthy): `{{#}}` renders the body once, pushing the value; `{{^}}`
  renders nothing.

Errors — throw `FormatException` for malformed templates:
- a `{{` (or `{{{`) with no matching `}}` (or `}}}`),
- an empty tag name (`{{}}`, `{{#}}`, and similar),
- `{{/name}}` with no section open, or whose name is not the innermost
  open section,
- a section left open at the end of the template.

Examples:
- `render('Hello {{name}}!', {'name': 'Ada'})` == `Hello Ada!`
- `render('{{x}}', {'x': '<b>&</b>'})` == `&lt;b&gt;&amp;&lt;/b&gt;`
- `render('{{{x}}}', {'x': '<b>'})` == `<b>`
- `render('{{#items}}[{{.}}]{{/items}}', {'items': [1, 2]})` == `[1][2]`
- `render('{{#user}}{{name}}{{/user}}', {'user': {'name': 'Ada'}})` ==
  `Ada`
- `render('{{^items}}none{{/items}}', {'items': []})` == `none`
- `render('{{a.b}}', {'a': {'b': 7}})` == `7`
- `render('{{#items}}{{sep}}{{.}}{{/items}}', {'items': [1, 2], 'sep': '|'})`
  == `|1|2` (parent frames stay visible inside sections)
'''
timeout_secs = 1800
max_cost_usd = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tool/hidden_test.dart"]
cmd = ["cmd", "/c", "dart run --enable-asserts tool/hidden_test.dart"]
weight = 4.0

