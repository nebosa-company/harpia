id = "dart-s-phone-normalizer"
title = "US phone number normalizer"
stack = "dart"
tier = "simple"
prompt = '''
Implement `String? normalizeUsPhone(String raw)` as a top-level function in
`lib/phone_normalizer.dart` (pure Dart, no packages). It normalizes US phone
numbers to E.164 form, returning `+1` followed by the ten digits, or null when
the input is not a valid US number.

Rules:
- Allowed input characters: digits, spaces, `.`, `-`, `(`, `)`, and `+`. Any
  other character makes the input invalid (return null). The separator
  characters may appear anywhere in any quantity.
- `+` is only valid before the first digit, at most once, and the digits must
  then start with the country code 1 (which is stripped).
- Without a `+`: exactly 10 digits, or 11 digits where the first is 1 (the
  leading 1 is stripped).
- After reduction to 10 digits: the area code (digit 1) and the exchange code
  (digit 4) must each be in 2-9. Otherwise return null.

Examples:
- `normalizeUsPhone('(212) 555-0187')` == `+12125550187`
- `normalizeUsPhone('1 212 555 0187')` == `+12125550187`
- `normalizeUsPhone('+1 212.555.0187')` == `+12125550187`
- `normalizeUsPhone('555-0187')` == null (too few digits)
- `normalizeUsPhone('(023) 555-0187')` == null (area code starts with 0)
- `normalizeUsPhone('212-155-0187')` == null (exchange starts with 1)
- `normalizeUsPhone('+44 20 7946 0958')` == null (not a US country code)
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["tool/hidden_test.dart"]
cmd = ["cmd", "/c", "dart run --enable-asserts tool/hidden_test.dart"]
weight = 4.0

