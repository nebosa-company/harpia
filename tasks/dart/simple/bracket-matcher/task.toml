id = "dart-s-bracket-matcher"
title = "Bracket matcher"
stack = "dart"
tier = "simple"
prompt = '''
Implement bracket matching in `lib/bracket_matcher.dart` (pure Dart, no packages).

Two top-level functions:

- `bool isBalanced(String input)` — true when every `(`, `[`, `{` in the input
  is closed by the matching `)`, `]`, `}` in the correct nesting order. All
  characters other than the six brackets are ignored.
- `int? firstError(String input)` — null when the input is balanced. Otherwise,
  scanning left to right: a closing bracket that does not match the most recent
  still-open opening bracket (or that appears when nothing is open) is the
  offender, and its index is returned. If the scan finishes with brackets still
  open, return the index of the earliest opening bracket that was never closed.

`isBalanced(s)` must equal `firstError(s) == null` for every input.

Examples:
- `isBalanced('')` is true, `isBalanced('a(b)c')` is true
- `isBalanced('([)]')` is false, `firstError('([)]')` is 2
- `firstError('(]')` is 1, `firstError('(((')` is 0, `firstError('()(')` is 2
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["tool/hidden_test.dart"]
cmd = ["cmd", "/c", "dart run --enable-asserts tool/hidden_test.dart"]
weight = 4.0

