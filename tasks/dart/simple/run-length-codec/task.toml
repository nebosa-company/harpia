id = "dart-s-run-length-codec"
title = "Run-length codec"
stack = "dart"
tier = "simple"
prompt = '''
Implement a run-length codec in `lib/run_length.dart` (pure Dart, no packages).

Two top-level functions:

- `String rleEncode(String input)` — input may contain only ASCII letters
  (A-Z, a-z); any other character throws `ArgumentError`. Each maximal run of
  a repeated letter becomes the run length in decimal followed by the letter,
  with the count always present (also for runs of one). Runs are
  case-sensitive: `aA` is two runs. Empty input encodes to the empty string.
- `String rleDecode(String encoded)` — parses a sequence of
  `<decimal count><letter>` pairs and expands them. The empty string decodes
  to the empty string. Malformed input throws `FormatException`: a letter with
  no count before it, trailing digits with no letter, a count of zero, or any
  character that is neither an ASCII digit nor an ASCII letter.

Round-trip guarantee: `rleDecode(rleEncode(s)) == s` for every valid input.

Examples:
- `rleEncode('aaabccddd')` == `3a1b2c3d`
- `rleEncode('aA')` == `1a1A`
- `rleDecode('3a1b2c3d')` == `aaabccddd`
- `rleDecode('12a')` == `aaaaaaaaaaaa` (twelve a's)
- `rleDecode('a')` throws FormatException, `rleDecode('3a0b')` throws
  FormatException, `rleDecode('3')` throws FormatException
'''
timeout_secs = 300
max_cost_usd = 0.25

