id = "dart-s-duration-humanizer"
title = "Duration humanizer"
stack = "dart"
tier = "simple"
prompt = '''
Implement `String humanize(Duration duration)` as a top-level function in
`lib/duration_humanizer.dart` (pure Dart, no packages).

Rules:
- Units are days, hours, minutes, seconds. Sub-second precision is truncated.
- Any duration strictly between -1 and 1 seconds renders as `0 seconds`.
- Otherwise decompose the (absolute) duration into days/hours/minutes/seconds,
  keep only the non-zero unit amounts, and render at most the two largest of
  them, joined by a single space.
- Each part is `<n> <unit>` with the unit pluralized with a trailing `s`
  unless n is 1.
- Negative durations render as the positive rendering prefixed with `minus `.

Examples:
- `humanize(Duration.zero)` == `0 seconds`
- `humanize(Duration(milliseconds: 900))` == `0 seconds`
- `humanize(Duration(seconds: 1))` == `1 second`
- `humanize(Duration(minutes: 2, seconds: 5))` == `2 minutes 5 seconds`
- `humanize(Duration(hours: 2, seconds: 5))` == `2 hours 5 seconds`
  (minutes is zero, so the next non-zero unit is used)
- `humanize(Duration(hours: 26))` == `1 day 2 hours`
- `humanize(Duration(days: 400))` == `400 days`
- `humanize(Duration(minutes: -90))` == `minus 1 hour 30 minutes`
'''
timeout_secs = 300
max_cost_usd = 0.25

