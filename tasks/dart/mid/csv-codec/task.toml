id = "dart-m-csv-codec"
title = "CSV codec with quoting"
stack = "dart"
tier = "mid"
prompt = '''
Implement a strict CSV codec in `lib/csv_codec.dart` (pure Dart, no
packages), RFC-4180 style.

Top-level functions:

- `List<List<String>> parseCsv(String input)`
- `String encodeCsv(List<List<String>> rows)`

Parsing rules:
- Fields are separated by `,`; records by `\n` or `\r\n` (both accepted,
  they may be mixed). A single trailing record separator at the very end of
  the input is ignored. The empty input parses to `[]`. An empty line is a
  record with one empty field.
- A field starting with `"` is quoted: it runs to the matching closing `"`;
  inside, `""` is a literal double quote, and commas, `\n`, `\r`, and `\r\n`
  are ordinary field content. The closing quote must be followed by a comma,
  a record separator, or the end of input — anything else is a
  `FormatException`. An unterminated quoted field is a `FormatException`.
- In an unquoted field a `"` anywhere is a `FormatException` (quotes must
  quote whole fields), and a `\r` that is not immediately followed by `\n`
  is a `FormatException`.

Encoding rules:
- Records join with `\r\n`, no trailing separator; `encodeCsv([])` is the
  empty string.
- A field is written verbatim unless it contains `,`, `"`, `\r`, or `\n`;
  such fields are wrapped in double quotes with each `"` doubled.
- Round trip: `parseCsv(encodeCsv(rows))` equals `rows` for any rows whose
  records each have at least one field, except that a lone trailing record
  of one empty string cannot survive (its encoding is the empty string).

Examples:
- `parseCsv('a,b\n1,2')` == `[[a, b], [1, 2]]`
- `parseCsv('"a,b",c')` == `[[a,b], [c]]` (one record, two fields)
- `parseCsv('"say ""hi""",x')` == `[[say "hi", x]]`
- `parseCsv('"l1\nl2",b')` == one record whose first field contains a
  newline
- `encodeCsv([['a"b', 'c']])` == `"a""b",c`
'''
timeout_secs = 720
max_cost_usd = 1.0

