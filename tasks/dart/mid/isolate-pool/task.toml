id = "dart-m-isolate-pool"
title = "Isolate compute pool"
stack = "dart"
tier = "mid"
prompt = '''
Implement a fixed-size isolate worker pool in `lib/compute_pool.dart` (pure
Dart, no packages, `dart:isolate` allowed).

API to implement, exactly:

- `class ComputeError implements Exception` with a final `String message`
  field, a `ComputeError(this.message)` constructor, and a `toString()` of
  `ComputeError: <message>`.
- `class ComputePool` with:
  - `static Future<ComputePool> start(int size)` — spawns `size` worker
    isolates up front and completes when all are ready. `size < 1` throws
    `ArgumentError` synchronously.
  - `int get size` — the number of workers.
  - `Future<R> run<Q, R>(FutureOr<R> Function(Q) task, Q arg)` — executes
    `task(arg)` on a worker isolate and completes with its result. The
    `task` must be a top-level or static function and `arg`/result must be
    isolate-sendable; that is the caller's responsibility. Jobs are handed
    to idle workers immediately; when all workers are busy, jobs queue in
    FIFO order and are dispatched as workers free up. Each worker runs one
    job at a time, and workers are reused for the whole life of the pool
    (never one isolate per job).
  - If the task function throws (or returns a Future that completes with an
    error), the returned Future completes with a `ComputeError` whose
    message is the original error's `toString()`.
  - `Future<void> close()` — after close, `run` throws `StateError`
    synchronously. Jobs already submitted (running or queued) still complete
    normally; `close()`'s Future resolves only after they have all finished
    and the worker isolates are shut down. Calling `close` again returns the
    same completed/pending Future.

The pool must actually execute tasks on the worker isolates, never on the
main isolate.
'''
timeout_secs = 720
max_cost_usd = 1.0

