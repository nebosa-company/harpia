id = "dart-m-stream-timing"
title = "Stream debounce and throttle with an injectable scheduler"
stack = "dart"
tier = "mid"
prompt = '''
Implement debounce and throttle for Dart streams in `lib/stream_timing.dart`
(pure Dart, no packages). All timing must go through an injectable scheduler
so the operators behave fully deterministically under any scheduler
implementation. Do not use `Timer` or `Future.delayed` anywhere in this
file.

API to implement, exactly:

- `typedef CancelTimer = void Function();`
- `abstract class Scheduler` with:
  - `int get now;` — current virtual time in milliseconds.
  - `CancelTimer schedule(int delayMs, void Function() callback);` — run the
    callback `delayMs` ms from now; the returned function cancels it if it
    has not fired yet (cancelling twice or after firing is a no-op).
- `class FakeScheduler implements Scheduler` — a hand-rolled manual scheduler:
  - starts at `now == 0`;
  - `void advance(int ms)` moves time forward to `now + ms`, firing every
    scheduled callback whose deadline falls within the window, in deadline
    order; callbacks sharing a deadline fire in the order they were
    scheduled. While a callback runs, `now` equals that callback's deadline.
    A callback scheduled from inside a callback also fires during the same
    `advance` if its deadline is within the window. After `advance`, `now`
    is exactly the target time. Negative `ms` throws `ArgumentError`.
- `Stream<T> debounce<T>(Stream<T> source, int windowMs, Scheduler scheduler)`
  — trailing debounce: each source event (re)starts a `windowMs` countdown;
  when the countdown elapses without a newer event, the latest event is
  emitted. When the source closes with a countdown still pending, the pending
  event is emitted immediately and then the output closes. Errors from the
  source are forwarded immediately.
- `Stream<T> throttle<T>(Stream<T> source, int windowMs, Scheduler scheduler)`
  — leading throttle: an event is emitted immediately if no event has been
  emitted in the previous `windowMs` ms; events arriving inside the quiet
  window are dropped (no trailing emission). An event arriving exactly when
  the window has elapsed is emitted. When the source closes the output closes
  immediately. Errors are forwarded immediately.

Both operators return single-subscription streams that subscribe to the
source only when listened to, and cancel the source subscription when their
listener cancels.
'''
timeout_secs = 720
max_cost_usd = 1.0

