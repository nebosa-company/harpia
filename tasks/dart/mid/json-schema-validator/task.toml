id = "dart-m-json-schema-validator"
title = "Mini JSON-schema validator"
stack = "dart"
tier = "mid"
prompt = '''
Implement a miniature JSON-schema validator in `lib/schema_validator.dart`
(pure Dart, no packages). Schemas and data are plain Dart values as produced
by `jsonDecode`: `Map<String, Object?>`, `List`, `String`, `int`, `double`,
`bool`, `null`.

Top-level functions:

- `List<String> validate(Object? data, Map<String, Object?> schema)` —
  returns all validation errors, empty when the data is valid.
- `bool isValid(Object? data, Map<String, Object?> schema)` — convenience,
  true when `validate` returns no errors.

Supported schema keywords (all optional):
- `type`: one of `string`, `integer`, `number`, `boolean`, `array`, `object`,
  `null`. `integer` matches Dart `int` only; `number` matches `int` or
  `double`.
- `enum`: a list; the data must deep-equal one element.
- `minimum`, `maximum`: nums, inclusive bounds, applied when the data is a num.
- `minLength`, `maxLength`: ints, inclusive, applied when the data is a String.
- `required`: list of property names, applied when the data is a Map.
- `properties`: map of property name to sub-schema, applied to each property
  present in the data.
- `items`: a sub-schema applied to every element when the data is a List.
- `additionalProperties`: when it is the boolean false, properties not listed
  under `properties` are errors. Otherwise extra properties are allowed.
Keywords that do not apply to the data's actual type are simply ignored.

Error strings are exactly `<path>: <message>`. The path of the root is `/`;
a property of the root is `/name`; deeper paths join with `/`, list indexes
are decimal (`/users/0/email`). Messages:
- type mismatch: `expected <type>` (e.g. `/age: expected integer`); when the
  type keyword fails, no other keyword is evaluated at that node.
- enum: `value not in enum`; when enum fails, deeper keywords at that node
  are skipped too.
- minimum: `must be >= <n>`; maximum: `must be <= <n>` (n via toString).
- minLength: `length must be >= <n>`; maxLength: `length must be <= <n>`.
- missing required property: `missing required property '<name>'`, reported
  at the path of the object.
- unexpected property (additionalProperties false): `unexpected property`,
  reported at the path of that property.

Error order is deterministic, a depth-first walk evaluating keywords at each
node in this order: type, enum, minimum, maximum, minLength, maxLength,
required (in the order listed in the schema), properties (in schema map
order), additionalProperties (in data map order), items (by index).
'''
timeout_secs = 720
max_cost_usd = 1.0

