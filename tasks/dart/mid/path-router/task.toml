id = "dart-m-path-router"
title = "Path router with parameters"
stack = "dart"
tier = "mid"
prompt = '''
Implement a URL path router in `lib/path_router.dart` (pure Dart, no
packages).

API to implement, exactly:

- `class RouteMatch<T>` with final fields `T handler` and
  `Map<String, String> params`, and a `RouteMatch(this.handler, this.params)`
  constructor.
- `class Router<T>` with:
  - `void add(String pattern, T handler)`
  - `RouteMatch<T>? match(String path)`

Patterns and paths start with `/` and are split on `/`. A trailing slash is
ignored on both patterns and paths (`/users/` equals `/users`); the root
pattern `/` matches only the root path `/`. A path that does not start with
`/` or that contains an empty segment (`//`) never matches.

Pattern segments:
- literal: matches exactly that text;
- `:name`: matches exactly one segment, captured under `name`;
- `*name`: only allowed as the final segment; captures the entire remaining
  path (zero or more segments joined by `/`, the empty string when nothing
  remains).

`add` throws `ArgumentError` when: the pattern does not start with `/`; a
segment is empty; a `:` or `*` segment has no name; `*` is not last; or an
equivalent pattern was already registered (equivalent means same literals and
same parameter/wildcard positions, regardless of the chosen names).

`match` picks the winner segment by segment, most specific first: a literal
beats `:param`, and `:param` beats `*wildcard`, with full backtracking (if
the literal branch dead-ends deeper, the router falls back to the parameter
branch, then the wildcard). Captured `:name` values and each segment of a
`*name` capture are percent-decoded with `Uri.decodeComponent`; a value that
fails to decode is captured raw.

Examples, after `add('/users/new', a)`, `add('/users/:id', b)`,
`add('/users/:id/posts/:post', c)`, `add('/static/*file', d)`,
`add('/a/:x/c', e)`, `add('/a/b/d', f)`:
- `match('/users/new')` gives handler a, params `{}`
- `match('/users/42')` gives handler b, params `{id: 42}`
- `match('/users/ab%20cd')` gives handler b, params `{id: ab cd}`
- `match('/users/42/posts/7')` gives handler c, `{id: 42, post: 7}`
- `match('/static/css/app.css')` gives handler d, `{file: css/app.css}`
- `match('/static')` gives handler d, `{file: }` (empty capture)
- `match('/a/b/c')` gives handler e, `{x: b}` (backtracks off the literal)
- `match('/users')` gives null
'''
timeout_secs = 720
max_cost_usd = 1.0

