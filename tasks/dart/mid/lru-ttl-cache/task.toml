id = "dart-m-lru-ttl-cache"
title = "Fix the LRU+TTL cache evictions"
stack = "dart"
tier = "mid"
prompt = '''
`lib/ttl_cache.dart` holds a small capacity-bounded cache with per-entry
time-to-live, driven by an injectable clock. It mostly works, but production
traces show two symptoms:

1. Hot entries disappear: keys that are read constantly still get evicted,
   as if reading them counted for nothing.
2. Updating a value that is already cached sometimes knocks out an unrelated
   key, even though overwriting an existing entry should never change how
   many entries the cache holds.

Fix `lib/ttl_cache.dart` so `TtlCache` honors this contract exactly (the
constructor and member signatures must stay as they are):

- `TtlCache({required int capacity, required int ttlMs, required int
  Function() clock})` — `ArgumentError` when capacity or ttlMs is < 1.
- An entry is live while `clock() - stamp < ttlMs`, where `stamp` is the
  time of the entry's last `put` (insert or overwrite). Reads never extend
  an entry's life.
- `V? get(K key)` — null when absent or expired (an expired entry is removed
  on the spot). A successful get marks the entry as most recently used.
- `void put(K key, V value)` — inserting or overwriting stamps the entry and
  marks it most recently used. Only when the key is NOT already present and
  the cache is at capacity does eviction happen: expired entries are pruned
  first; if the cache is still full, the least recently used entry goes.
  Overwriting an existing key never evicts anything.
- `bool containsKey(K key)` — true for a live entry; removes the entry when
  expired; does not touch recency.
- `void remove(K key)`, `int get length`, `List<K> get keys` — length and
  keys prune expired entries first; keys lists live keys from least recently
  used to most recently used.
'''
timeout_secs = 720
max_cost_usd = 1.0

