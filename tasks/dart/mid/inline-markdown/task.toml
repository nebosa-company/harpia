id = "dart-m-inline-markdown"
title = "Inline-markdown renderer"
stack = "dart"
tier = "mid"
prompt = '''
Implement `String renderInline(String text)` as a top-level function in
`lib/inline_markdown.dart` (pure Dart, no packages). It renders one line of
inline markdown to HTML. No block elements: no headings, lists, or
paragraphs; input newlines are ordinary characters.

Processing is a pipeline of passes over the whole string. Each pass scans
left to right, matches are non-overlapping, and text produced by an earlier
pass is opaque to later passes (never re-processed):

1. Backslash escapes: a backslash followed by one of `\` `` ` `` `*` `[` `]`
   `(` `)` produces that literal character (HTML-escaped where applicable)
   and takes no part in any later pass. A backslash before any other
   character stays a literal backslash.
2. Code spans: `` `code` `` becomes `<code>code</code>`. Shortest non-empty
   match between backticks; the contents are HTML-escaped but no markdown
   inside them is processed. An unpaired backtick stays literal.
3. Links: `[text](url)` becomes `<a href="url">text</a>`. The text part must
   not contain `[` or `]`; the url part must not contain parentheses or
   whitespace. The text has passes 4-5 applied to it; the url is escaped for
   the attribute (`&` `<` `>` become entities and `"` becomes `&quot;`).
4. Bold: `**text**` becomes `<strong>text</strong>`; shortest non-empty match
   whose contents neither start nor end with a space. Pass 5 applies inside.
5. Italic: `*text*` becomes `<em>text</em>`; shortest non-empty match whose
   contents neither start nor end with a space.
6. All remaining literal text is HTML-escaped: `&` to `&amp;`, `<` to
   `&lt;`, `>` to `&gt;` (double quotes stay as they are outside attributes).

Anything that does not match its pass's pattern stays literal text: an
unclosed `**`, a `*` that would capture space-edged contents, a malformed
link, and so on.

Examples:
- `renderInline('a < b & c')` == `a &lt; b &amp; c`
- `renderInline('**bold** *it*')` == `<strong>bold</strong> <em>it</em>`
- `renderInline('`a<b`')` == `<code>a&lt;b</code>`
- `renderInline('`*not em*`')` == `<code>*not em*</code>`
- `renderInline('[**hi**](x?a=1&b=2)')` ==
  `<a href="x?a=1&amp;b=2"><strong>hi</strong></a>`
- `renderInline('*mix **b** e*')` == `<em>mix <strong>b</strong> e</em>`
  (bold is processed before italic, so the italic pair sees the shielded
  bold span as opaque contents)
- `renderInline(r'\*lit\*')` == `*lit*`
- `renderInline('2 * 3 * 4')` == `2 * 3 * 4` (space-edged, not italic)
'''
timeout_secs = 720
max_cost_usd = 1.0

