id = "ps-s-json-merge"
title = "Layered JSON configuration merge"
stack = "powershell"
tier = "simple"
prompt = '''
`Merge-Config.ps1` in the project root declares two functions. Implement
both.

    Merge-JsonConfig -BasePath <string> -OverridePath <string>

Reads two JSON documents and returns the layered result as a
`[pscustomobject]` graph (nested objects stay `[pscustomobject]`, lists
stay arrays). `config/base.json` and `config/prod.json` are a working
example. Neither input file is modified.

Merge rules, applied key by key:

- both sides hold an object -> merge them recursively;
- the override holds `null` -> the key is removed from the result, and a
  `null` for a key the base does not have adds nothing;
- anything else -> the override value replaces the base value outright.
  That includes lists, which are replaced whole and never concatenated,
  and it includes `false`, `0`, and `""`, which are ordinary values and
  must override.

Key order in the result: the base object's keys in their original order
first (minus any that were removed), then the override's new keys in
their original order.

    Save-MergedConfig -Config <object> -Path <string>

Writes `-Config` to `-Path` as JSON nested up to 10 levels deep, encoded
UTF-8 with no byte-order mark, using LF line endings and ending with
exactly one newline. Missing parent directories are created.

Use only what ships with PowerShell 7; do not add modules or reach off
the machine.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_hidden.ps1"]
cmd = ["pwsh", "-NoProfile", "-NonInteractive", "-File", "oracle_hidden.ps1"]
weight = 4.0

