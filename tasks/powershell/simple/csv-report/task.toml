id = "ps-s-csv-report"
title = "Regional sales rollup from a CSV export"
stack = "powershell"
tier = "simple"
prompt = '''
`Invoke-SalesReport.ps1` in the project root declares one function,
`Get-SalesReport`. Implement it.

    Get-SalesReport -Path <string> [-MinRevenue <double>]

`-Path` points at a CSV export with the columns
`Region,Product,Units,UnitPrice,OrderDate` (a sample lives at
`data/sales.csv`). `-MinRevenue` defaults to 0.

Roll the rows up to one record per region and return them as
`[pscustomobject]` values whose properties are, in this order:

- `Region`  — the region string exactly as it appears in the export
- `Orders`  — `[int]`, the number of rows for that region
- `Units`   — `[int]`, the sum of the `Units` column
- `Revenue` — `[double]`, the sum of `Units * UnitPrice` over the
  region's rows, rounded to 2 decimals away from zero

Rules:

- `Units` and `UnitPrice` are read with the invariant culture, so
  `12.50` is twelve and a half on every machine. Surrounding whitespace
  is trimmed. A blank or unparsable cell counts as 0, but the row still
  counts as an order.
- Drop regions whose (already rounded) `Revenue` is below `-MinRevenue`;
  the comparison is inclusive, so a region exactly at the threshold
  stays.
- Sort by `Revenue` descending, then by `Region` ascending.
- The function always returns an array, even when there are zero or one
  regions in the result — callers index into it and read `.Count`, and
  neither may break on a one-region export.

Use only what ships with PowerShell 7; do not add modules or reach off
the machine.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
