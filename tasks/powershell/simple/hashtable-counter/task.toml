id = "ps-s-hashtable-counter"
title = "Deterministic token frequency report"
stack = "powershell"
tier = "simple"
prompt = '''
`Get-WordStats.ps1` in the project root declares two functions. Implement
both.

    Get-TokenCounts [-Path] <string> [[-StopWordPath] <string>]

Reads the text file at `-Path` (`data/sample.txt` is a sample) and
returns a `[hashtable]` mapping each token to how often it occurs.

- A token is a maximal run of letters or digits; everything else —
  spaces, punctuation, apostrophes, underscores, hyphens — separates.
- Tokens are lowercased with the invariant culture before counting, so
  `Fox`, `fox`, and `FOX` are one token.
- When `-StopWordPath` is given, its file lists one stop word per line
  (see `data/stopwords.txt`); blank lines and lines starting with `#`
  are ignored, entries are trimmed, and matching is case insensitive.
  Stop words are left out of the table entirely.
- A file with no tokens gives an empty hashtable, not `$null`.

    Format-CountReport [-Counts] <hashtable> [[-Top] <int>]

Turns a counts table into a report. Returns one `[pscustomobject]` per
row with the properties `Token`, `Count` (`[int]`), `Share` (`[double]`),
in that order.

- Rows are ordered by `Count` descending, and ties are broken by `Token`
  ascending using ordinal comparison — the order must not depend on how
  the hash table happens to enumerate, and two runs over the same corpus
  must produce the same rows in the same order.
- `Share` is the token's count divided by the total of *every* count in
  the table, rounded to 4 decimals away from zero — slicing the report
  does not change any share.
- `-Top` keeps only the first that many rows and defaults to 10. `-Top 0`
  gives an empty report, a `-Top` past the end gives every row, and a
  negative `-Top` is rejected by the parameter itself.
- The return value is always an array, including for zero rows and one
  row.

Use only what ships with PowerShell 7; do not add modules or reach off
the machine.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_hidden.ps1"]
cmd = ["pwsh", "-NoProfile", "-NonInteractive", "-File", "oracle_hidden.ps1"]
weight = 4.0

