id = "ps-s-culture-parse"
title = "Culture-invariant field parsing for an instrument export"
stack = "powershell"
tier = "simple"
prompt = '''
`Parse-Fields.ps1` in the project root declares four functions. Implement
all four. Every parse and every rendering must use the invariant culture,
so results are identical whatever regional settings the machine carries.

    ConvertFrom-InvariantNumber [-Text] <string>

Trims `-Text` and parses it as a `[double]` under the invariant culture,
allowing a leading sign, an exponent, and `,` as a thousands separator
(`1,234.56` is 1234.56). Returns `$null` — not 0, not an error — for
empty, whitespace-only, or unparsable input, which includes
comma-decimal text such as `1.234,56`.

    ConvertFrom-InvariantDate [-Text] <string>

Trims `-Text` and accepts exactly these four layouts, matched literally
(so day and month are zero padded), under the invariant culture:

    yyyy-MM-dd
    yyyy-MM-dd HH:mm:ss
    dd/MM/yyyy
    dd/MM/yyyy HH:mm

Returns the `[datetime]` with `Kind` left as `Unspecified`, or `$null`
when nothing matches or the date does not exist.

    Format-InvariantNumber [-Value] <double> [[-Decimals] <int>]

Renders `-Value` with exactly `-Decimals` digits after a `.` (default 2,
zero padded), under the invariant culture. `-Decimals` is restricted to
0 through 9 and a value outside that range is rejected by the parameter
itself.

    Read-InvariantRecords [-Path] <string>

Reads a CSV with the columns `Id,Taken,Value` (see `data/readings.csv`)
and returns one `[pscustomobject]` per row with these properties, in this
order: `Id`, `Taken`, `Value`, `Valid`. `Taken` and `Value` come from the
two functions above. `Valid` is `$true` only when both parsed; when it is
`$false`, both `Taken` and `Value` are `$null`. The function always
returns an array, even for a one-row or header-only file.

Use only what ships with PowerShell 7; do not add modules or reach off
the machine.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_hidden.ps1"]
cmd = ["pwsh", "-NoProfile", "-NonInteractive", "-File", "oracle_hidden.ps1"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_edge.ps1"]
