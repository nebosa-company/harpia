id = "ps-c-file-enforcer"
title = "Transactional file-state enforcer with a drift report"
stack = "powershell"
tier = "complex"
prompt = '''
`StateEnforcer.ps1` in the project root declares three functions.
Implement all three. They are driven by a policy document like
`policy/site.json`:

    { "resources": [ { "id": "conf-dir", "type": "directory",
                       "path": "conf", "ensure": "present" } ] }

Every resource has an `id`, a `type`, and a `path` relative to the site
root, written with `/`. Resources are handled in the order they appear.

Text files are read and written as UTF-8 with no byte-order mark; CRLF is
normalized to LF before anything is compared, and files are written with
LF. Missing parent directories are created.

Resource types:

- `directory` — `ensure` `present` creates the directory (with any
  missing parents); `ensure` `absent` removes it and everything under it.
- `file` — `ensure` `present` makes the file hold exactly `content`;
  `ensure` `absent` deletes it.
- `json-patch` — the file is a JSON object the policy only partly owns.
  Each key of `set` is a dotted path whose value is written, creating
  intermediate objects as needed; each entry of `remove` is a dotted path
  that is deleted if present. Keys the policy does not name are left
  exactly as they are, in their existing order; new keys are appended in
  the order `set` lists them. A file that does not exist is treated as
  `{}` and created. Applying the same patch twice must leave the file
  byte for byte identical.
- `line` — `ensure` `present` means the exact line (compared ordinally)
  appears exactly once in the file: if it does not, every occurrence is
  removed and the line is appended once, and a missing file is created
  holding just that line. `ensure` `absent` removes every occurrence. The
  file is written as its lines joined by LF with a trailing LF, or empty
  when no lines are left.

Any other `type` is an error whose message is exactly
`Unknown resource type: <type>`.

    Get-StatePlan [-Root] <string> [-PolicyPath] <string>

Reports what an apply would do, without changing anything. One
`[pscustomobject]` per resource in policy order, with the properties
`Id`, `Type`, `Action`, `Reason`, in that order. Always an array.

`Reason` is `missing` (must exist and does not), `present` (must not
exist and does), `content` (exists but is not what the policy says), or
`ok`. `Action` follows from it: `create`, `delete`, `update`, `none`.

    Get-StateDrift [-Root] <string> [-PolicyPath] <string>

One `[pscustomobject]` per resource with `Id`, `Severity`, `Detail`, in
that order, same order, always an array. `Severity` is `major` for a
`create` or `delete`, `minor` for an `update`, `none` otherwise.
`Detail` is the plan's `Reason`.

    Invoke-StatePlan [-Root] <string> [-PolicyPath] <string>
                     [-WhatIf] [-Confirm]

Applies the policy and returns one `[pscustomobject]` with `Succeeded`
(`[bool]`), `Applied` (`[string[]]`), `Skipped` (`[string[]]`),
`RolledBack` (`[bool]`), `FailedId`, `Error`, in that order. `Applied`
lists the ids that needed work, `Skipped` the ids that were already in
line, both in policy order and both always `[string[]]`.

The run is all or nothing. If any resource fails, every change the run
made is undone — the site root is left exactly as it was when the run
started, byte for byte — and the result reports `Succeeded = $false`,
`RolledBack = $true`, empty `Applied` and `Skipped`, the failing
resource's id in `FailedId`, and its message in `Error`.

It must support `-WhatIf` and `-Confirm`. Under `-WhatIf` nothing is
written and the result reports what the run would have applied and
skipped, with `Succeeded = $true` and `RolledBack = $false`.

Use only what ships with PowerShell 7; do not add modules or reach off
the machine.
'''
timeout_secs = 1800
max_cost_usd = 4.0

