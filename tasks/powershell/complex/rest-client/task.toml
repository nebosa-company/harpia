id = "ps-c-rest-client"
title = "REST client module with retry and pagination"
stack = "powershell"
tier = "complex"
prompt = '''
`modules/ApiKit/ApiKit.psm1` holds three stubbed functions. Implement
them and package the folder as a module, so that

    Import-Module .\modules\ApiKit\ApiKit.psd1

exports exactly `New-ApiClient`, `Invoke-ApiRequest`, and
`Get-ApiPagedResult` and nothing else. Add
`modules/ApiKit/ApiKit.psd1` with `RootModule` `ApiKit.psm1`, a
`ModuleVersion`, a valid `GUID`, a non-empty `Description`, and an
explicit `FunctionsToExport` naming those three (no wildcard);
`Test-ModuleManifest` must accept it.

The client never opens a socket. It is handed a transport script block
and calls it as `& $transport $request`, where `$request` is a
`[pscustomobject]` with the properties `Method`, `Uri`, `Body`,
`Headers`, `Attempt`, in that order, and `Attempt` is the 1-based attempt
number. The transport returns an object with `StatusCode`, `Headers`, and
`Body`, or throws.

    New-ApiClient [-BaseUri] <string> [-Transport] <scriptblock>
                  [[-MaxRetries] <int>] [[-RetryDelayMs] <int>]

Returns a `[pscustomobject]` with `BaseUri`, `Transport`, `MaxRetries`,
`RetryDelayMs`, in that order. `BaseUri` is stored without a trailing
`/`. `-MaxRetries` defaults to 3 and the parameter restricts it to 0
through 10; `-RetryDelayMs` defaults to 100 and is restricted to 0
through 60000.

    Invoke-ApiRequest [-Client] <object> [-Path] <string>
                      [[-Method] <string>] [[-Body] <object>]
                      [[-Headers] <hashtable>]

Sends one logical request, retrying as needed, and returns a
`[pscustomobject]` with `Success` (`[bool]`), `StatusCode` (`[int]`),
`Body`, `Attempts` (`[int]`), `Delays` (`[int[]]`), `Error`, in that
order. The request `Uri` is the client's `BaseUri`, a `/`, and `-Path`
without its leading `/`. `-Method` defaults to `GET` and `-Headers`
reaches the transport as an empty hashtable when it is not given.

- A status of 200 through 299 is a success: `Success` is `$true`,
  `Error` is `$null`, `Body` is the response body.
- A status of 429, 500, 502, 503, or 504, and a transport that throws,
  are retried. Any other status is not.
- At most `MaxRetries + 1` attempts are made. `Attempts` reports how many
  actually happened.
- `Error` is `HTTP <status>` for a failing response, and the exception's
  message when the transport threw. When every attempt threw,
  `StatusCode` is 0 and `Body` is `$null`.
- The client does not sleep. `Delays` holds the back-off in milliseconds
  it worked out before each retry, so it has one entry fewer than
  `Attempts`. A delay is `RetryDelayMs * 2^(n-1)` for the n-th attempt,
  unless the failing response carried a `Retry-After` header (matched
  case-insensitively) holding a non-negative whole number of seconds
  under the invariant culture, in which case the delay is that many
  seconds in milliseconds. An unparsable `Retry-After` falls back to the
  doubling back-off. `Delays` is always an `[int[]]`.

    Get-ApiPagedResult [-Client] <object> [-Path] <string>
                       [[-MaxPages] <int>]

Walks a paged collection through `Invoke-ApiRequest`, starting at
`-Path`. Each response body carries an `items` list and, while there are
more pages, a `next` path to fetch. Returns every page's items
concatenated in order as an array — always an array, including for one
item and for none.

- `-MaxPages` defaults to 50 and the parameter restricts it to 1 through
  1000. A chain that would need more pages than that is an error whose
  message is exactly `Page limit exceeded`; a chain that fits exactly is
  fine.
- A request that does not succeed is an error whose message is exactly
  `Request failed: <status>`.

`fixtures/pages.json` is a captured three-page response set.

Use only what ships with PowerShell 7; do not add modules or reach off
the machine.
'''
timeout_secs = 1800
max_cost_usd = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_hidden.ps1"]
cmd = ["pwsh", "-NoProfile", "-NonInteractive", "-File", "oracle_hidden.ps1"]
weight = 4.0

