id = "ps-c-build-graph"
title = "Incremental build system over a content-hashed graph"
stack = "powershell"
tier = "complex"
prompt = '''
`MiniBuild.ps1` in the project root declares three functions. Implement
all three. `build/graph.json` and `src/` are a worked example.

A build graph is a JSON document:

    { "targets": [ { "name": "greet",
                     "inputs":  ["src/hello.txt", "src/world.txt"],
                     "outputs": ["out/greet.txt"],
                     "command": "concat src/hello.txt src/world.txt > out/greet.txt" } ] }

All paths are relative to the build root and written with `/`. A target
depends on another when one of its inputs is one of that target's
outputs.

The command language has exactly two verbs and never starts a process:

- `concat <in> [<in> ...] > <out>` — the inputs' text, joined in order,
  written to `<out>`;
- `upper <in> > <out>` — the input's text uppercased with the invariant
  culture.

Text is read and written as UTF-8 with no byte-order mark and is not
otherwise touched: no line endings are added, removed, or rewritten.
Missing output directories are created.

    Read-BuildGraph [-Path] <string>

Returns one `[pscustomobject]` per target with the properties `Name`,
`Inputs` (`[string[]]`), `Outputs` (`[string[]]`), `Command`, in that
order, in declaration order. Always an array. Two targets with the same
name is an error whose message is exactly `Duplicate target: <name>`.

    Get-BuildOrder [-Graph] <object[]> [[-Target] <string>]

Returns the target names as a `[string[]]` in an order where every target
comes after the targets it depends on. When several targets are ready at
the same time, the one whose name sorts first with ordinal comparison
goes first, so the order is the same on every machine. Always a
`[string[]]`.

With `-Target`, only that target and the targets it transitively depends
on are ordered. A name that is not in the graph is an error whose message
is exactly `Unknown target: <name>`. A dependency cycle is an error whose
message is exactly `Cycle detected: ` followed by the names that could
not be ordered, sorted with ordinal comparison and joined with `, `.

    Invoke-Build [-Root] <string> [-GraphPath] <string>
                 [[-Target] <string>] [-Force]

Builds in that order and returns one `[pscustomobject]` per target with
`Name` and `Status`, in that order. Always an array. `Status` is:

- `skipped` — the target is provably up to date: a cache entry exists for
  it, its command is unchanged, every input file's SHA-256 matches what
  the cache recorded, and every output file exists. Timestamps are never
  consulted.
- `built`   — the command ran and the cache entry was refreshed.
- `failed`  — one of its input files does not exist, or the target it
              depends on failed. A failed target runs nothing, produces
              nothing, and does not update the cache; every target that
              depends on it fails without being attempted.

`-Force` rebuilds every target in the order regardless of the cache, but
still fails on a missing input.

The cache lives at `.buildcache.json` in the build root and is valid
JSON.

Use only what ships with PowerShell 7; do not add modules or reach off
the machine.
'''
timeout_secs = 1800
max_cost_usd = 4.0

