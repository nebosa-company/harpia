id = "ps-m-advanced-function"
title = "Reading pipeline: parameter sets and streaming"
stack = "powershell"
tier = "mid"
prompt = '''
`MeasurementTools.ps1` in the project root declares three functions.
Implement all three so the dashboard's one-pass pipeline works:

    Import-ReadingFile data\readings.csv | Format-Reading -Celsius | Measure-Reading

    Import-ReadingFile [-Path] <string>

Reads a CSV with the columns `Sensor,Kelvin` (`data/readings.csv` is a
sample) and emits one `[pscustomobject]` per row with the properties
`Sensor` and `Kelvin` (`[double]`, parsed with the invariant culture), in
that order. Records are emitted one at a time, not collected first.

    Format-Reading [-Kelvin] <double> [-Sensor <string>]
                   [-Decimals <int>] [-Celsius] [-Fahrenheit]

An advanced function with two parameter sets, `Celsius` and
`Fahrenheit`, `Celsius` being the default. `-Celsius` belongs to the
first, `-Fahrenheit` to the second, so asking for both at once is a
binding error rather than a silent choice.

- `-Kelvin` is mandatory and accepts pipeline input both by value and by
  property name.
- `-Sensor` binds by property name and defaults to `unknown`.
- `-Decimals` defaults to 2 and is restricted to 0 through 6 by the
  parameter itself.
- Readings are converted one at a time as they arrive, not buffered.

For each reading, emit one `[pscustomobject]` with the properties
`Sensor`, `Kelvin`, `Scale`, `Value`, `Text`, in that order. `Scale` is
`C` or `F`. `Value` is `[double]`: `Kelvin - 273.15` for celsius, that
converted with `x * 9 / 5 + 32` for fahrenheit, rounded to `-Decimals`
places away from zero. `Text` is the value rendered with exactly
`-Decimals` digits under the invariant culture, then a space, then the
scale letter — `27.00 C`.

    Measure-Reading [-Reading] <psobject[]>

An advanced function that accumulates the readings piped into it and
emits **exactly one** summary `[pscustomobject]` when the pipeline ends,
with the properties `Count` (`[int]`), `Scale`, `Min`, `Max`, `Mean`, in
that order. It reads each reading's `Value` and `Scale`.

- `Scale` is the common scale, or `mixed` when they differ.
- `Mean` is rounded to 4 places away from zero.
- For an empty pipeline it still emits one row: `Count` 0 and `Scale`,
  `Min`, `Max`, `Mean` all `$null`.
- It also works when the readings are passed as an argument instead of
  piped.

Use only what ships with PowerShell 7; do not add modules or reach off
the machine.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_hidden.ps1"]
cmd = ["pwsh", "-NoProfile", "-NonInteractive", "-File", "oracle_hidden.ps1"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_edge.ps1"]
cmd = ["pwsh", "-NoProfile", "-NonInteractive", "-File", "oracle_edge.ps1"]
