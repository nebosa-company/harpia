id = "ps-m-parallel-map"
title = "Order-preserving parallel batch mapper"
stack = "powershell"
tier = "mid"
prompt = '''
`Invoke-ParallelMap.ps1` in the project root declares one function.
Implement it.

    Invoke-ParallelMap [-InputObject] <object[]> [-ScriptBlock] <scriptblock>
                       [[-ThrottleLimit] <int>]

Runs `-ScriptBlock` once for every item in `-InputObject`, with several
items in flight at a time — the items are independent and the work is
I/O bound, so a plain sequential loop is not what this is for. Use
whatever PowerShell 7 offers for that (`ForEach-Object -Parallel`, a
runspace pool, thread jobs); no extra modules.

`-ThrottleLimit` is how many may be in flight at once. It defaults to 4
and the parameter itself restricts it to 1 through 64.

Inside the block, the item is `$_`. The block is evaluated against the
item alone — it does not see variables from the caller's scope.

Returns one `[pscustomobject]` per item with these properties, in this
order:

- `Index`   — `[int]`, the item's 0-based position in `-InputObject`
- `Input`   — the item itself
- `Success` — `[bool]`
- `Result`  — what the block emitted: `$null` for nothing, the single
              object for one, an `[object[]]` of them in order for more
- `Error`   — `$null` on success, otherwise the failure's message

Rules:

- Records come back in input order however the work finished.
- An item whose block throws, or writes to the error stream, is reported
  with `Success = $false`, `Result = $null`, and the message in `Error`.
  It must not stop the other items, and the function itself must not
  throw because of it.
- The return value is always an array, including for an empty batch and
  a batch of one.

Use only what ships with PowerShell 7; do not add modules or reach off
the machine.
'''
timeout_secs = 720
max_cost_usd = 1.0

