id = "node-m-ratelimit"
title = "Fix the rate-limit middleware"
stack = "node"
tier = "mid"
timeout_secs = 720
max_cost_usd = 1.0
prompt = '''
`ratelimit.mjs` implements the fixed-window rate limiter that fronts our
public API. Its contract:

    rateLimit({ windowMs, max, now = Date.now,
                key = (req) => req.socket.remoteAddress })
      -> middleware(req, res, next)

- Requests are counted per client key in fixed windows of `windowMs`
  milliseconds. A client's first request opens its window; up to `max`
  requests (in total, including that first one) are allowed inside it.
- A request arriving at or after `windowStart + windowMs` opens a FRESH
  window for that client: the window start becomes that request's time and
  the request counts as 1 of `max`.
- Allowed request: the middleware sets the response headers
  `X-RateLimit-Limit` (max, as a string) and `X-RateLimit-Remaining`
  (requests left in the window after this one), then calls `next()`
  exactly once. It must not touch the response body.
- Blocked request (window still active and `max` already used): respond
  `429` with Content-Type `application/json` and body
  `{"error":"rate limit exceeded","retryAfterMs":N}` where N is the ms
  until the client's window ends, plus a `Retry-After` header of
  `Math.ceil(N / 1000)` seconds (as a string). A blocked request must NOT
  call `next()` and must not increment the client's count.
- Different keys are fully independent. `now` and `key` are injectable.

Two symptoms from production, observed together since the last deploy:

1. Once a client gets throttled it stays throttled forever — even minutes
   after its window expired, every request still comes back 429.
2. The access logs show downstream handlers running for requests that were
   answered 429, and the error tracker is full of
   ERR_HTTP_HEADERS_SENT crashes that line up with throttled traffic.

Fix `ratelimit.mjs` so the middleware meets the contract above. Keep the
export name and the option shapes unchanged.
'''

[[oracles]]
