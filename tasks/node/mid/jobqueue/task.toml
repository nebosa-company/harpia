id = "node-m-jobqueue"
title = "Retry/backoff job queue"
stack = "node"
tier = "mid"
timeout_secs = 720
max_cost_usd = 1.0
prompt = '''
Implement `jobqueue.mjs` in the project root as an ES module with one named
export:

    createQueue(options = {}) -> queue

Options (all optional): `concurrency` (default 1), `maxRetries` (default
0), `baseDelayMs` (default 0), and `schedule` (default wraps setTimeout),
where `schedule(fn, delayMs)` is the ONLY mechanism the queue may use to
wait out retry delays — it is injected so schedulers can be replaced.

Queue API:

    queue.push(job) -> Promise

- `job` is a function called as `job(attempt)` with `attempt` starting at
  1. It may return a value, a promise, or throw.
- Jobs start in FIFO order; at most `concurrency` jobs are running at any
  moment.
- If an attempt fails and the job has retries left (a job gets
  `maxRetries + 1` total attempts), the queue calls
  `schedule(cb, baseDelayMs * 2^(attempt-1))` — so attempt 1's retry
  waits baseDelayMs, attempt 2's retry waits 2*baseDelayMs, then 4x, etc.
  When the scheduler fires `cb`, the job re-enters the BACK of the waiting
  queue with the next attempt number.
- A job waiting out a retry delay does NOT hold a concurrency slot; other
  waiting jobs run in the meantime.
- After the final failed attempt the promise returned by `push` rejects
  with that last error. On any successful attempt it resolves with the
  job's value.
- A failing job must never produce an unhandled rejection.

    queue.size() -> number of jobs waiting to start (not running, not
                    waiting out a delay)
    queue.active() -> number of jobs running right now
    queue.onIdle() -> Promise that resolves once the queue is completely
                      drained: nothing waiting, nothing running, and no
                      retry delay pending. Resolves immediately if the
                      queue is already idle.

Create the file exactly at `jobqueue.mjs` (replace the placeholder) with
the named export `createQueue`.
'''

