id = "node-m-jwt"
title = "HMAC JWT via node:crypto"
stack = "node"
tier = "mid"
timeout_secs = 720
max_cost_usd = 1.0
prompt = '''
Implement `jwt.mjs` in the project root as an ES module implementing
HS256 JSON Web Tokens with node:crypto only (no npm packages). Three named
exports:

    sign(payload, secret, options = {}) -> token string

- `payload` must be a plain object and `secret` a string or Buffer
  (`TypeError` otherwise).
- `options`: `expiresIn` (seconds), `notBefore` (seconds), `now` (function
  returning milliseconds, default `Date.now`; injectable for tests).
- Claims: `iat = Math.floor(now() / 1000)` is always set; `exp = iat +
  expiresIn` and `nbf = iat + notBefore` are set when the option is given.
  These computed claims override same-named payload properties.
- The header is exactly `{ alg: "HS256", typ: "JWT" }`, serialized with
  JSON.stringify in that key order. The payload is JSON.stringify of the
  original payload's properties (in their own order) followed by `iat`,
  then `exp`, then `nbf` as applicable.
- Encoding: base64url without padding for header, payload, and the
  HMAC-SHA256 signature of `headerPart + "." + payloadPart` keyed by
  `secret`. Token = the three parts joined with ".".

    verify(token, secret, options = {}) -> payload object

- `options.now` as above. Checks in this order, each failing with an Error
  carrying the given `code` property:
  1. structure: not a string / not 3 dot-separated parts / parts that do
     not decode to JSON objects / header alg not "HS256" (a typ field, if
     present, must be "JWT") -> code "ERR_JWT_MALFORMED";
  2. signature: recompute and compare in constant time
     (crypto.timingSafeEqual) -> code "ERR_JWT_SIGNATURE";
  3. `exp` claim (when a number): expired when
     `Math.floor(now()/1000) >= exp` -> code "ERR_JWT_EXPIRED";
  4. `nbf` claim (when a number): not yet valid when
     `Math.floor(now()/1000) < nbf` -> code "ERR_JWT_NOT_BEFORE".
- On success returns the decoded payload object.

    decode(token) -> { header, payload } | null

- No verification at all; null when the structure is malformed.

Create the file exactly at `jwt.mjs` (replace the placeholder) with the
three named exports.
'''

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_core.mjs"]
cmd = ["node", "--test", "tests_hidden_core.mjs"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_edge.mjs"]
cmd = ["node", "--test", "tests_hidden_edge.mjs"]
weight = 2.0

[[oracles]]
kind = "security"
check = "injection-canary"

[[oracles]]
