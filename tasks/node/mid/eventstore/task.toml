id = "node-m-eventstore"
title = "Event store with projections"
stack = "node"
tier = "mid"
timeout_secs = 720
max_cost_usd = 1.0
prompt = '''
Implement `eventstore.mjs` in the project root as an ES module exporting a
class named `EventStore` (named export). It is an in-memory, append-only
event store with live projections.

Events and streams:

    append(streamId, type, data, options = {}) -> event record

- Appends an event to the stream `streamId` and returns the stored record
  `{ seq, streamId, version, type, data }`:
  - `seq`: global sequence number across ALL streams, starting at 1 and
    incrementing by 1 per append;
  - `version`: this stream's own counter, starting at 1 per stream.
- `options.expectedVersion`, when provided, is optimistic concurrency: it
  must equal the stream's current version (0 for a stream with no events
  yet). On mismatch, throw an Error with `code` property "CONCURRENCY" and
  do not append.

    readStream(streamId) -> array

- All events of that stream in version order; [] for an unknown stream.

    readAll(options = {}) -> array

- All events across streams in `seq` order. `options.fromSeq` (default 1)
  is an inclusive lower bound on `seq`.

Projections:

    registerProjection(name, { init, apply }) -> void

- `init()` returns the projection's initial state; `apply(state, event)`
  returns the next state. Registering IMMEDIATELY replays every event
  already in the store (in seq order) through `apply`, then every later
  append updates the projection with the new event.
- Registering a name twice throws an Error with `code`
  "DUPLICATE_PROJECTION".

    getProjection(name) -> current state

- Unknown name: throw an Error with `code` "UNKNOWN_PROJECTION".

Determinism: same appends in the same order always produce identical
records and projection states. A projection registered after N events must
end up in exactly the same state as one registered before them.

Create the file exactly at `eventstore.mjs` (replace the placeholder) with
the named export `EventStore`.
'''

[[oracles]]
