id = "node-m-cliargs"
title = "CLI argument parser"
stack = "node"
tier = "mid"
timeout_secs = 720
max_cost_usd = 1.0
prompt = '''
Implement `cliargs.mjs` in the project root as an ES module with one named
export:

    parseArgs(spec, argv) -> { values, positionals }

`spec.options` maps a long option name to a descriptor:
`{ type, short, default, multiple }` where `type` is "string", "number" or
"boolean"; `short` is an optional single-character alias; `default` is an
optional default value; `multiple: true` collects repeats into an array.
`argv` is the raw argument array (no node/script prefix).

Parsing rules:
- `--name` — for a boolean option sets it true. For string/number options
  the NEXT argv element is the value (`--out file.txt`); `--name=value`
  also works for string/number.
- `--no-name` sets the boolean option `name` to false.
- `-s` uses the short alias. Short booleans may bundle: `-abc` is `-a -b
  -c` and every letter in a bundle must be a boolean option. A
  string/number short must stand alone (`-o out.txt` — the next element is
  the value).
- A lone `--` ends option parsing; everything after it is positional
  verbatim. Any other argument not starting with "-" is positional. A
  bare "-" is positional too.
- number values must parse via `Number(...)` to a finite number.
- `multiple: true` options collect every occurrence in order into an
  array. Without `multiple`, the LAST occurrence wins.

Results:
- `values` holds every option keyed by its LONG name. Options absent from
  argv get their `default` if one was declared; a `multiple` option with
  no default and no occurrences gets []; other absent options without a
  default are simply not present as keys (own-property absent).
- `positionals` is an array of strings in order.

Errors — throw an Error with a `code` property (and mention the offending
token in the message):
- "UNKNOWN_OPTION": an option (long or short) not in the spec;
- "MISSING_VALUE": a string/number option at the end of argv with no value
  element, or `--name=` given for a number option with an empty value, or
  a non-boolean short inside a bundle;
- "INVALID_VALUE": a number option whose value is not a finite number, a
  boolean given `--name=value` form, or `--no-` applied to a non-boolean.

Create the file exactly at `cliargs.mjs` (replace the placeholder) with
the named export `parseArgs`.
'''

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_core.mjs"]
cmd = ["node", "--test", "tests_hidden_core.mjs"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_edge.mjs"]
cmd = ["node", "--test", "tests_hidden_edge.mjs"]
weight = 2.0

