id = "node-c-jsonlquery"
title = "JSONL query engine with indexes"
stack = "node"
tier = "complex"
timeout_secs = 1800
max_cost_usd = 4.0
prompt = '''
Implement `jsonldb.mjs` in the project root as an ES module exporting a
class named `JsonlDatabase` (named export). Node built-ins only.

Construction:
- `new JsonlDatabase(text)`: `text` is JSONL — one JSON object per line.
  Lines that are empty or whitespace-only are skipped. A line that fails
  to parse, or parses to anything other than an object, throws an Error
  whose message contains the 1-based line number. Records keep input
  order (their "record order").
- `static async fromFile(path)`: reads the file as UTF-8 and constructs a
  database from it.
- `count()`: number of records.

Queries — `find(query)` returns matching records; `query` may contain:
- `where`: map of top-level field name -> condition, AND-ed across
  fields. A condition is either a scalar (string/number/boolean/null,
  meaning strict equality) or an object of operators: `$eq`, `$ne`,
  `$in` (array, strict-equality membership), `$gt`, `$gte`, `$lt`,
  `$lte` — multiple operators AND together. A record missing the field is
  treated as having the value `null`. Ordering operators only match when
  the record value and the bound are BOTH numbers or BOTH strings;
  anything else (null, booleans, mixed types) does not match. An unknown
  `$op` key throws an Error naming it.
- `orderBy`: `[field, "asc"|"desc"]`. Sort is by the field value with the
  cross-type order null < numbers < strings < booleans (false < true),
  numbers numerically, strings lexicographically; the sort is STABLE with
  respect to record order. Any other direction string throws an Error.
  Without `orderBy` results stay in record order.
- `offset` (default 0) then `limit` (default unlimited), applied after
  ordering. Both must be non-negative integers (RangeError otherwise).
- `select`: array of field names; each result becomes a fresh object with
  only those fields (fields the record lacks are omitted).

Indexes:
- `createIndex(field)`: builds an index on a top-level field (records
  missing it are indexed under `null`). Calling it again for the same
  field is a no-op. Indexes must speed up lookups AND stay correct.
- The query planner uses the FIRST field in `where`'s own-key order that
  (a) has an index and (b) has an index-usable condition: a scalar, or an
  operator object containing `$eq`, `$in`, or at least one of
  `$gt`/`$gte`/`$lt`/`$lte`. (`$ne` alone is not index-usable.) The index
  narrows the candidate set to exactly the records whose indexed value
  satisfies that field's value constraints; the remaining conditions are
  then checked only against those candidates.
- `explain(query)` returns `{ index, scanned }`: `index` is the chosen
  field name or null, and `scanned` is the EXACT number of candidate
  records `find` would examine — the index-narrowed candidate count when
  an index is used, `count()` otherwise. For a range condition on an
  indexed field, `scanned` must equal the number of records inside the
  value window.
- `find` and `explain` agree, and `find` returns identical results with
  or without indexes (candidates keep record order).

Create the file exactly at `jsonldb.mjs` (replace the placeholder) with
the named export `JsonlDatabase`.
'''

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_core.mjs"]
cmd = ["node", "--test", "tests_hidden_core.mjs"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_edge.mjs"]
cmd = ["node", "--test", "tests_hidden_edge.mjs"]
weight = 2.0

[[oracles]]
kind = "security"
check = "injection-canary"

[[oracles]]
