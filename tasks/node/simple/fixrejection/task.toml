id = "node-s-fixrejection"
title = "Fix the crashing source ingester"
stack = "node"
tier = "simple"
timeout_secs = 300
max_cost_usd = 0.25
prompt = '''
The file `ingest.mjs` exports `ingestAll(sources)`, the fan-in step of our
feed pipeline. Its contract:

- `sources` is an array of `{ name, read }` where `read()` returns a
  promise for that source's payload.
- All reads are started concurrently — a slow source must not delay
  starting the others.
- It resolves to `{ ok, failed }`:
  - `ok`: one `{ name, value }` per successful source, in input order;
  - `failed`: one `{ name, error }` per failed source, in input order,
    where `error` is the rejection's `.message` if it is an Error, else
    `String(reason)`.
- Every source appears in exactly one of the two lists. An empty `sources`
  array resolves to `{ ok: [], failed: [] }`.
- `ingestAll` itself never rejects, and no rejection may escape it: the
  process must never see an unhandled promise rejection because a source
  failed.

The bug: in production, whenever one feed fails the process sometimes dies
with ERR_UNHANDLED_REJECTION, and sources listed after a failing one are
missing from the report entirely. A single bad feed is taking down the
whole ingest run.

Fix `ingest.mjs` so the module meets the contract above. Keep the export
name and signature unchanged, and keep reads concurrent.
'''

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_core.mjs"]
cmd = ["node", "--test", "tests_hidden_core.mjs"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_edge.mjs"]
cmd = ["node", "--test", "tests_hidden_edge.mjs"]
weight = 2.0

