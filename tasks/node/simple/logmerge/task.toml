id = "node-s-logmerge"
title = "Log stream merge and dedupe"
stack = "node"
tier = "simple"
timeout_secs = 300
max_cost_usd = 0.25
prompt = '''
Implement `logmerge.mjs` in the project root as an ES module with two named
exports.

A well-formed log line looks like:

    2024-05-01T12:00:00.000Z [INFO] server started

i.e. an ISO-8601 UTC timestamp with exactly three millisecond digits and a
trailing "Z", one space, an upper-case level in square brackets (one or
more A-Z characters), one space, then the message (which may be empty; a
line may also end right after the "]").

    parseLine(line) -> { ts, level, message } | null

- `ts` is the timestamp string exactly as it appeared, `level` the text
  inside the brackets, `message` the rest (empty string when absent).
- Returns `null` for anything malformed: wrong timestamp shape, a
  timestamp that is not a real date (e.g. month 13), lower-case or missing
  level, missing brackets, extra spacing between the parts, or a non-string
  argument.

    mergeLogs(sources) -> array of strings

- `sources` is an array of arrays of raw lines. Conceptually the sources
  are concatenated in order, malformed lines are dropped, and the valid
  entries are sorted ascending by timestamp instant.
- The sort is stable: entries with the same timestamp stay in concatenated
  order (everything from sources[0] before sources[1], and original order
  within a source).
- Exact duplicates — same timestamp string, level, and message — are
  deduplicated: only the first occurrence (in concatenated order) is kept.
- Output lines are re-serialized canonically: `TS [LEVEL] MESSAGE`, with a
  single trailing space stripped when the message is empty (i.e. the line
  ends after "]").

Create the file exactly at `logmerge.mjs` (replace the placeholder) with
named exports `parseLine` and `mergeLogs`.
'''

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_core.mjs"]
cmd = ["node", "--test", "tests_hidden_core.mjs"]
weight = 4.0

