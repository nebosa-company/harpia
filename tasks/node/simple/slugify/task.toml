id = "node-s-slugify"
title = "Unicode-aware slugifier"
stack = "node"
tier = "simple"
timeout_secs = 300
max_cost_usd = 0.25
prompt = '''
Implement `slugify.mjs` in the project root as an ES module with a named
export:

    slugify(input, options = {}) -> string

Behavior:
- `input` must be a string; any other value throws a `TypeError`.
- Every `&` in the input is treated as the word "and".
- Accented Latin letters lose their diacritics (e.g. "Crème Brûlée"
  contributes "creme brulee").
- The result is lowercase. Only the characters a-z and 0-9 survive; every
  maximal run of any other characters becomes a single separator. The result
  never starts or ends with a separator.
- `options.separator` (default "-") is the separator string. It may be the
  empty string, in which case the surviving parts are joined directly.
- `options.maxLength` (default: unlimited) truncates the finished slug to at
  most that many characters; after truncating, any trailing separator
  occurrences are stripped.
- An empty input, or one with no alphanumeric characters at all, slugifies
  to "".

Examples:
    slugify("  Hello,   World!  ")                      -> "hello-world"
    slugify("Rock & Roll")                              -> "rock-and-roll"
    slugify("Crème Brûlée")                             -> "creme-brulee"
    slugify("Hello World", { separator: "_" })          -> "hello_world"
    slugify("hello world friends", { maxLength: 12 })   -> "hello-world"

Create the file exactly at `slugify.mjs` (replace the placeholder that is
already there) and keep the export named `slugify`.
'''

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_core.mjs"]
cmd = ["node", "--test", "tests_hidden_core.mjs"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_edge.mjs"]
cmd = ["node", "--test", "tests_hidden_edge.mjs"]
weight = 2.0

