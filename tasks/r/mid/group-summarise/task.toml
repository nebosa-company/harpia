id = "r-m-group-summarise"
title = "Grouped summaries to an exact contract"
stack = "r"
tier = "mid"
prompt = '''
Fill in `groupby.R` in the project root (a stub is already there) with three
grouping helpers built on base R alone — no package may be attached.

Common rules for all three: `by` is a character vector of one or more
column names. Group keys are compared **as character**, and a row whose key
is `NA` in any of the `by` columns belongs to no group at all. If any column
named in the arguments is absent from `df`, call `stop()` with the message
`sprintf("no such column: %s", <name>)` and `call. = FALSE`, naming the
first missing column in the order the names were given.

- `summarise_by(df, by, specs)`
  `specs` is a named list; each element is itself a list with two entries,
  `col` (the name of the column to summarise) and `fn` (a function taking
  that column's values for one group and returning a single number).

  Return a data frame whose first columns are the `by` columns, in the order
  given and **keeping the types they have in `df`**, followed by one column
  per spec — named after the spec, in spec order, and always **double**. It
  has one row per distinct group, sorted ascending by the first key, then by
  the second, and so on, compared as character. Row names are the default
  `1..n`. When no rows survive, the result is a zero-row frame that still
  carries every one of those columns with those types.

- `count_by(df, by)`
  The same shape, but with a single trailing column named `n` holding the
  **integer** number of rows in each group.

- `add_group_share(df, by, value)`
  Return `df` with one extra column appended, named `share` and double,
  holding each row's `value` divided by the total of `value` over its group.
  The rows stay in their original order and the row names become `1..n`.
  `NA` values are left out of a group's total but their own share is `NA`.
  A row that belongs to no group has an `NA` share, and so does every row of
  a group whose total comes to exactly zero.

Use base R only; do not attach any package.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden.R"]
cmd = ["C:/Program Files/R/R-4.6.1/bin/Rscript.exe", "--vanilla", "tests_hidden.R"]
