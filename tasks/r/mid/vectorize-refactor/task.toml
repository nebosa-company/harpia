id = "r-m-vectorize-refactor"
title = "Vectorise the series helpers and extend them"
stack = "r"
tier = "mid"
prompt = '''
`series.R` holds four time-series helpers that were written with explicit
loops and are now the slowest step of the nightly run. `tests_visible.R`
documents and exercises their current behavior; run it with
`Rscript --vanilla tests_visible.R` and it should print `ok`.

Two things are wanted.

**1. Rewrite `series.R` without explicit loops.** No function you leave
defined in `series.R` — the four below, the two new ones, and any helper you
add — may contain a `for`, `while` or `repeat`. Use vectorised base R and
the apply family (`cumsum`, `diff`, `embed`, `rowMeans`, `vapply`, `Map`,
`Reduce`, `outer`, …). The observable behavior of the four existing
functions must not change at all, including their treatment of `NA`, of
zero-length input and of the error case:

- `running_total(x)` — a double vector of the same length; element `i` is
  the sum of `x[1]` through `x[i]`, so an `NA` carries forward from where it
  appears.
- `pct_change(x)` — a double vector of the same length; the first element is
  `NA_real_`, and element `i` is `(x[i] - x[i-1]) / x[i-1]`. A previous
  value of exactly zero gives `NA_real_` rather than an infinity.
- `rolling_mean(x, k)` — a double vector of the same length; the first
  `k - 1` elements are `NA_real_`, and element `i` from `k` onward is the
  mean of the `k` values ending at `i`. A window containing an `NA` is
  `NA_real_`. A `k` larger than the input gives all `NA_real_`, and
  `k < 1` is `stop("k must be at least 1", call. = FALSE)`.
- `zscore(x)` — a double vector of the same length: `x` centred on the mean
  of its non-`NA` values and divided by their standard deviation. If there
  are fewer than two non-`NA` values, or the standard deviation is zero,
  every element is `NA_real_`.

**2. Add two more functions to the same file,** to the same no-loop rule.

- `rolling_max(x, k)` — exactly the windowing rule of `rolling_mean`,
  including the `NA` handling, the oversized-`k` case and the same error for
  `k < 1`, but taking the window's maximum. The result is always double.
- `ewma(x, alpha)` — the exponentially weighted moving average: the first
  element is `x[1]`, and element `i` is
  `alpha * x[i] + (1 - alpha) * <element i-1>`. The result is a double
  vector of the same length, and zero-length input gives `numeric(0)`.
  `alpha` must be a single number greater than 0 and at most 1; anything
  else is `stop("alpha must be in (0, 1]", call. = FALSE)`.

Do not change `tests_visible.R`, and do not rename or re-signature any of
the four existing functions. Use base R only; do not attach any package.
'''
timeout_secs = 720
max_cost_usd = 1.0

