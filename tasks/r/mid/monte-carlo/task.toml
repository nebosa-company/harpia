id = "r-m-monte-carlo"
title = "Seeded vectorised Monte Carlo"
stack = "r"
tier = "mid"
prompt = '''
Fill in `mc.R` in the project root (a stub is already there) with four
simulation helpers. The results have to be reproducible byte for byte, so
the way random numbers are drawn is part of the specification: follow the
recipes below exactly, in the order given, and do not change the generator
kind or draw anything extra.

- `simulate_paths(n_steps, n_paths, seed)`
  A batch of `n_paths` independent `+1`/`-1` random walks, each `n_steps`
  long. Call `set.seed(seed)`, then draw all the steps in a **single** call
  to `sample(c(-1L, 1L), n_steps * n_paths, replace = TRUE)`, and lay them
  into a matrix with `n_steps` rows and `n_paths` columns filling column by
  column (R's default). Return the matrix of running totals: same
  dimensions, **integer**, with element `[i, j]` the sum of the first `i`
  steps of path `j`. The returned value is always a matrix, including when
  there is only one step or only one path.

- `path_stats(paths)`
  Takes a matrix as returned above. Return a data frame with four integer
  columns: `path` (1 up to the number of columns), `final` (the value in the
  last row), `high` (the column's maximum) and `low` (its minimum). Row
  names are the default `1..n`.

- `ruin_rate(paths, barrier)`
  The proportion of paths — a double between 0 and 1 — that at some point
  reach `-barrier` or below. A matrix with no columns gives `0`.

- `mc_pi(n, seed)`
  Call `set.seed(seed)`, then draw `x <- runif(n)` followed by
  `y <- runif(n)`, in that order and in exactly two calls. Return
  `4 * mean(x^2 + y^2 <= 1)` as a double.

Use base R only; do not attach any package.
'''
timeout_secs = 720
max_cost_usd = 1.0

