id = "r-m-lazy-capture"
title = "Function factories that all come out the same"
stack = "r"
tier = "mid"
prompt = '''
`factories.R` holds the rule engine's function factories — `make_adder`,
`make_scaler`, `make_prefixer`, `make_clamp` — and four `build_*` helpers
that turn a vector of settings into a list of ready-made functions.

Two problems have been reported:

1. When a batch is built with one of the `build_*` helpers, **every**
   function in the returned list behaves as though it had been made from the
   last entry. `build_adders(c(10, 20, 30))` gives three functions that all
   add 30; `build_clamps(c(0, 10), c(5, 20))` gives two clamps that both
   clamp to `[10, 20]`. The list has the right length and the right order,
   the functions are simply all wrong in the same way.
2. Even away from the batch helpers, a factory does not capture what it was
   given. After

       a <- 10
       f <- make_adder(a)
       a <- 99

   `f(0)` returns 99 rather than 10 — the function tracks the caller's
   variable instead of the value it was built with.

The intended behavior is:

- `make_adder(n)` returns a function of `x` giving `x + n`;
  `make_scaler(k)` gives `x * k`; `make_prefixer(prefix)` gives
  `paste0(prefix, x)`; `make_clamp(lo, hi)` gives `x` limited to the range
  `[lo, hi]`, working element-wise over a vector `x`.
- Each factory fixes its settings **at the moment it is called**. Whatever
  the caller does to its own variables afterwards can never change the
  function that was handed back.
- `build_adders(ns)`, `build_scalers(ks)`, `build_prefixers(prefixes)` and
  `build_clamps(los, his)` each return a list of functions, one per element
  of their input and in the same order, where the i-th function behaves
  exactly as though the matching factory had been called on its own with
  the i-th settings. An empty input gives an empty list.

Find and fix the defect. Keep the public API exactly as it is: the same
eight function names, with the same parameter names in the same order. Use
base R only; do not attach any package.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden.R"]
cmd = ["C:/Program Files/R/R-4.6.1/bin/Rscript.exe", "--vanilla", "tests_hidden.R"]
weight = 4.0

