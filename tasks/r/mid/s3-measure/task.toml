id = "r-m-s3-measure"
title = "An S3 measurement class with printing and summaries"
stack = "r"
tier = "mid"
prompt = '''
Fill in `measure.R` in the project root (a stub is already there) with a
small S3 class that carries a unit along with its numbers.

**Representation.** A `measure` is a double vector with an attribute `unit`
holding a single string, and class `"measure"` — nothing else. `length()`
therefore works on it out of the box.

- `measure(value, unit)`
  The constructor. `value` must be numeric, otherwise
  `stop("value must be numeric", call. = FALSE)`. `unit` must be a single
  non-`NA`, non-empty character string, otherwise
  `stop("unit must be a single non-empty string", call. = FALSE)`. The
  stored values are doubles, and the returned object carries no attributes
  beyond `unit` and its class.

- `unit_of(x)` — the unit string.

- `format.measure(x, digits = 2, ...)`
  A character vector, one entry per value: the number printed with exactly
  `digits` digits after the decimal point, a single space, then the unit —
  `"1.50 kg"`. A zero-length measure formats to `character(0)`.

- `print.measure(x, ...)`
  Writes a header line `<measure [n] unit>` where `n` is the number of
  values, then one line per value as `format()` renders it. For
  `measure(c(1.5, 2, 3.25), "kg")` the output is exactly these four lines:

      <measure [3] kg>
      1.50 kg
      2.00 kg
      3.25 kg

  A zero-length measure prints only its header line. Returns `invisible(x)`.

- `summary.measure(object, ...)`
  Returns an object of class `"summary_measure"`: a list with, in this
  order, `n` (integer, how many values are not `NA`), `mean`, `min`, `max`
  (doubles over the non-`NA` values, each `NA_real_` when there are none)
  and `unit` (character).

- `print.summary_measure(x, ...)`
  For the measure above, exactly these five lines — the labels are padded to
  five characters, and the three statistics are shown to two decimals:

      measure summary (kg)
        n    : 3
        mean : 2.25
        min  : 1.50
        max  : 3.25

  A statistic that is `NA` prints as the bare text `NA`, with no padding of
  its own. Returns `invisible(x)`.

- `+.measure`
  Adding two measures requires the same unit; otherwise
  `stop(sprintf("unit mismatch: %s vs %s", <left unit>, <right unit>),
  call. = FALSE)`. Adding a plain number to a measure — in either order —
  adds it to every value and keeps the unit. The result is always a
  `measure`.

- `[.measure`
  Subsetting keeps the class and the unit.

Use base R only; do not attach any package.
'''
timeout_secs = 720
max_cost_usd = 1.0

