id = "r-m-lm-wrapper"
title = "A tidy wrapper around lm"
stack = "r"
tier = "mid"
prompt = '''
`lm` returns everything a linear model could possibly carry, in shapes that
are awkward to feed onward — matrices with row names, list elements with
dots in their names, vectors carrying observation labels. Fill in
`fitwrap.R` in the project root (a stub is already there) with a small
wrapper that hands back plain data frames instead.

- `fit_model(data, formula)` — note the argument order, data first.
  `data` must be a data frame, otherwise
  `stop("data must be a data frame", call. = FALSE)`; `formula` must be a
  formula, otherwise `stop("formula must be a formula", call. = FALSE)`.
  Fit the model with `lm`, and return a list of class `"fitwrap"` whose
  elements are, in order, `fit` (the `lm` object itself), `formula` (the
  formula as given) and `nobs` (an integer: how many observations the fit
  actually used, which is fewer than `nrow(data)` when rows were dropped
  for missing values).

The four functions below all take a `"fitwrap"`; anything else is
`stop("expected a fitwrap object", call. = FALSE)`. All of them return
plain data frames with the default row names `1..n`.

- `tidy_coefs(model)`
  One row per coefficient, in the model's own term order, with columns
  `term` (character, the coefficient's name), then `estimate`, `std_error`,
  `statistic` and `p_value` — the four columns of the coefficient table that
  `summary()` produces, as doubles and with no names of their own.

- `glance_fit(model)`
  A single row with `r_squared`, `adj_r_squared` and `sigma` as doubles,
  then `df_residual` and `nobs` as integers.

- `predict_frame(model, newdata)`
  `newdata`'s own columns, unchanged and in their original order, plus one
  more double column named `.fitted` holding the model's prediction for
  each row.

- `residual_summary(model)`
  A single row with `min`, `q1`, `median`, `q3` and `max` as doubles: the
  five-number summary of the fit's residuals, using `quantile`'s default
  type 7 and carrying no names.

Use base R only. `stats` is part of R itself and is already attached, so
`lm`, `summary`, `predict` and `quantile` are available; do not attach
anything further.
'''
timeout_secs = 720
max_cost_usd = 1.0

