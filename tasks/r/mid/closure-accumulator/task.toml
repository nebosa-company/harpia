id = "r-m-closure-accumulator"
title = "Stateful modules built out of closures"
stack = "r"
tier = "mid"
prompt = '''
Fill in `accum.R` in the project root (a stub is already there) with three
factory functions. Each returns a **list of functions** that share private
state held in the factory call's own environment — no global variables, no
attributes on the returned list, and two objects made by the same factory
must never see each other's state.

- `make_accumulator(start = 0)`
  Returns a list with exactly the elements `add`, `total`, `count`,
  `history` and `reset`, in that order.
    * `add(x)` — `x` is a numeric vector of any length. Every element is
      appended to the history and added to the running total. Returns the
      new total **invisibly**. A non-numeric `x` is
      `stop("add expects a numeric value", call. = FALSE)`.
    * `total()` — the running total as a double; it begins at `start`.
    * `count()` — an integer: how many values have been added so far,
      counting elements rather than calls.
    * `history()` — a double vector of the values added, in order; it begins
      as `numeric(0)`.
    * `reset()` — puts the total back to `start` and empties the history.
      Returns `invisible(NULL)`.

- `make_tally()`
  Returns a list with exactly `hit`, `counts` and `top`, in that order.
    * `hit(label)` — `label` is a single non-`NA` character string;
      increments that label's counter and returns the new count invisibly as
      an integer. Anything else is
      `stop("hit expects a single label", call. = FALSE)`.
    * `counts()` — a named integer vector of the counts, sorted by label
      ascending. Before anything is recorded it has length zero.
    * `top(n)` — the `n` most frequently seen labels as a character vector,
      most frequent first, ties broken by label ascending. Fewer than `n`
      distinct labels yields all of them, and `n` of zero or less yields
      `character(0)`.

- `make_limited(cap)`
  Returns a list with exactly `add`, `total` and `rejected`, in that order.
    * `add(x)` — `x` is a single number. If adding it would take the total
      **strictly above** `cap`, the state is left completely unchanged apart
      from the rejection counter, and the call raises
      `stop(sprintf("cap %g exceeded", cap), call. = FALSE)`. Landing
      exactly on `cap` is allowed. Otherwise the total grows and the new
      total is returned invisibly.
    * `total()` — the running total, starting at 0.
    * `rejected()` — an integer count of how many `add` calls were refused.

Use base R only; do not attach any package.
'''
timeout_secs = 720
max_cost_usd = 1.0

