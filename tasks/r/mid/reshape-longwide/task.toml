id = "r-m-reshape-longwide"
title = "Long and wide reshaping without a package"
stack = "r"
tier = "mid"
prompt = '''
Fill in `pivot.R` in the project root (a stub is already there) with three
reshaping functions written in base R alone — no package may be attached,
and `stats::reshape` is not to be used because its output shape is not the
one specified here.

In all three, a column name that is absent from `df` is an error:
`stop(sprintf("no such column: %s", <name>), call. = FALSE)`, naming the
first missing column in the order the names were given.

- `to_long(df, id_cols, value_cols, name_to = "name", value_to = "value")`
  Return a data frame with `nrow(df) * length(value_cols)` rows: the id
  columns (keeping their types), then a character column named by `name_to`
  holding which value column a row came from, then a column named by
  `value_to` holding the value itself. The rows run in **row-major** order —
  the first row of `df` contributes one output row per entry of
  `value_cols`, in `value_cols` order, then the second row of `df`, and so
  on. The value column is the values combined with `c()`, so mixing column
  types promotes exactly as base R would. `value_cols` must name at least
  one column: otherwise `stop("value_cols must not be empty", call. = FALSE)`.
  Row names are the default `1..n`.

- `to_wide(df, id_cols, name_from, value_from, fill = NA)`
  The inverse. There is one output row per distinct combination of the
  `id_cols` values (compared as character), in order of **first appearance**
  in `df`, and one further column per distinct value of the `name_from`
  column, again in order of first appearance and named by that value. Each
  cell holds the matching `value_from` entry; a combination that has no row
  for a given name gets `fill`. If any (id combination, name) pair occurs
  more than once the data cannot be widened without losing a value, so call
  `stop(sprintf("duplicate cell in column %s", <name>), call. = FALSE)` for
  the first such column in output-column order. Row names are the default
  `1..n`.

  Round-tripping must work: widening the output of `to_long` reproduces the
  original frame, columns, types and all.

- `transpose_frame(df, id_col)`
  Flip the frame. The result's first column is named `name` and holds the
  names of `df`'s other columns, in their original order; there is then one
  column per row of `df`, named by that row's `id_col` value converted to
  character and appearing in row order. Every cell is the corresponding
  original value converted to **character**. Repeated `id_col` values would
  produce duplicate column names, so call
  `stop("duplicate row labels", call. = FALSE)` instead. Row names are the
  default `1..n`.

Use base R only; do not attach any package.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden.R"]
cmd = ["C:/Program Files/R/R-4.6.1/bin/Rscript.exe", "--vanilla", "tests_hidden.R"]
