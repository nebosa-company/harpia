id = "r-s-date-buckets"
title = "Month buckets and business-day counts"
stack = "r"
tier = "simple"
prompt = '''
Billing needs calendar arithmetic that survives month ends. Fill in
`dates.R` in the project root (a stub is already there) with four functions.
All of them take and return vectors: every `Date` argument may contain `NA`,
which propagates as `NA`, and a zero-length input yields a zero-length
result of the right type rather than an error.

- `month_end(d)`
  `d` is a `Date` vector. Return a `Date` vector holding the last day of the
  month each element falls in.

- `month_bucket(d)`
  A character vector of the form `"YYYY-MM"` — zero-padded month — for each
  element of `d`.

- `add_months(d, n)`
  Shift each date by `n` calendar months; `n` is an integer vector that is
  either length 1 or the same length as `d`, and may be negative. The day of
  the month is preserved when the target month has such a day, and otherwise
  **clamped to that month's last day**: `2024-01-31` plus one month is
  `2024-02-29`, and `2024-03-31` minus one month is also `2024-02-29`. The
  result is a `Date` vector.

- `business_days(from, to)`
  An **integer** vector counting the days from `from` to `to` inclusive that
  fall on a Monday through Friday. `from` and `to` are `Date` vectors that
  are either the same length or one of them length 1, in which case that one
  applies to every pair. A range whose `to` is earlier than its `from`
  counts `0`; a pair with an `NA` on either side counts `NA_integer_`.
  Do not depend on the machine's locale when deciding which day of the week
  a date is.

Use base R only; do not attach any package.
'''
timeout_secs = 300
max_cost_usd = 0.25

