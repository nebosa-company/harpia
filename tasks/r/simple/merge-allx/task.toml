id = "r-s-merge-allx"
title = "Left join that keeps the left frame's row order"
stack = "r"
tier = "simple"
prompt = '''
`merge(x, y, all.x = TRUE)` reorders rows even with `sort = FALSE`, and it
will happily multiply rows when the right-hand frame has a repeated key.
Fill in `joins.R` in the project root (a stub is already there) with three
functions that pin the behavior down.

In all three, `by` is a single column name that must exist in both frames,
and keys are compared **as character**. An `NA` key never matches anything,
on either side.

- `left_join_df(x, y, by)`
  Return a data frame with exactly one row for every row of `x`, in `x`'s
  original order. The columns are all of `x`'s columns, in `x`'s order,
  followed by every column of `y` except the key, in `y`'s order. If a
  non-key column of `y` has a name that already exists in `x`, the `y` copy
  is renamed by appending `.y` — `x`'s column keeps its own name. Rows of
  `x` whose key is absent from `y` get `NA` in every `y` column, and those
  columns keep the type they have in `y`. Row names are the default `1..n`.

  Before joining, check that `y`'s keys are unique. If any non-`NA` key
  repeats, call `stop()` with the message
  `sprintf("duplicate keys in y: %s", <key>)` and `call. = FALSE`, naming
  the first key that repeats in `y`'s row order. A missing key column is
  `stop(sprintf("no key column %s in x", by), call. = FALSE)` — or `in y`
  for the right-hand frame — with `x` checked first.

- `anti_join_df(x, y, by)`
  The rows of `x` whose key is absent from `y`, in `x`'s order, with all of
  `x`'s columns. Always a data frame, even with one column or no rows, and
  row names are the default `1..n`.

- `join_coverage(x, y, by)`
  A list with three elements: `matched` (integer, the number of rows of `x`
  whose key is present in `y`), `unmatched` (integer, the rest), and
  `unmatched_keys` (character, the distinct unmatched keys in `x`'s order).
  `NA` keys count as unmatched, and contribute `NA_character_` to
  `unmatched_keys`.

Use base R only; do not attach any package.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden.R"]
cmd = ["C:/Program Files/R/R-4.6.1/bin/Rscript.exe", "--vanilla", "tests_hidden.R"]
