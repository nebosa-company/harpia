id = "r-s-factor-relevel"
title = "Factor releveling and ordered level summaries"
stack = "r"
tier = "simple"
prompt = '''
Survey answers arrive as plain text and have to become ordered factors with
a level order we control. Fill in `levels.R` in the project root (a stub is
already there) with three functions.

- `set_order(x, order)`
  `x` is a character vector or a factor; `order` is a character vector of
  level labels, lowest first. Return an **ordered** factor whose levels are
  exactly `order`, in exactly that sequence. Values of `x` that are matched
  by label against `order`; anything not present in `order` becomes `NA`.
  Comparing two elements with `<` must reflect the position in `order`.
  When `x` is already a factor, its **labels** decide the mapping, never its
  internal codes.

- `level_counts(f)`
  `f` is a factor. Return a data frame with two columns:
  `level` (character) and `count` (integer). There is one row per level of
  `f`, in level order, including levels that occur zero times. `NA` values
  are not counted anywhere. Row names are the default `1..n`. If `f` is not
  a factor, call `stop("expected a factor", call. = FALSE)`.

- `numeric_codes(f)`
  `f` is a factor whose level labels are written numbers, e.g.
  `factor(c("10", "9", "10"))`. Return a **double** vector of the numbers the
  labels spell, in the order the elements appear — not the factor's internal
  integer codes. `NA` elements stay `NA`. If some level label is not a valid
  number, call `stop()` with the message
  `sprintf("non-numeric level: %s", <that label>)` and `call. = FALSE`,
  reporting the first offending label in level order. If `f` is not a factor,
  call `stop("expected a factor", call. = FALSE)`.

Use base R only; do not attach any package.
'''
timeout_secs = 300
max_cost_usd = 0.25

