id = "r-s-regex-extract"
title = "Ticket-code extraction and redaction"
stack = "r"
tier = "simple"
prompt = '''
Support messages carry ticket codes and customer email addresses, and we
need to pull the first out and hide the second. Fill in `logparse.R` in the
project root (a stub is already there) with four functions.

A **ticket code** is exactly three uppercase ASCII letters, a hyphen, and
four digits — `ABC-1234`. It must stand on its own: a code that is part of a
longer run of letters or digits is not a code, so `ABCD-1234` and
`ABC-12345` contain none, and lowercase `abc-1234` is not a code either.

An **email address**, for our purposes, is one or more of the characters
`A-Z a-z 0-9 . _ % + -`, then `@`, then a domain of one or more of
`A-Z a-z 0-9 . -` followed by a dot and at least two ASCII letters.

- `extract_codes(x)`
  `x` is a character vector. Return an **unnamed list** of the same length,
  each element the character vector of every ticket code in that string, in
  the order they appear. A string with no codes gives `character(0)`, and so
  does an `NA` element.

- `first_code(x)`
  A character vector of the same length as `x`: the first ticket code in
  each string, or `NA_character_` when there is none.

- `mask_emails(x)`
  Every email address has the part before its `@` replaced by exactly three
  asterisks, `***`, with the `@` and the domain left alone. Everything else
  in the string is untouched, and `NA` elements stay `NA`.

- `replace_codes(x, map)`
  `map` is a named character vector whose names are ticket codes and whose
  values are their replacements. Every occurrence of a code named in `map`
  is replaced by its mapped value; codes absent from `map`, and all other
  text, are left exactly as they are. `NA` elements stay `NA`.

Use base R only; do not attach any package.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
