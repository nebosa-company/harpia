id = "r-s-apply-reshape"
title = "Reshaping with the apply family instead of loops"
stack = "r"
tier = "simple"
prompt = '''
Fill in `applyx.R` in the project root (a stub is already there) with three
reshaping helpers.

**Hard constraint:** no function you define in `applyx.R` may contain a
`for`, `while` or `repeat` loop. Use the apply family and vectorised base
functions (`vapply`, `lapply`, `sapply`, `mapply`, `Map`, `Reduce`, `split`,
`tapply`, `rep`, `as.vector`, …) instead.

- `col_summary(df)`
  Return a data frame with one row per **numeric** column of `df`, in column
  order, and these six columns: `column` (character), `n` (integer, the
  count of non-`NA` values), then `mean`, `sd`, `min` and `max` (all double,
  computed over the non-`NA` values). Non-numeric columns are skipped
  entirely. A column with fewer than two non-`NA` values has `sd` equal to
  `NA_real_`; a column with no non-`NA` values at all has `NA_real_` for
  `mean`, `sd`, `min` **and** `max` — never `Inf` or `NaN`. When `df` has no
  numeric columns the result is a zero-row data frame that still has those
  six columns with those types. Row names are the default `1..n`.

- `matrix_to_long(m)`
  `m` is a matrix carrying both row and column names. Return a data frame
  with columns `row` (character), `col` (character) and `value` (the
  matrix's own element type), holding one row per cell in column-major
  order — every cell of the first column, then of the second, and so on.
  Row names are the default `1..n`. If `m` is not a matrix, call
  `stop("expected a matrix", call. = FALSE)`; if either dimnames component
  is `NULL`, call `stop("matrix needs row and column names", call. = FALSE)`.

- `group_apply(df, by, col, f)`
  `by` and `col` are single column names. Split `df[[col]]` by the values of
  `df[[by]]` compared as character, apply `f` to each group (it returns one
  number), and return a data frame whose first column is named after `by`
  and holds the distinct group labels as **character**, sorted ascending,
  and whose second column is named `value` and is double. Rows whose
  grouping value is `NA` take part in no group. Row names are the default
  `1..n`, and an input with no rows yields a zero-row frame with those two
  columns.

Use base R only; do not attach any package.
'''
timeout_secs = 300
max_cost_usd = 0.25

