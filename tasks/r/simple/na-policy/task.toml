id = "r-s-na-policy"
title = "Data-frame cleaning under an explicit NA policy"
stack = "r"
tier = "simple"
prompt = '''
Imported extracts arrive with missing values scattered through them, and
every column needs its own rule. Fill in `clean.R` in the project root (a
stub is already there) with three functions.

- `na_report(df)`
  Return a data frame with one row per column of `df`, in column order, and
  three columns: `column` (character), `n_missing` (integer) and
  `pct_missing` (double, the missing count divided by `nrow(df)`; exactly
  `0` for every column when `df` has no rows). Row names are the default
  `1..n`.

- `complete_rows(df)`
  Return a logical vector of length `nrow(df)`, `TRUE` for the rows where no
  column is `NA`.

- `clean_frame(df, policy = list())`
  `policy` is a named list; each name is a column of `df` and each value is
  one of:
    * the string `"drop"` — rows where that column is `NA` are removed;
    * the string `"mean"` or `"median"` — `NA`s in that column are replaced
      by the mean or median of that column's remaining non-`NA` values;
    * `list(fill = v)` — `NA`s in that column are replaced by the value `v`.

  Application order is fixed and matters: **first** every `"drop"` rule, then
  every filling rule, and within each of those two passes the rules run in
  the order the columns appear in `names(df)` — not in the order the policy
  list was written. A `"mean"` or `"median"` is therefore computed on the
  rows that survived the drops.

  The result keeps all of `df`'s columns in their original order and has row
  names `1..n`. A column named in `policy` that does not exist in `df` is an
  error: `stop(sprintf("no such column: %s", <name>), call. = FALSE)`,
  naming the first such column in the order the policy list was written.
  Asking for `"mean"` or `"median"` on a non-numeric column is
  `stop(sprintf("column %s is not numeric", <name>), call. = FALSE)`, and any
  other policy value is
  `stop(sprintf("unknown policy for column %s", <name>), call. = FALSE)`.
  An empty policy leaves the data alone but still renumbers the row names.

Use base R only; do not attach any package.
'''
timeout_secs = 300
max_cost_usd = 0.25

