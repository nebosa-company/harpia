id = "r-s-recycle-guard"
title = "Recycling-safe vector utilities"
stack = "r"
tier = "simple"
prompt = '''
Base R silently recycles a short vector against a longer one, which hides
real length bugs. Fill in `vecutil.R` in the project root (a stub is already
there) so that recycling only happens where it is unambiguous.

Define three functions:

- `pairwise(x, y, f)`
  Applies the binary function `f` to `x` and `y` element-wise. Recycling is
  permitted only in these cases:
    * `length(x) == length(y)` (including both zero-length);
    * exactly one operand has length 1 and the other has length greater
      than 1, in which case the length-1 value is used for every element.
  Any other combination is an error: call `stop()` with the message
  `sprintf("length mismatch: %d vs %d", length(x), length(y))` and with
  `call. = FALSE` so the message is reported on its own.
  The returned vector carries the names of the longer operand, or the names
  of `x` when the two lengths are equal. If that operand has no names the
  result must have none either (`names()` returns `NULL`).

- `safe_add(x, y)`
  The element-wise sum, with exactly the rules and error message above.

- `recycle_strict(x, n)`
  Repeats `x` until the result has length `n`. If `n` is 0 the result is a
  zero-length vector of the same type as `x`. Otherwise, if `x` is empty or
  `n` is not an exact multiple of `length(x)`, call `stop()` with the message
  `sprintf("cannot recycle length %d to %d", length(x), n)` and
  `call. = FALSE`. Partial recycling is never allowed.

Use base R only; do not attach any package.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden.R"]
cmd = ["C:/Program Files/R/R-4.6.1/bin/Rscript.exe", "--vanilla", "tests_hidden.R"]
