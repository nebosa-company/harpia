id = "r-c-s4-shapes"
title = "An S4 shape hierarchy with validity and generics"
stack = "r"
tier = "complex"
prompt = '''
Build an S4 class system for geometric shapes in `s4shapes.R` (a stub is
already in the project root). S4, not S3: real class definitions, real
validity methods, real generics.

**Classes.**

- `Shape` — **virtual**, with one slot `name` of type `character`. Its
  validity method rejects a name that is not a single non-`NA`, non-empty
  string, with the message `name must be a single non-empty string`.
- `Rect` — contains `Shape`, adding numeric slots `w` and `h`. Its validity
  method rejects a `w` that is not a single positive number with
  `width must be positive`, and likewise an `h` with
  `height must be positive`.
- `Circle` — contains `Shape`, adding a numeric slot `r`, rejected the same
  way with `radius must be positive`.
- `ShapeSet` — a collection, with a `character` slot `label` and a `list`
  slot `shapes`. Its validity rejects a bad label with
  `label must be a single non-empty string`, and a `shapes` list holding
  anything that is not a `Shape` with `every element must be a Shape`. An
  empty collection is valid.

**Generics and methods.** Define the generics `area(shape, ...)`,
`perimeter(shape, ...)` and `scaled(shape, k, ...)`, and a method of each
for `Rect`, `Circle` and `ShapeSet`.

- `area` and `perimeter` are the usual formulas for a rectangle and a
  circle; for a `ShapeSet` they total its members, and an empty set gives
  `0`.
- `scaled` returns a **new** object of the same class with every linear
  dimension multiplied by `k`, keeping the name or label; scaling a
  `ShapeSet` scales each member. `k` must be a single positive number,
  otherwise `stop("scale factor must be positive", call. = FALSE)`.

**Display.** Define a `show` method for each of `Rect`, `Circle` and
`ShapeSet` writing exactly one line. For a rectangle named `box` measuring
3 by 4, a circle named `ring` of radius 3, and a set labelled `set` holding
those two, the lines are exactly:

    Rect "box" 3 x 4
    Circle "ring" r=3
    ShapeSet "set" with 2 shape(s), area 40.274

The measurements use `%g` formatting, so a whole number prints without a
decimal point; the set's area uses `%.3f`. Each `show` method returns
`invisible(NULL)`.

**Convenience functions.** Also export four plain functions:
`rect(name, w, h)`, `circle(name, r)` and `shape_set(label, shapes =
list())`, each building and returning the matching object, and
`total_area(shapes)`, which takes a plain list of shapes and returns the
sum of their areas — `0` for an empty list, and
`stop("every element must be a Shape", call. = FALSE)` if the argument is
not a list or holds anything that is not a `Shape`.

Use base R only. `methods` is part of R itself and is already attached
under `Rscript`; do not attach anything further.
'''
timeout_secs = 1800
max_cost_usd = 4.0

