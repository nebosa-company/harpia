id = "r-c-bootstrap-permute"
title = "Seeded bootstrap intervals and permutation tests"
stack = "r"
tier = "complex"
prompt = '''
Build the resampling toolkit in `resample.R` (a stub is already in the
project root). Risk review has to be able to reproduce every number, so the
way random draws are made is part of the specification: follow each recipe
exactly, in the order given, make no extra draws, and do not change the
generator kind.

- `boot_ci(x, statistic, reps, seed, level = 0.95)`
  A bootstrap percentile interval for `statistic` applied to the numeric
  vector `x`.

  Compute the estimate on the original data first, as `statistic(x)`. Then
  call `set.seed(seed)` and produce `reps` replicates in order, each one
  drawing `sample.int(length(x), length(x), replace = TRUE)` once and
  applying `statistic` to `x` indexed by those positions. The interval
  bounds are `quantile(<the replicates>, c(a, 1 - a), type = 7,
  names = FALSE)` where `a` is `(1 - level) / 2`.

  Return a list of class `"boot_ci"` whose elements are, in order:
  `estimate`, `lower` and `upper` (doubles), `reps` (integer), `level`
  (double) and `replicates` (the double vector of every replicate).

- `perm_test(x, y, statistic, reps, seed, alternative = "two.sided")`
  A permutation test of `statistic(x, y)`, which returns one number.

  Compute `observed <- statistic(x, y)` first. Pool the two samples as
  `c(x, y)`, remembering `n <- length(x)`. Then call `set.seed(seed)` and
  produce `reps` values in order: each draws `sample.int(length(pooled), n)`
  once, and applies `statistic` to the pooled values at those positions and
  to the pooled values at all the other positions, in that argument order.

  The p-value counts how many of the null values are at least as extreme as
  the observed one, with the observed value itself added to both the count
  and the total: `(1 + hits) / (reps + 1)`. For `"two.sided"` a hit is
  `abs(value) >= abs(observed)`; for `"greater"` it is `value >= observed`;
  for `"less"` it is `value <= observed`. Any other `alternative` is
  `stop("alternative must be two.sided, greater or less", call. = FALSE)`.

  Return a list of class `"perm_test"` whose elements are, in order:
  `observed` (double), `p_value` (double), `reps` (integer), `alternative`
  (character) and `null_dist` (the double vector of every permuted value).

- `jackknife(x, statistic)`
  Leave-one-out resampling, which needs no randomness at all. With `n` the
  length of `x` and `values` the vector of `statistic(x[-i])` for `i` from 1
  to `n`, return a plain list whose elements are, in order: `estimate`
  (`statistic(x)`), `bias` (`(n - 1) * (mean(values) - estimate)`), `se`
  (`sqrt((n - 1) / n * sum((values - mean(values))^2))`) and `values`.
  Fewer than two observations is
  `stop("x must have at least two values", call. = FALSE)`.

- `format_ci(ci, digits = 3)`
  Render a `"boot_ci"` as a single string: the estimate, a space, then the
  bounds in square brackets separated by a comma and a space, every number
  with exactly `digits` digits after the point — `"5.000 [3.500, 6.250]"`.
  Anything that is not a `"boot_ci"` is
  `stop("expected a boot_ci object", call. = FALSE)`.

**Shared validation.** In `boot_ci`, `perm_test` and `jackknife`, every
sample argument must be a non-empty numeric vector, otherwise
`stop("x must be a non-empty numeric vector", call. = FALSE)`. Wherever
`reps` appears it must be a single positive whole number, otherwise
`stop("reps must be a positive whole number", call. = FALSE)`. In
`boot_ci`, `level` must be a single number strictly between 0 and 1,
otherwise `stop("level must be between 0 and 1", call. = FALSE)`.

Use base R only. `stats` is part of R itself and is already attached, so
`quantile`, `median` and `var` are available; do not attach anything
further.
'''
timeout_secs = 1800
max_cost_usd = 4.0

[[oracles]]
