id = "r-c-data-verbs"
title = "Composable data verbs in base R"
stack = "r"
tier = "complex"
prompt = '''
Build a small set of data-frame verbs in `verbs.R` (a stub is already in the
project root). They take the data frame first, so they chain with R's native
pipe: `df |> filter_rows(score > 3) |> arrange_rows(desc(score))`.

Every verb takes its column references **unquoted** and evaluates them with
the data frame's columns in scope, falling back to the caller's environment
for anything not found there — so `threshold <- 25; filter_rows(df, v >
threshold)` works. Every verb returns a data frame with the default row
names `1..n`, even when the result has one column or no rows, and a
reference to a column that does not exist is
`stop(sprintf("no such column: %s", <name>), call. = FALSE)` naming the
first offender in the order the arguments were written.

- `select_cols(df, ...)`
  `...` are bare column names — a string literal naming a column is also
  accepted. The result holds those columns in the order written. Prefixing
  every one of them with `-` inverts the sense: keep all the other columns,
  in their original order. Mixing the two forms is
  `stop("cannot mix kept and dropped columns", call. = FALSE)`, and calling
  it with nothing is
  `stop("select_cols needs at least one column", call. = FALSE)`.

- `filter_rows(df, condition)`
  Keeps the rows where `condition` is `TRUE`; an `NA` counts as `FALSE`. The
  condition must give either one value per row or a single value that
  applies to all of them, and anything else is
  `stop("condition must give one value per row", call. = FALSE)`.

- `mutate_cols(df, ...)`
  `...` are **named** expressions, evaluated left to right, and each one can
  see the columns the earlier ones just made. A name that already exists in
  `df` is replaced where it stands; a new name is appended at the end. A
  result of length 1 is recycled to every row; any other length that is not
  `nrow(df)` is
  `stop(sprintf("column %s has the wrong length", <name>), call. = FALSE)`.
  An unnamed argument is
  `stop("every mutation must be named", call. = FALSE)`.

- `arrange_rows(df, ...)`
  `...` are bare column names, each optionally wrapped in `desc(...)` to
  sort that key downwards. Keys apply left to right, the sort is **stable**
  so tied rows keep their original order, and `NA`s sort last. Calling it
  with nothing is
  `stop("arrange_rows needs at least one column", call. = FALSE)`. Also
  export `desc` itself as a plain function so the name resolves; it is only
  ever a marker inside `arrange_rows`.

- `summarise_groups(df, by, ...)`
  `by` is a character vector of one or more column names, and `...` are
  named expressions evaluated once per group, each returning a single
  number and seeing only that group's rows. The result has the `by` columns
  first, in the order given and keeping the types they have in `df`, then
  one double column per expression in the order written. There is one row
  per distinct group, sorted ascending by the keys compared as character. A
  row whose key is `NA` in any `by` column belongs to no group. Calling it
  with no summaries is
  `stop("summarise_groups needs at least one summary", call. = FALSE)`, and
  an unnamed summary is
  `stop("every summary must be named", call. = FALSE)`.

Use base R only; do not attach any package.
'''
timeout_secs = 1800
max_cost_usd = 4.0

