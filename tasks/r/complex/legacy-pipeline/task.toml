id = "r-c-legacy-pipeline"
title = "Repair the sales pipeline and add a regional breakdown"
stack = "r"
tier = "complex"
prompt = '''
The sales pipeline in the project root runs in three stages — `load.R`,
`transform.R`, `report.R` — with `run.R` sourcing them and calling
`run_pipeline()`. It reads `data/sales.csv`, tidies the region labels,
turns the recorded quantity into a number, derives revenue, weights each row
by its region and totals the result. It runs without complaint and has been
producing wrong numbers for months.

Three faults have been reported.

1. A row whose region label needed correcting comes out with **no region at
   all** and drops out of every regional breakdown, even though the label is
   present in the extract and the correction table names it.
2. The quantities in the report look like small counting numbers — 1, 2, 3
   and so on — instead of the amounts recorded in the file, and quantities
   written with a half unit have lost their fractional part.
3. The commercial weighting is handed out **down the rows in order** rather
   than according to the region each row belongs to, so a region's
   multiplier lands on whichever rows happen to line up with it.

Find and fix all three, keeping every existing function name and parameter
name exactly as it is. The corrected behavior is:

- `load_sales(path)` reads the extract, leaving text columns as
  **character** rather than converting them to factors.
- `normalise_regions(df)` rewrites any region matching a name in
  `REGION_FIXUPS` to that entry's value, leaving every other label alone,
  and returns the frame with `region` as a character column.
- `parse_qty(x)` turns the recorded quantity into a **double**, keeping
  fractional amounts intact. An entry that is not a number — the `-`
  placeholder the warehouse writes when it reported nothing — becomes
  `NA_real_`, silently, with no warning reaching the caller.
- `prepare(df)` normalises the regions, replaces `qty` with the parsed
  numbers and adds a `revenue` column of `qty * price`.
- `apply_weights(df)` adds a `weighted` column: each row's `revenue`
  multiplied by the entry of `REGION_WEIGHTS` **named after that row's
  region**. A region that has no entry gives `NA`.
- `total_report(df)` weights the frame, then returns a one-row data frame
  with `rows` (integer, the number of rows it was given), `revenue` and
  `weighted` (doubles, each summed ignoring `NA`). Row names are the
  default.
- `run_pipeline(path = "data/sales.csv")` is unchanged: load, prepare,
  total_report.

**Then add the regional breakdown the commercial team has been asking for.**

- `region_report(df)` — in `report.R`, taking a frame as `prepare()` returns
  it and weighting it the same way `total_report` does. Return a data frame
  with one row per distinct region present, sorted ascending, and these five
  columns: `region` (character), `rows` (integer, how many rows that region
  has), then `qty`, `revenue` and `weighted` (doubles, each summed over that
  region ignoring `NA`). Rows whose region is `NA` belong to no region and
  appear nowhere. Row names are the default `1..n`, and a frame with no
  usable rows gives a zero-row result that still carries those five columns
  with those types.
- `run_region_report(path = "data/sales.csv")` — in `run.R`: load, prepare,
  `region_report`.

Use base R only; do not attach any package. Do not edit `data/sales.csv`.
'''
timeout_secs = 1800
max_cost_usd = 4.0

