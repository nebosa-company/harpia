id = "rust-m-lru-cache"
title = "Generic LRU cache"
stack = "rust"
tier = "mid"
prompt = '''
Implement the generic least-recently-used cache in src/lib.rs. Fill in every
stubbed method of `LruCache<K, V>`; keep the type's bounds
(`K: Eq + std::hash::Hash + Clone`) and all method signatures exactly as
they are.

Semantics ("use" = the accesses explicitly marked as refreshing):
- `new(capacity)`: empty cache holding at most `capacity` entries; callers
  guarantee `capacity >= 1`.
- `get(&key) -> Option<&V>`: returns the value and REFRESHES the entry
  (marks it most recently used). Missing key: `None`, no state change.
- `peek(&key) -> Option<&V>`: returns the value WITHOUT refreshing.
- `contains(&key) -> bool`: membership test WITHOUT refreshing.
- `put(key, value) -> Option<(K, V)>`: inserts or updates. If the key
  already exists, its value is replaced and the entry refreshed; returns
  `None`. If the key is new and the cache is full, the least recently used
  entry is evicted and returned as `Some((k, v))`; otherwise `None` is
  returned. A freshly inserted or updated entry is always the most
  recently used.
- `remove(&key) -> Option<V>`: removes the entry, returning its value.
- `len()`, `is_empty()`, `capacity()`: the obvious accessors.

Recency is a strict total order over the live entries, updated only by
`get` and `put`. Any std-only implementation is fine; O(capacity)
operations are acceptable.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden_edge.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden_edge"]
weight = 2.0

