id = "rust-m-myers-diff"
title = "Minimal line diff (Myers)"
stack = "rust"
tier = "mid"
prompt = '''
Implement a minimal line-based diff in src/lib.rs. The `Edit` enum is
already defined; fill in the two stubbed functions and keep all public
signatures and the enum unchanged.

1. `pub fn diff_lines(a: &str, b: &str) -> Vec<Edit>`
   Compute an edit script transforming the lines of `a` into the lines of
   `b`. Line splitting uses the semantics of Rust's `str::lines()` (splits
   on '\n', strips a trailing '\r' from each line, no trailing empty line
   for a trailing newline; "" has zero lines).

   The script is a sequence of `Edit::Equal(line)`, `Edit::Delete(line)`,
   `Edit::Insert(line)` such that:
   - walking the script, the `Equal` + `Delete` payloads in order are
     exactly the lines of `a`, and the `Equal` + `Insert` payloads in order
     are exactly the lines of `b`;
   - the script is MINIMAL: it contains the smallest possible number of
     Delete + Insert entries (equivalently, Equal entries form a longest
     common subsequence). Any minimal script is accepted; Myers' O(ND)
     algorithm is the intended approach, but any algorithm producing a
     minimal script is fine.
   - identical inputs produce all-Equal scripts; two empty inputs produce
     an empty script.

2. `pub fn edit_distance(a: &str, b: &str) -> usize`
   The number of Delete + Insert entries in a minimal script for (a, b).

Inputs can reach a few hundred lines; anything polynomial is fast enough.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden"]
weight = 4.0

