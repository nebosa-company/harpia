id = "rust-m-ini-roundtrip"
title = "INI parser with canonical round-trip"
stack = "rust"
tier = "mid"
prompt = '''
Implement the INI document type in src/lib.rs: parsing, accessors, mutation,
and a canonical serialization that round-trips. The `Ini` struct, `IniError`
enum and all method stubs exist; keep every public signature and the derives
(`Ini` is `PartialEq`) unchanged.

PARSING — `Ini::parse(src: &str) -> Result<Ini, IniError>`. Lines are
physical lines split on '\n', with one trailing '\r' stripped (CRLF-safe);
line numbers are 1-based.
- Blank or whitespace-only lines are skipped. Lines whose first
  non-whitespace character is ';' or '#' are comments, skipped.
- A line whose trimmed form starts with '[': it must also end with ']'
  (after trimming), else `Err(IniError::BadLine { line })`. The section
  name is the text between the brackets, trimmed; if empty,
  `Err(IniError::EmptySection { line })`. The header opens that section:
  following key lines belong to it. A repeated section name REOPENS the
  existing section (its position in the order does not change).
- Any other line must contain '=': key = text before the FIRST '=',
  trimmed; value = text after, trimmed (may be empty). An empty key or a
  line with no '=' is `Err(IniError::BadLine { line })`. Key lines before
  any section header belong to the global section, whose name is "".
- Setting a key that already exists in the section overwrites its value
  IN PLACE (the key keeps its original position).

MODEL — order matters and equality respects it: two `Ini` values are equal
iff they have the same sections in the same order, each with the same keys
in the same order and same values. The global section exists only when it
has keys (or was created by `set`). Sections opened by a header exist even
with zero keys.

ACCESSORS: `get(section, key) -> Option<&str>`; `sections() -> Vec<&str>`
(order of first appearance, "" included if the global section exists);
`keys(section) -> Vec<&str>` (insertion order; empty Vec for an unknown
section).

MUTATION — `set(section, key, value)`: overwrite in place if the key
exists; else append the key to the section; else create the section (at the
END of the section order — except the global section "", which is always
FIRST) with that single key.

SERIALIZATION — `impl Display`. Canonical form:
- Global keys first (no header), then each named section: a `[name]` line
  followed by its key lines.
- Every key line is `key = value`, or `key =` when the value is empty.
- Every line ends with '\n'. Exactly one empty line between consecutive
  section blocks; no leading or trailing empty lines. An empty `Ini`
  prints as "".
- Round-trip law: for every `Ini` value x built by parse and/or set,
  `Ini::parse(&x.to_string()) == Ok(x)`.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden_edge.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden_edge"]
weight = 2.0

