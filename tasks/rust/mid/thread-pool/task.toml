id = "rust-m-thread-pool"
title = "Thread pool with graceful shutdown"
stack = "rust"
tier = "mid"
prompt = '''
Implement the worker thread pool in src/lib.rs. Fill in the stubbed methods
of `ThreadPool`; keep every public signature exactly as it is.

Behavior:
- `new(workers)` spawns exactly `workers` OS threads that wait for jobs
  (callers guarantee `workers >= 1`).
- `execute(job)` enqueues a job (`FnOnce() + Send + 'static`). Jobs are
  handed to workers in FIFO submission order. `execute` takes `&self` and
  must be callable from multiple threads sharing a `&ThreadPool`
  (std::thread::scope-style sharing), so the pool must be `Sync`.
- Jobs run on the worker threads, not the calling thread; with N workers,
  up to N jobs run concurrently (a job that blocks must not prevent other
  workers from picking up queued jobs).
- A job that PANICS must not kill its worker or the pool: the panic is
  caught, later jobs keep running.
- `completed()` returns how many jobs have finished normally so far;
  `panicked()` returns how many jobs panicked. Both are monotonic counters.
- `shutdown(self)` performs a graceful shutdown: every job already
  submitted is still executed, then all worker threads are joined. When
  `shutdown` returns, all counters reflect every submitted job.

Determinism note: only FIFO hand-off order is required; completion order
across workers is unspecified.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden_edge.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden_edge"]
weight = 2.0

