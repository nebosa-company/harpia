id = "rust-m-error-refactor"
title = "Refactor panicking parser to structured errors"
stack = "rust"
tier = "mid"
prompt = '''
The config parser in src/lib.rs predates our error-handling guidelines: it
panics on every invalid input. Refactor it to structured errors WITHOUT
breaking existing callers. This crate has no dependencies and must stay
that way — hand-roll the error type (enum + Display + std::error::Error).

Add to src/lib.rs:

1. `#[derive(Debug, PartialEq)] pub enum ConfigError` with EXACTLY these
   variants:
   - `Missing(&'static str)` — a required key ("host" or "port") absent;
   - `UnknownKey(String)` — an unrecognized key (trimmed);
   - `InvalidPort(String)` — port text that does not parse as u16 (trimmed);
   - `InvalidWorkers(String)` — workers text that does not parse as u32
     (trimmed);
   - `InvalidBool(String)` — bool text that is not true/false/1/0
     case-insensitive (trimmed original text);
   - `BadLine(usize)` — a non-comment, non-blank line without '='
     (1-based line number).

2. `impl std::fmt::Display for ConfigError` producing exactly these
   messages (backticks included):
   - Missing(k)         -> missing required key `<k>`
   - UnknownKey(k)      -> unknown key `<k>`
   - InvalidPort(s)     -> invalid port `<s>`
   - InvalidWorkers(s)  -> invalid workers `<s>`
   - InvalidBool(s)     -> invalid bool `<s>`
   - BadLine(n)         -> malformed line <n>
   and `impl std::error::Error for ConfigError {}`.

3. Fallible twins with the same parsing rules as today's functions:
   `pub fn try_parse_config(src: &str) -> Result<ServerConfig, ConfigError>`
   `pub fn try_parse_port(s: &str) -> Result<u16, ConfigError>`
   `pub fn try_parse_bool(s: &str) -> Result<bool, ConfigError>`
   Line handling is unchanged: lines are trimmed; blank lines and lines
   starting with '#' are skipped; a missing host is reported before a
   missing port; errors surface for the first offending line.

4. Rework the EXISTING functions (`parse_config`, `parse_port`,
   `parse_bool`) into thin wrappers that delegate to the try_* versions and
   panic with the Display message of the error
   (`panic!("{e}")`-equivalent) on failure. Their signatures must not
   change, and the happy-path behavior must be byte-for-byte identical.

The visible tests in tests/visible.rs must keep passing UNCHANGED — do not
edit that file.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden"]
weight = 4.0

