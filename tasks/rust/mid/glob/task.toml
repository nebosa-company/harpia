id = "rust-m-glob"
title = "Glob pattern matcher"
stack = "rust"
tier = "mid"
prompt = '''
Implement `pub fn glob_match(pattern: &str, path: &str) -> bool` in
src/lib.rs. Both arguments are '/'-separated; the match must cover the
WHOLE path (no substring matching). Matching is case-sensitive.

Pattern syntax:
- Any character with no special meaning matches itself.
- `?` matches exactly one character, never '/'.
- `*` matches any run (possibly empty) of non-'/' characters.
- A character class `[...]` matches exactly one character, never '/':
  - plain characters and ranges `a-z` (inclusive); a class matches if the
    character equals any listed char or falls in any range;
  - `[!...]` negates the class (one character NOT in the set, still
    never '/');
  - a `]` as the very first class character (after optional '!') is a
    literal `]`;
  - a `-` as the first or last class character is a literal '-';
  - a range with hi < lo (like `[z-a]`), or a class never terminated by
    `]`, makes the whole pattern invalid: `glob_match` returns false for
    every path.
- `**` is special only when it forms a WHOLE path segment (the pattern
  "**", or segment-bounded as "**/", "/**/", "/**"): it matches zero or
  more complete path segments. So `a/**/b` matches "a/b", "a/x/b" and
  "a/x/y/b"; `a/**` matches "a" and everything under it; `**/c` matches
  "c" and any path ending in a "c" segment.
- A `**` with adjacent non-'/' characters within a segment (like `a**b`)
  is not the multi-segment wildcard; each `*` just behaves like `*` above.

Write the matcher by hand (recursive backtracking is fine); no
dependencies.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden"]
weight = 4.0

