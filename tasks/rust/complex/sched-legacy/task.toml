id = "rust-c-sched-legacy"
title = "Legacy task scheduler: three bugs and a feature"
stack = "rust"
tier = "complex"
prompt = '''
You inherit `taskd`, a small logical-clock task scheduler (src/lib.rs,
src/task.rs, src/queue.rs, src/scheduler.rs). Operators report three
misbehaviors, and product wants one new capability. Do not change any
existing public signature; you may add new items.

INTENDED SEMANTICS (the documentation of record):
- `Scheduler::new()` starts at tick 0; `tick()` advances the clock by one
  and runs every task that is due, returning the ids it ran, in execution
  order. A task is due when: it is Pending, its `run_at` <= the current
  tick, and every dependency is Done.
- The set of tasks that run in a tick is decided ONCE, at the start of the
  tick, from the states as they were when the tick began. A task whose
  dependency completes during tick T can therefore run no earlier than
  tick T+1.
- Execution order within a tick: higher `priority` first; ties by
  ascending id. The returned Vec, the log, and actual execution all use
  this order.
- A recurring task (`every = Some(n)`) reruns indefinitely: after each
  run its next `run_at` is the PREVIOUS `run_at` plus n — anchored to the
  schedule, not to the tick when the run actually happened.
- `run_until_idle(max_ticks)` ticks until no task is Pending or the
  budget is spent, concatenating the run ids.

REPORTED BUGS (symptoms, not diagnoses):
1. Within a single tick, low-priority housekeeping consistently runs
   BEFORE priority-9 flushes. Priority appears inverted somewhere.
2. Dependency chains collapse inconsistently: sometimes a dependent runs
   in the SAME tick as the task it depends on — and can even appear
   before it in that tick's returned order — while seemingly identical
   setups (same shape, different ids) take one tick per level as
   documented. Operators noticed the anomaly follows the relative order
   of the ids involved.
3. Recurring tasks drift: a task with `run_at = 3, every = 5` runs at
   3, 8, 13 when unobstructed, but when a dependency delays its first run
   to tick 5, the following runs land on 10, 15 instead of staying
   anchored at 8, 13.

Fix all three so the scheduler matches the intended semantics above.

NEW FEATURE — cascading cancel:
- Add a `Cancelled` variant to `TaskState`.
- Add `pub fn cancel(&mut self, id: u32) -> Vec<u32>` to `Scheduler`:
  cancelling a PENDING task sets it (and transitively every Pending task
  that depends on it, directly or indirectly) to Cancelled, and returns
  all newly cancelled ids sorted ascending. Cancelling a Done, Cancelled,
  or unknown id changes nothing and returns an empty Vec. Cancelled tasks
  never run and never satisfy anyone's dependency; a Pending task whose
  dependency is Cancelled (submitted after the cascade, say) simply never
  becomes due — it stays Pending.
'''
timeout_secs = 1800
max_cost_usd = 4.0

