id = "rust-c-http-router"
title = "HTTP/1.1 router on std TcpListener"
stack = "rust"
tier = "complex"
prompt = '''
Implement the small HTTP/1.1 server library in src/lib.rs. The types
`Request`, `Response`, `Router` and the free functions are declared with
stubs; keep every public signature exactly as it is. Standard library
only.

PARSING — `pub fn read_request(stream: &mut impl std::io::Read) -> Result<Request, String>`
reads ONE request:
- Request line: `METHOD SP target SP HTTP/1.1` — exactly three parts; the
  version must be exactly "HTTP/1.1"; anything else is Err. Lines end with
  CRLF, but a bare LF is tolerated (strip an optional trailing '\r').
- The target splits at the first '?': the part before is `path` (no
  decoding), after is the query string: `k=v` pairs separated by '&';
  a pair without '=' gets value ""; empty pairs (from "a&&b") are
  skipped; duplicate keys keep the LAST value. No percent-decoding.
- Header lines `Name: value` until an empty line: names are trimmed and
  lowercased, values trimmed; a header line without ':' is Err.
- Body: if a `content-length` header is present it must parse as usize
  (else Err) and exactly that many bytes follow; otherwise the body is
  empty. `params` starts empty.

RESPONSES — `Response { status, headers, body }`;
`Response::text(status, body)` builds one with a single
`("content-type", "text/plain")` header and the body bytes.
`pub fn write_response(stream: &mut impl std::io::Write, resp: &Response) -> std::io::Result<()>`
writes exactly:
  `HTTP/1.1 <status> <reason>\r\n` — reason from: 200 OK, 201 Created,
  204 No Content, 400 Bad Request, 403 Forbidden, 404 Not Found,
  405 Method Not Allowed, 500 Internal Server Error, anything else
  Unknown;
  then every header in `resp.headers` in order as `name: value\r\n`;
  then `content-length: <body length>\r\n` and `connection: close\r\n`;
  then a blank line `\r\n` and the raw body bytes.

ROUTING — `Router::new()`;
`route(&mut self, method, pattern, handler)` where handler is
`Fn(&Request) -> Response + Send + Sync + 'static`. Patterns are
'/'-separated; a segment `:name` captures the corresponding path segment
into `params["name"]`; other segments must match literally; segment count
must match exactly. `handle(&self, req: &mut Request) -> Response`:
- first matching route wins, in registration order, considering only
  routes whose METHOD equals the request's (methods are case-sensitive,
  conventionally uppercase). Params are inserted into `req.params` before
  the handler runs (and `req` is passed to it).
- if no route of the request's method matches but at least one route of
  ANOTHER method matches the path, respond 405 with body "method not
  allowed" (text) plus an extra header `allow` whose value lists the
  matching methods, sorted, comma-space separated (e.g. "GET, POST"),
  deduplicated.
- otherwise respond with `Response::text(404, "not found")`.

SERVING — `serve(self, listener: std::net::TcpListener) -> std::io::Result<()>`:
loop forever accepting connections; per connection read ONE request,
route it through `handle`, write the response, and close the connection.
A request that fails to parse gets `Response::text(400, "bad request")`.
A connection error must not exit the loop. Sequential handling is fine.
'''
timeout_secs = 1800
max_cost_usd = 4.0

[[oracles]]
