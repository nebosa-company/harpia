id = "rust-c-nfa-regex"
title = "NFA regex subset"
stack = "rust"
tier = "complex"
prompt = '''
Implement the regex engine in src/lib.rs. The `Regex` struct and
`RegexError` enum exist with stubs; keep the public API exactly as it is:
`Regex::compile(pattern: &str) -> Result<Regex, RegexError>` and
`regex.is_match(text: &str) -> bool`, where `is_match` is true iff the
pattern matches the ENTIRE text.

SYNTAX
- Literal characters match themselves. `.` matches any single character.
- Postfix quantifiers on the preceding atom (literal, '.', class, or
  group): `*` zero or more, `+` one or more, `?` zero or one.
- Alternation `|` (lowest precedence), grouping `( ... )`. Branches may be
  empty and then match the empty string ("a|" matches "a" and "").
- Character classes `[...]`: one character from the listed set; ranges
  `a-z` (inclusive); `[^...]` negates. A `]` as the very first class
  character (after optional '^') is a literal `]`; a `-` first or last is
  a literal '-'. A class never matches more or less than one character.
- Escapes: `\` before any of `. * + ? | ( ) [ ] \` makes that character a
  literal. An unescaped `]` outside a class is a literal `]`.
- The empty pattern matches only the empty string.

COMPILE ERRORS (return the matching variant):
- `UnbalancedParen`: unclosed `(` or stray `)`.
- `DanglingQuantifier`: `*` `+` `?` with no atom before it — at the start
  of the pattern or of a branch, right after `(` or `|`, or directly
  after another quantifier (so `a**` is an error).
- `BadClass`: a class with no closing `]`, or a range with hi < lo
  (like `[z-a]`).
- `BadEscape`: `\` before any other character, or a trailing `\`.

IMPLEMENTATION REQUIREMENT: compile to a nondeterministic finite automaton
(Thompson construction or equivalent) and simulate it with state SETS.
Backtracking search is not acceptable — patterns like `(a|a)*x` against a
long run of 'a's must complete in microseconds, and the engine must not
recurse per-character (no stack overflows, no exponential blowups). Only
the standard library is available.
'''
timeout_secs = 1800
max_cost_usd = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden"]
weight = 4.0

