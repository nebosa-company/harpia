id = "rust-s-ring-buffer"
title = "Fixed-capacity ring buffer"
stack = "rust"
tier = "simple"
prompt = '''
Implement the generic `RingBuffer<T>` in src/lib.rs — a fixed-capacity FIFO
that overwrites its oldest element when full. Fill in every stubbed method;
keep all signatures exactly as they are.

Semantics:
- `new(capacity)`: an empty buffer that will hold at most `capacity`
  elements. Callers guarantee `capacity >= 1`.
- `push(value) -> Option<T>`: append `value` as the newest element. When
  the buffer is already full, the OLDEST element is evicted and returned
  as `Some(old)`; otherwise `None`.
- `pop() -> Option<T>`: remove and return the oldest element (`None` when
  empty).
- `peek() -> Option<&T>`: the oldest element without removing it.
- `len()`, `is_empty()`, `is_full()`, `capacity()`: the obvious accessors.
- `clear()`: drop all elements; capacity is unchanged and the buffer is
  reusable.
- `iter()`: iterator over the current elements from oldest to newest.

Any std-only implementation is fine (Vec, VecDeque, ...). Interleaved
push/pop sequences that wrap around the capacity many times must behave
exactly like an unbounded FIFO that evicts from the front on overflow.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden_edge.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden_edge"]
weight = 2.0

