id = "rust-s-temp-parse"
title = "Temperature string parser"
stack = "rust"
tier = "simple"
prompt = '''
Implement the two stubbed functions in src/lib.rs of this crate.

1. `pub fn parse_temp(input: &str) -> Result<f64, TempError>`
   Parse a temperature string and return its value in degrees Celsius.
   Rules, applied in this order:
   - Trim leading/trailing whitespace from `input`. If nothing remains,
     return `Err(TempError::Empty)`.
   - The unit is the LAST character of the trimmed input: 'C'/'c' Celsius,
     'F'/'f' Fahrenheit, 'K'/'k' Kelvin. Any other final character is
     `Err(TempError::UnknownUnit(that_char))` — so a bare number like "42"
     is `UnknownUnit('2')`.
   - The number part is everything before the unit character, trimmed (so
     "23.5 C" is fine). If it does not parse as an f64, return
     `Err(TempError::BadNumber(number_part.to_string()))` with the trimmed
     number part (possibly empty).
   - Convert to Celsius: F -> (f - 32) * 5 / 9; K -> k - 273.15.
   - If the Celsius result is below absolute zero, return
     `Err(TempError::BelowAbsoluteZero)`. To absorb floating-point rounding,
     "below" means `celsius < -273.15 - 1e-9` (so "-459.67F" and "0K" are
     both accepted).

2. `pub fn format_celsius(c: f64) -> String`
   Format as one decimal place followed by "°C", i.e. `format!("{:.1}°C", c)`
   semantics: `format_celsius(-40.0)` is "-40.0°C".

The `TempError` enum is already defined; do not change it or the function
signatures.
'''
timeout_secs = 300
max_cost_usd = 0.25

