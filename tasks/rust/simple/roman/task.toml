id = "rust-s-roman"
title = "Roman numeral codec"
stack = "rust"
tier = "simple"
prompt = '''
Implement the two stubbed functions in src/lib.rs.

1. `pub fn to_roman(n: u32) -> Option<String>`
   Canonical (subtractive) Roman numeral for `n`. Returns `Some` for
   1..=3999 and `None` otherwise. Canonical form uses M, CM, D, CD, C, XC,
   L, XL, X, IX, V, IV, I — e.g. 1990 -> "MCMXC", 2026 -> "MMXXVI",
   3999 -> "MMMCMXCIX".

2. `pub fn from_roman(s: &str) -> Option<u32>`
   Strict inverse of `to_roman`: returns `Some(n)` exactly when `s` is the
   canonical uppercase numeral for some `n` in 1..=3999, and `None` for
   everything else. Non-canonical spellings ("IIII", "VV", "IC", "XM"),
   lowercase input, embedded whitespace, and the empty string are all
   `None`. The round-trip `from_roman(&to_roman(n).unwrap()) == Some(n)`
   must hold for every valid `n`.

Keep the signatures exactly as stubbed.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden"]
weight = 4.0

