id = "rust-s-json-flatten"
title = "JSON flattener without serde"
stack = "rust"
tier = "simple"
prompt = '''
Implement `pub fn flatten(input: &str) -> Result<std::collections::BTreeMap<String, String>, String>`
in src/lib.rs, using only the standard library (this crate has no
dependencies and must stay that way — write the JSON parser by hand).

Accepted JSON subset:
- Values: objects, arrays, double-quoted strings, numbers, true, false,
  null. Whitespace (space, tab, \r, \n) is allowed around any token.
- Strings support exactly these escapes: \" \\ \/ \n \t (producing ", \, /,
  newline, tab). Any other backslash sequence is an error.
- Numbers: optional leading '-', one or more digits, optional fraction
  ('.' plus one or more digits), optional exponent (e or E, optional sign,
  one or more digits).
- The top-level value must be an object.

Flattening: walk the tree and emit one map entry per scalar. Keys are the
path segments joined with '.'; object members use their key, array elements
use their 0-based index. Values are rendered as: the unescaped string
content for strings; the EXACT source token text for numbers (do not
convert through f64 — "1e2" stays "1e2"); "true", "false", "null" for the
literals. Empty objects and arrays contribute no entries. If the same
flattened key is produced twice (duplicate object keys), the later value
wins.

Example: {"a": {"b": 1}, "tags": ["x", "y"], "on": true}
flattens to {"a.b": "1", "tags.0": "x", "tags.1": "y", "on": "true"}.

Errors: return Err with any message for malformed input — bad syntax, bad
escape, trailing content after the top-level object, non-object top level,
or an empty/whitespace-only input.
'''
timeout_secs = 300
max_cost_usd = 0.25

