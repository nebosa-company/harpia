id = "rust-s-csv-sums"
title = "CSV column sums"
stack = "rust"
tier = "simple"
prompt = '''
Implement `pub fn column_sums(csv: &str) -> Result<Vec<(String, Option<f64>)>, CsvError>`
in src/lib.rs. The `CsvError` enum is already defined; keep it and the
signature unchanged.

Input handling:
- Split the input into physical lines on '\n' and strip one trailing '\r'
  from each line (so CRLF input works). Physical lines are numbered from 1.
- Lines that are empty or whitespace-only are skipped entirely (they can
  appear anywhere, including before the header and between data rows).
- The first non-skipped line is the header. Fields on every line are
  separated by ',' with no quoting rules; every field is trimmed of
  surrounding whitespace. The trimmed header fields are the column names.
- Every later non-skipped line is a data row and must have exactly as many
  fields as the header; otherwise return
  `Err(CsvError::Ragged { line })` with that row's 1-based physical line
  number (report the first offending row).
- If there is no header at all (no non-skipped lines), return
  `Err(CsvError::Empty)`.

Output: one `(name, sum)` pair per column, in header order. A column's sum
is `Some(total)` when EVERY data cell in the column parses as an f64
(`str::parse::<f64>` on the trimmed cell); if any cell fails to parse the
column's entry is `None`. With zero data rows every column is `Some(0.0)`.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests/hidden_edge.rs"]
cmd = ["cargo", "test", "--quiet", "--test", "hidden_edge"]
