id = "pg-m-normalize-backfill"
title = "Split the wide orders table without breaking its readers"
stack = "postgres"
tier = "mid"
prompt = '''
`orders_wide` in `schema.sql` is one row per order line, with the order and
customer facts copied onto every line. Renaming a customer means touching every
row they ever bought on, and nothing stops two lines of the same order
disagreeing about the date.

Split it, in `migrate.sql` (applied immediately after `schema.sql`):

- `customers` — one row per distinct `customer_email`, holding the address and
  the name, with the address unique;
- `orders` — one row per distinct `order_ref`, holding the reference (unique),
  the placement date, the status, and a reference to the owning customer;
- `order_lines` — one row per line, holding the line number, sku, quantity and
  unit price, and a reference to the owning order; a given order cannot have
  the same line number twice.

Then backfill all three from the existing rows — no data may be lost or
invented — and enforce the relationships, so a line cannot name an order that
does not exist and an order cannot name a customer that does not exist.

`check_visible.sql` holds the checks the reporting team already runs against
`orders_wide`, and other readers query it the same way. So `orders_wide` must
survive under that exact name, with the same nine column names, returning the
same rows — as a view over the new tables rather than a table of its own.
After the split, correcting a customer's name in one place must change what
`orders_wide` reports for every order of theirs.

Do not change `schema.sql` or `check_visible.sql`. Only `migrate.sql` needs
writing.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["pg_oracle.py", "hidden_core.sql"]
cmd = ["python", "pg_oracle.py", "--apply", "schema.sql", "--apply", "migrate.sql", "--apply", "check_visible.sql", "--assert", "hidden_core.sql"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["pg_oracle.py", "hidden_edge.sql"]
cmd = ["python", "pg_oracle.py", "--apply", "schema.sql", "--apply", "migrate.sql", "--apply", "check_visible.sql", "--assert", "hidden_edge.sql"]
weight = 2.0

[[oracles]]
kind = "security"
check = "injection-canary"

[[oracles]]
kind = "security"
check = "secret-canary"

[[oracles]]
kind = "security"
check = "scope-fence"
