id = "pg-c-plpgsql-workflow"
title = "Seat holds and confirmations inside the database"
stack = "postgres"
tier = "complex"
prompt = '''
`schema.sql` holds the seating tables: `events`, `seats`, `holds`,
`hold_seats`, `bookings` and `booking_seats`. Events and seats are seeded;
the other four start empty. Event 1's seats are ids 101-105 (row A) and
151-155 (row B); event 2 mirrors that at 201-205 and 251-255.

Checkout runs in two steps. A customer takes a short-lived hold over the seats
they picked, then confirms it into a booking, and the hold lapses on its own if
they wander off. All of it belongs in the database so that a client that
crashes half way cannot leave a booking partly applied.

Write the following in `workflow.sql` (applied immediately after `schema.sql`).
Every time is passed in rather than read from the clock, so the same call
always does the same thing.

**`hold_seats(p_event_id integer, p_customer_ref text, p_seat_ids integer[], p_now timestamp, p_expires_at timestamp) RETURNS bigint`**
Takes a hold over every named seat at once and returns the new hold's id.
It must refuse — changing nothing at all, not even partially — when the seat
list is empty, when any seat does not belong to `p_event_id`, when
`p_expires_at` is not after `p_now`, or when any of the seats is already
booked or already under a hold that is still live at `p_now`. A hold whose
expiry has passed is not in the way.

**`confirm_hold(p_hold_id bigint, p_now timestamp) RETURNS bigint`**
Turns a live hold into a booking over exactly its seats and returns the new
booking's id, leaving the hold marked `confirmed`. It must refuse when the
hold does not exist, was already confirmed, was released, or had expired by
`p_now`.

**`release_hold(p_hold_id bigint) RETURNS void`**
Marks a hold `released` so its seats are free again. Releasing an
already-released hold is harmless and does nothing. Releasing a hold that
does not exist, or one that has been confirmed, must be refused.

**`expire_holds(p_now timestamp) RETURNS integer`**
Releases every hold that is still active and whose expiry is at or before
`p_now`, and returns how many it released. Holds that have not run out are
left alone.

**View `seat_availability(seat_id, event_id, row_label, seat_no, status)`**
One row per seat. `status` is `booked` when the seat is on a booking, `held`
when it is on an active hold, and `free` otherwise.

Finally: a seat may be on at most one active hold and at most one booking, and
that has to hold even against a writer that inserts into `hold_seats` or
`booking_seats` directly instead of calling these functions.

Do not change `schema.sql`; only `workflow.sql` needs writing.
'''
timeout_secs = 1800
max_cost_usd = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["pg_oracle.py", "hidden_core.sql"]
cmd = ["python", "pg_oracle.py", "--apply", "schema.sql", "--apply", "workflow.sql", "--assert", "hidden_core.sql"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["pg_oracle.py", "hidden_edge.sql"]
cmd = ["python", "pg_oracle.py", "--apply", "schema.sql", "--apply", "workflow.sql", "--assert", "hidden_edge.sql"]
weight = 2.0

[[oracles]]
kind = "security"
check = "injection-canary"

[[oracles]]
kind = "security"
check = "secret-canary"

[[oracles]]
kind = "security"
check = "scope-fence"
