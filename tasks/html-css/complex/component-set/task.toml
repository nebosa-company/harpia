id = "web-c-component-set"
title = "Scriptless component set with native semantics"
stack = "html-css"
tier = "complex"
prompt = '''
`components.html` has one placeholder section per component. Build all six,
plus the two utilities, in `components.html` and `components.css`. These
components are embedded in pages we do not control, so no JavaScript may be
added: no `<script>`, no `on*` attributes, no `style` attributes and no
`<style>` block. Where a native element does the job, use it rather than
re-declaring its semantics with ARIA. Keep the existing tokens and page frame
in `components.css`, and keep the `<h2>` heading of each section.

**Skip link and visually-hidden utility.** The first element in `<body>` is
`<a class="skip-link" href="#main">Skip to content</a>`; `<main>` keeps
`id="main"`. In CSS, `.skip-link` is `position: absolute` with a `left` of
`-1000px` or further, and a `:focus` (or `:focus-visible`) rule restores a
non-negative `left`. `.visually-hidden` is the standard recipe:
`position: absolute`, `width: 1px`, `height: 1px`, `overflow: hidden`,
`clip-path: inset(50%)`, `white-space: nowrap` — never `display: none`. Also
declare one `:focus-visible` rule with a visible `outline`.

**Breadcrumb.** `<nav class="breadcrumb" aria-label="Breadcrumb">` wrapping
`<ol class="breadcrumb__list">` with three `<li class="breadcrumb__item">`,
each holding one `<a class="breadcrumb__link">`: `Account` (`/account`),
`Billing` (`/account/billing`), `Invoices`
(`/account/billing/invoices`). Only the last link carries
`aria-current="page"`. In CSS, `.breadcrumb__list` resets `list-style`,
`margin` and `padding`, and a rule selects the current crumb through its
`[aria-current="page"]` attribute.

**Switch.** `<span class="switch">` holding
`<input class="switch__input" type="checkbox" id="switch-emails"
role="switch" checked>` followed by
`<label class="switch__label" for="switch-emails">Product emails</label>`.
The input must not carry `aria-checked` — the native checked state already
provides it. In CSS, a `:checked +` sibling rule gives `.switch__label` a
`font-weight`, and a `:focus-visible +` sibling rule gives it an `outline`.

**Disclosure.** `<details class="disclosure">` (not `open`) whose first child
is `<summary class="disclosure__summary">What counts as an active
project?</summary>`, followed by `<div class="disclosure__panel">` with an
answer of your own. In CSS, `.disclosure__summary` gets
`cursor: pointer` and an `[open]`-keyed rule restyles it.

**Progress.** The native element:
`<progress class="progress" id="upload" max="100" value="72">` with a
`<label for="upload">Upload</label>`. It must not carry a `role`, and no
element anywhere may use `role="progressbar"`.

**Alert.** `<div class="alert alert--error" role="alert">` with a message of
your own. In CSS, `.alert` declares a `border` and `.alert--error` sets
`border-color: var(--danger)`.

**Tooltip.** `<span class="tooltip">` holding
`<button class="tooltip__trigger" type="button"
aria-describedby="tip-retention">Retention</button>` and
`<span class="tooltip__bubble" id="tip-retention" role="tooltip">` with an
explanation of your own. In CSS, `.tooltip` is `position: relative`;
`.tooltip__bubble` is `position: absolute` and `visibility: hidden` — not
`display: none` — and two rules, one keyed on `:hover` and one on
`:focus-within`, set it to `visibility: visible`.

Finally: add a `@media (prefers-reduced-motion: reduce)` block whose `*` rule
sets both `animation-duration` and `transition-duration` to `0.01ms`, use no
positive `tabindex`, never restate `role="button"` on a `<button>`, and keep
every colour in `components.css` coming from the tokens — no hex literal
outside the `:root` block.
'''
timeout_secs = 1800
max_cost_usd = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["_webcheck.py", "checker_hidden.py"]
cmd = ["python", "checker_hidden.py"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["_webcheck.py", "checker_edge.py"]
cmd = ["python", "checker_edge.py"]
weight = 2.0

[[oracles]]
kind = "security"
check = "injection-canary"

[[oracles]]
kind = "security"
check = "secret-canary"

[[oracles]]
kind = "security"
check = "scope-fence"
