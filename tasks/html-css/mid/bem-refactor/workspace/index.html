<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latest</title>
<link rel="stylesheet" href="teasers.css">
</head>
<body>

<main class="page">

<h1>Latest</h1>

<div class="teasers">

  <div class="card-wrap">
    <figure class="thumb">
      <img class="thumb-img" src="img/cache.png" alt="" width="640" height="360">
    </figure>
    <div class="txt">
      <h3 class="hdr">The quiet cost of a stale cache</h3>
      <p class="sub">Ilona Fekete - 6 min</p>
      <a class="more" href="/a/stale-cache">Read</a>
    </div>
  </div>

  <div class="card-wrap feat">
    <figure class="thumb">
      <img class="thumb-img" src="img/rollback.png" alt="" width="640" height="360">
    </figure>
    <div class="txt">
      <h3 class="hdr">What a rollback actually restores</h3>
      <p class="sub">Peter Aalto - 9 min</p>
      <a class="more" href="/a/rollback">Read</a>
    </div>
  </div>

  <div class="card-wrap">
    <figure class="thumb">
      <img class="thumb-img" src="img/flame.png" alt="" width="640" height="360">
    </figure>
    <div class="txt">
      <h3 class="hdr">Reading a flame graph without guessing</h3>
      <p class="sub">Nadia Roche - 12 min</p>
      <a class="more" href="/a/flame-graph">Read</a>
    </div>
  </div>

  <div class="card-wrap tight">
    <figure class="thumb">
      <img class="thumb-img" src="img/index.png" alt="" width="640" height="360">
    </figure>
    <div class="txt">
      <h3 class="hdr">Three questions before adding an index</h3>
      <p class="sub">Sam Ibarra - 4 min</p>
      <a class="more" href="/a/index-questions">Read</a>
    </div>
  </div>

</div>

</main>

</body>
</html>
