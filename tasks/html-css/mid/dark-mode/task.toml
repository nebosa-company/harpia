id = "web-m-dark-mode"
title = "Dark mode via custom properties and prefers-color-scheme"
stack = "html-css"
tier = "mid"
prompt = '''
`theme.css` hard-codes one light palette into every component rule. Rework it
into a token layer that honours both the operating-system preference and an
explicit choice stamped on the root element as `data-theme="dark"` or
`data-theme="light"`.

Do not edit `account.html`: no `style` attributes, no `<style>` block, no
`<script>`. Keep every existing layout, spacing and typography rule.

The palette is these six tokens:

| token | light | dark |
|---|---|---|
| `--bg` | `#ffffff` | `#0e1116` |
| `--surface` | `#f4f7fb` | `#171c24` |
| `--fg` | `#171b22` | `#eef2f8` |
| `--muted` | `#5b6472` | `#9aa6b6` |
| `--accent` | `#1257c9` | `#79b0ff` |
| `--border` | `#d7dde6` | `#2a323d` |

`theme.css` must define them in exactly three blocks, and nowhere else:

1. a bare `:root` block holding the complete light palette;
2. inside `@media (prefers-color-scheme: dark)`, a
   `:root:not([data-theme="light"])` block holding the complete dark palette —
   the guard is what lets an explicit light choice beat the system
   preference;
3. a top-level `:root[data-theme="dark"]` block holding the complete dark
   palette, so an explicit dark choice wins in a light environment.

Also declare `color-scheme: light dark` on the root element.

Every component rule must then read tokens instead of literals:

- `body` — `background: var(--bg)`, `color: var(--fg)`
- `.card` — `background: var(--surface)`, `color: var(--fg)`, border colour
  `var(--border)`
- `.muted` and `.field__label` — `color: var(--muted)`
- `.btn` — `color: var(--accent)`, border colour `var(--border)`

No hex colour literal may appear anywhere in the file outside the three token
blocks.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["_webcheck.py", "checker_hidden.py"]
cmd = ["python", "checker_hidden.py"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["_webcheck.py", "checker_edge.py"]
cmd = ["python", "checker_edge.py"]
weight = 2.0

