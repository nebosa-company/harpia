id = "ts-m-csvtuple"
title = "CSV parser whose row type follows the header tuple"
stack = "typescript"
tier = "mid"
timeout_secs = 720
max_cost_usd = 1.0
prompt = '''
Build the CSV importer in `src/csv.ts`. Replace the placeholder
declarations that are there now; keep the file path and every exported
name.

Callers know their columns at authoring time and pass them as a plain
array literal. The row type follows from that literal — no `as const` at
the call site, no `Record<string, string>` stand-in:

    type Header = readonly string[]
    type Row<H extends Header>       // one string property per column name
    type ColumnName<H extends Header>

    function parseRows<H extends Header>(text: string, header: H): Row<H>[]
    function column<R extends Record<string, string>, K extends keyof R & string>(
      rows: readonly R[], key: K): string[]
    function toCsv<H extends Header>(header: H, rows: readonly Row<H>[]): string

`ColumnName<H>` is the union of the header's column names, and `Row<H>`
maps each of them to `string`. `column` reads its key off the row type
it was handed, so a column the rows do not have is a build error.

So `parseRows(text, ["id", "name"])` returns `{ id: string; name: string }[]`,
reading `.id` compiles and reading `.sku` does not.

Parsing follows the usual comma-separated rules:

- records are separated by `\n` or `\r\n`, mixed freely; one trailing
  newline at the very end does not add an empty record;
- a field may be wrapped in double quotes, and a quoted field may
  contain commas, line breaks, and doubled quotes (`""` is one literal
  `"`);
- an unquoted field is taken verbatim, including surrounding spaces;
- the first record is the header row. It must equal the `header`
  argument, field for field and in order; otherwise throw a `TypeError`
  whose message is exactly
  `header mismatch: expected id,name but found sku,name` — the two lists
  joined with commas, in that sentence;
- a data record with fewer fields than the header fills the missing
  columns with the empty string; fields beyond the header are dropped;
- text that is empty, or that holds only the header row, yields no rows;
- a `header` argument with no columns is a `TypeError` whose message is
  exactly `header must not be empty`.

`column(rows, key)` pulls one column out in row order. `toCsv(header,
rows)` is the inverse of `parseRows`: it writes the header row followed
by one record per row, joins records with `\n`, adds no trailing
newline, and quotes exactly those fields that contain a comma, a double
quote, a carriage return or a newline — doubling any embedded quote. A
row missing a column writes an empty field for it.
'''

