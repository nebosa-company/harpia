id = "ts-m-result"
title = "Result combinators that accumulate their error union"
stack = "typescript"
tier = "mid"
timeout_secs = 720
max_cost_usd = 1.0
prompt = '''
Build the `Result` vocabulary in `src/result.ts`. Replace the
placeholder declarations that are there now; keep the file path and
every exported name.

    type Ok<T>        = { readonly ok: true;  readonly value: T }
    type Err<E>       = { readonly ok: false; readonly error: E }
    type Result<T, E> = Ok<T> | Err<E>
    type OkOf<R>      // the T of a Result, never otherwise
    type ErrOf<R>     // the E of a Result, never otherwise

Constructors and guards:

    function ok<T>(value: T): Ok<T>
    function err<E>(error: E): Err<E>
    function isOk<T, E>(result: Result<T, E>): result is Ok<T>
    function isErr<T, E>(result: Result<T, E>): result is Err<E>

`ok("x")` must be `Ok<string>` — not `Result<string, never>` and not
`Ok<unknown>`. Both guards narrow, so a caller that passes `isOk` reads
`.value` without a cast.

Combinators. Each leaves its input untouched and returns a fresh object:

    map<T, E, U>(r, fn: (value: T) => U): Result<U, E>
    mapErr<T, E, F>(r, fn: (error: E) => F): Result<T, F>
    andThen<T, E, U, F>(r, fn: (value: T) => Result<U, F>): Result<U, E | F>
    orElse<T, E, U, F>(r, fn: (error: E) => Result<U, F>): Result<T | U, F>
    unwrapOr<T, E>(r, fallback: T): T
    unwrapOrElse<T, E>(r, fn: (error: E) => T): T

The error union is the point: chaining a step that can fail with
`"range"` onto one that can fail with `"parse"` gives a result whose
error type is `"parse" | "range"`. `map` never runs `fn` on an error,
`mapErr` never runs `fn` on a success, and neither ever swallows the
other side.

Aggregation:

    all(results)        // a tuple in, a tuple out
    partition(results)  // { values, errors }

- `all` takes a tuple of results and returns `Ok` of the tuple of their
  values — position by position, each keeping its own type — or the
  **leftmost** `Err`, unchanged. Its error type is the union of the
  inputs' error types. `all([])` is `Ok<[]>`. A caller passing a plain
  array literal must get the tuple types without writing `as const`.
- `partition` takes an array of results and returns
  `{ values: T[]; errors: E[] }`, each in input order.

Interop:

    fromThrowable<A extends unknown[], T, E>(
      fn: (...args: A) => T,
      onError: (cause: unknown) => E,
    ): (...args: A) => Result<T, E>

The returned function calls `fn` and gives back `ok(...)` with its
result, or `err(onError(cause))` when it threw. The wrapper keeps the
parameter list of `fn`, so it is called exactly the same way.
'''

[[oracles]]
kind = "hidden-tests"
inject = [
  "tsconfig.oracle.json",
  "dist/package.json",
  "tests_hidden/_node.d.ts",
  "tests_hidden/core.test.ts",
]
cmd = ["cmd", "/c", "npx tsc -p tsconfig.oracle.json && node --test dist/tests_hidden/core.test.js"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tsconfig.types.json", "types_hidden/probe.ts"]
cmd = ["cmd", "/c", "npx tsc -p tsconfig.types.json --noEmit --strict"]
weight = 2.0

