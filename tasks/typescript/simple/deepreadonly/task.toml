id = "ts-s-deepreadonly"
title = "Hand-rolled DeepReadonly and a matching deep freeze"
stack = "typescript"
tier = "simple"
timeout_secs = 300
max_cost_usd = 0.25
prompt = '''
Finish `src/deep-readonly.ts`. Replace the placeholder declarations that
are there now; keep the file path and every exported name.

Exports:

    type DeepReadonly<T>
    type DeepMutable<T>
    function deepFreeze<T>(value: T): DeepReadonly<T>
    function isDeeplyFrozen(value: unknown): boolean

`DeepReadonly<T>` makes every property, at every depth, `readonly`:

- `string`, `number`, `boolean`, `bigint`, `symbol`, `null` and
  `undefined` are returned unchanged;
- a function type is returned unchanged;
- `Date` is returned unchanged;
- `Map<K, V>` becomes `ReadonlyMap<DeepReadonly<K>, DeepReadonly<V>>` and
  `Set<U>` becomes `ReadonlySet<DeepReadonly<U>>`;
- `U[]` becomes `readonly DeepReadonly<U>[]`, and a tuple keeps its
  length and element types while becoming readonly;
- anything else object-shaped keeps its keys — optional properties stay
  optional — with each property made `readonly` and its type passed
  through `DeepReadonly` in turn.

`DeepMutable<T>` is the exact inverse: it strips `readonly` at every
depth, turns `ReadonlyMap`/`ReadonlySet` back into `Map`/`Set`, and turns
readonly arrays and readonly tuples back into mutable ones. The same
carve-outs apply (primitives, functions and `Date` pass through).
`DeepMutable<DeepReadonly<X>>` must come back to `X` for plain object
trees.

`deepFreeze(value)` freezes in place and returns the very same object it
was given, typed as `DeepReadonly<T>`:

- a non-object (including `null`) is returned as-is;
- otherwise the value is frozen with `Object.freeze`, and every own
  enumerable property value is deep-frozen first;
- arrays are frozen and their elements deep-frozen;
- a value that is already frozen is not descended into again, which also
  makes the function safe on cyclic structures;
- functions are not descended into and are not frozen.

`isDeeplyFrozen(value)` reports whether `value` would survive that
treatment unchanged: `true` for any non-object, `true` for a function,
and for an object `true` only when the object itself is frozen and every
own enumerable property value is deeply frozen. It must terminate on
cyclic structures.
'''

[[oracles]]
