id = "ts-s-enumunion"
title = "Enum and union interoperability helpers"
stack = "typescript"
tier = "simple"
timeout_secs = 300
max_cost_usd = 0.25
prompt = '''
Finish `src/enum-union.ts`. The two enums at the top of the file are
settled — same members, same values, same order. Everything under them
is a placeholder to replace. Keep the file path and every exported name.

    enum Level    { Trace = "trace", Debug = "debug", Info = "info",
                    Warn = "warn", Error = "error" }
    enum Priority { Low = 1, Normal = 5, High = 10 }

Types to derive (none of them may be written out by hand — each must
follow from the enum it describes):

    type LevelValue           // "trace" | "debug" | "info" | "warn" | "error"
    type LevelName            // "Trace" | "Debug" | "Info" | "Warn" | "Error"
    type EnumValue<E>         // the union of E's member values
    type EnumName<E>          // the union of E's member names, as strings

Values and functions:

    const LEVELS: readonly Level[]
    function isLevel(value: unknown): value is Level
    function toLevel(value: string): Level | undefined
    function levelName(level: Level): LevelName
    function compareLevels(a: Level, b: Level): number
    function enumValues<E extends object>(source: E): EnumValue<E>[]
    function enumNames<E extends object>(source: E): EnumName<E>[]

- `LEVELS` lists every `Level` member in declaration order.
- `isLevel` narrows an unknown value to `Level`.
- `toLevel` maps a wire string to its member, or `undefined`.
- `levelName` gives the member's *name* — `levelName(Level.Info)` is
  `"Info"` — and its return type must be the union of names, not
  `string`.
- `compareLevels(a, b)` orders by severity, trace lowest and error
  highest: negative when `a` is less severe, `0` when equal, positive
  when `a` is more severe. It is usable directly as an `Array.sort`
  comparator.
- `enumValues` and `enumNames` work on any enum object, string or
  numeric. A numeric enum's runtime object also carries the reverse
  mapping from value back to name; those entries must not appear in
  either result. Declaration order is preserved:
  `enumNames(Priority)` is `["Low", "Normal", "High"]` and
  `enumValues(Priority)` is `[1, 5, 10]`.
'''

