id = "ts-s-eventmap"
title = "Typed event-map emitter"
stack = "typescript"
tier = "simple"
timeout_secs = 300
max_cost_usd = 0.25
prompt = '''
Implement the synchronous event emitter in `src/emitter.ts`. Replace the
placeholder declarations that are there now; keep the file path and the
exported names.

The module exports:

    type EventMap = Record<string, unknown>
    interface Emitter<M extends EventMap>
    function createEmitter<M extends EventMap>(): Emitter<M>

`M` maps an event name to the payload that event carries. Every method of
`Emitter<M>` must be keyed on `M`, so that at a call site:

- the event-name argument accepts only keys of `M` and nothing else;
- a listener's payload parameter already has the payload type of that
  key, without an annotation and without a cast;
- `emit` accepts exactly the payload type of the key it was given.

Methods, all generic in `K extends keyof M`:

    on(event: K, listener: (payload: M[K]) => void): () => void
    once(event: K, listener: (payload: M[K]) => void): () => void
    off(event: K, listener: (payload: M[K]) => void): void
    emit(event: K, payload: M[K]): number
    listenerCount(event: K): number

Behaviour:

- `on` registers `listener` for `event` and returns a function that
  removes that one registration. Calling that function twice is
  harmless — the second call removes nothing.
- Registering the same function twice registers it twice: it is called
  twice per emit, and a single `off` removes a single registration.
- `once` registers a listener that is removed *before* its first call, so
  a listener that emits the same event again is not re-entered.
- `off(event, listener)` removes the earliest surviving registration made
  for `event` with that function, whether it was made through `on` or
  through `once`. Removing something that is not registered is a no-op.
- `emit` calls the listeners registered for `event` in registration
  order, passing `payload`, and returns how many it called. A listener
  registered during that emit is not called by it; a listener removed
  during that emit is not called by it either.
- `listenerCount` returns the number of live registrations for `event`,
  and 0 for an event nobody listens to.
- Events are independent: emitting one never touches another's listeners.
'''

