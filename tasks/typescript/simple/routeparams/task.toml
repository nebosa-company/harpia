id = "ts-s-routeparams"
title = "Route parameters from a template-literal pattern"
stack = "typescript"
tier = "simple"
timeout_secs = 300
max_cost_usd = 0.25
prompt = '''
Finish `src/route.ts`. Replace the placeholder declarations that are
there now; keep the file path and every exported name.

A route pattern is a string that starts with `/` and is made of
`/`-separated segments. A segment that starts with `:` is a parameter
whose name is the rest of the segment; every other segment is a literal.

Exports:

    type ParamName<P extends string>
    type PathParams<P extends string>
    function matchRoute<P extends string>(pattern: P, path: string): PathParams<P> | null
    function buildPath<P extends string>(pattern: P, params: PathParams<P>): string
    function paramNames<P extends string>(pattern: P): ParamName<P>[]

`ParamName<P>` is the union of the parameter names in `P`, and `never`
for a pattern with none. `PathParams<P>` is an object type with one
`string` property per parameter name — so `PathParams<"/u/:id/p/:pid">`
is `{ id: string; pid: string }`, and `PathParams<"/health">` is `{}`.
Both must be computed from the pattern's literal type; do not accept a
`Record<string, string>` stand-in.

`matchRoute(pattern, path)` returns the captured parameters, or `null`
when the path does not match:

- both sides are compared segment by segment after dropping one trailing
  `/` (so `/a/b` and `/a/b/` are the same path, while `/` stays `/`);
- the segment counts must be equal;
- literal segments must be equal, case-sensitively;
- a parameter segment matches any non-empty segment, and the captured
  value is the segment passed through `decodeURIComponent`;
- an empty segment never matches a parameter.

`buildPath(pattern, params)` substitutes each parameter with
`encodeURIComponent` applied to its value and leaves literal segments
alone. If a value is missing or the empty string it throws a `TypeError`
whose message is exactly `missing route parameter "<name>"`.

`paramNames(pattern)` lists the parameter names in the order they appear
in the pattern. A pattern with no parameters gives an empty array.
'''

