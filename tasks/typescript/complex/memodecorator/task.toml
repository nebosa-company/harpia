id = "ts-c-memodecorator"
title = "Caching wrappers and decorators that keep their signatures"
stack = "typescript"
tier = "complex"
timeout_secs = 1800
max_cost_usd = 4.0
prompt = '''
Build the caching layer in `src/cache.ts`. Replace the placeholder
declarations that are there now; keep the file path and every exported
name.

    interface MemoOptions<A extends unknown[]> {
      maxSize?: number
      keyOf?: (...args: A) => string
    }

    interface Memoized<A extends unknown[], R> {
      (...args: A): R
      readonly size: number
      has(...args: A): boolean
      clear(): void
    }

    interface CacheOptions {
      maxSize?: number
      keyOf?: (args: readonly unknown[]) => string
    }

`memoize` is overloaded — with and without options — and neither
overload may widen the wrapped function:

    function memoize<A extends unknown[], R>(fn: (...args: A) => R): Memoized<A, R>
    function memoize<A extends unknown[], R>(fn: (...args: A) => R, options: MemoOptions<A>): Memoized<A, R>

Calling the wrapper is calling the function: the same parameter list,
the same return type. `keyOf` receives exactly the wrapped function's
parameters, and `has` takes them too.

Behaviour:

- the cache key is `keyOf(...args)` when given, otherwise
  `JSON.stringify(args)` over the whole argument array;
- a cache hit returns the stored value without calling `fn` again; a
  stored `undefined` is a hit, not a miss;
- `fn` is called with whatever `this` the wrapper was called with;
- when `fn` throws, nothing is stored and the exception propagates;
- `size` is the number of entries currently held; `clear()` empties
  them; `has(...args)` reports whether an entry exists without counting
  as a use;
- with `maxSize`, the cache evicts least-recently-used entries down to
  that many; reading an entry through a call makes it most recently
  used, `has` does not. `maxSize` that is not a positive integer is a
  `RangeError` whose message is exactly
  `maxSize must be a positive integer`, thrown when `memoize` is called.

Two method decorators, in the standard (non-`experimentalDecorators`)
form:

    function cached<This, A extends unknown[], R>(
      target: (this: This, ...args: A) => R,
      context: ClassMethodDecoratorContext<This, (this: This, ...args: A) => R>,
    ): (this: This, ...args: A) => R

    function cachedWith(options: CacheOptions): <This, A extends unknown[], R>(
      target: (this: This, ...args: A) => R,
      context: ClassMethodDecoratorContext<This, (this: This, ...args: A) => R>,
    ) => (this: This, ...args: A) => R

A decorated method keeps its exact signature. Its cache is **per
instance and per method**: two instances of the same class never share
entries, and two decorated methods on one instance never collide. The
method still sees its own `this`. `cachedWith` takes the same key and
size rules as `memoize`, except that its `keyOf` receives the argument
array rather than spread arguments.

Finally, two helpers over those per-instance caches:

    function methodCacheSize(instance: object, method: string): number
    function clearMethodCache(instance: object, method: string): void

Both are safe on an instance or a method name that has nothing cached:
the size is `0` and clearing does nothing.
'''

