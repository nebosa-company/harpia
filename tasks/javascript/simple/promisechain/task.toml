id = "js-s-promisechain"
title = "Fix the pipeline that swallows rejections"
stack = "javascript"
tier = "simple"
timeout_secs = 300
max_cost_usd = 0.25
prompt = '''
`pipeline.mjs` runs a value through a list of transformation stages. It
exports two functions:

    runPipeline(input, stages) -> Promise
    tap(fn)                    -> a stage function

The contract:

- `runPipeline` awaits `input` (it may be a value, a promise, or any
  thenable), then applies every stage in `stages` LEFT TO RIGHT. Each stage
  is called with the previous stage's settled result and may return a plain
  value or a thenable; the pipeline waits for it before moving on.
- The returned promise settles with the value produced by the last stage.
  With an empty `stages` array it settles with the awaited input.
- If a stage throws, or returns a promise that rejects, the pipeline's
  promise REJECTS with that reason and no later stage runs. The reason is
  passed through untouched, whatever its type.
- Nothing may escape as an unhandled rejection: a failing stage results in
  a rejected pipeline promise and nothing else. It must be impossible for a
  failing stage to take the process down.
- `stages` that is not an array, or a stage that is not a function, makes
  the returned promise reject with a `TypeError`. The `stages` array itself
  is never modified.
- `tap(fn)` builds a stage that runs `fn(value)` for its side effect and
  then passes the ORIGINAL value along unchanged. If `fn` returns a
  thenable the stage waits for it before continuing, and if `fn` throws or
  its thenable rejects, the stage fails with that reason. `tap` itself
  throws a `TypeError` immediately when `fn` is not a function.

Three symptoms are open against this module:

1. Transformations are lost. A pipeline of stages that each modify the
   value resolves with the original input instead of the transformed
   result — as if the stages had never run, even though their side effects
   clearly did.
2. A failing stage takes the whole process down with
   `ERR_UNHANDLED_REJECTION` instead of rejecting the promise the caller is
   already awaiting.
3. A `tap` whose callback is asynchronous does not hold up the pipeline:
   the next stage starts before the tap's work has finished, and if that
   work fails nobody ever hears about it.

Fix `pipeline.mjs` so the module meets the contract above. Keep both export
names and their signatures unchanged.
'''

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_core.mjs"]
cmd = ["node", "--test", "tests_hidden_core.mjs"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_edge.mjs"]
cmd = ["node", "--test", "tests_hidden_edge.mjs"]
weight = 2.0

