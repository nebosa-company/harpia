id = "js-s-counters"
title = "Fix the counter factory that shares state"
stack = "javascript"
tier = "simple"
timeout_secs = 300
max_cost_usd = 0.25
prompt = '''
`counters.mjs` builds the per-widget counters our metrics dashboard uses.
It exports two factories:

    makeCounters(n, start = 0)  -> array of n counter functions
    labelCounters(n, start = 0) -> array of n labelled counter functions

The contract:

- Each factory returns an array of exactly `n` functions.
- Every returned function owns a PRIVATE running value that begins at
  `start`. Calling it adds 1 to that function's own value and returns the
  new value. Two counters from the same array never influence each other,
  and neither do counters from two separate factory calls.
- A `makeCounters` counter returns the new number.
- A `labelCounters` counter returns the string `"c<index>:<value>"`, where
  `<index>` is that counter's position in the array it was returned in.
  So the first counter of `labelCounters(3)` returns "c0:1" the first time
  it is called, "c0:2" the second time, and the last one returns "c2:1".
- `n` must be a non-negative integer and `start` must be a finite number;
  anything else throws a `TypeError`. `n === 0` yields an empty array.

Two bugs are open against this module:

1. The dashboard shows one shared number. Incrementing the counter for
   widget A makes widget B's counter report A's value too — every counter
   in an array (and, on the same page, across arrays) climbs together
   instead of counting its own events.
2. Every labelled counter reports the same index, and it is an index no
   counter actually has: `labelCounters(3)` produces labels beginning
   "c3:" instead of "c0:", "c1:", "c2:".

Fix `counters.mjs` so the module meets the contract above. Keep both export
names and their signatures unchanged.
'''

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_core.mjs"]
cmd = ["node", "--test", "tests_hidden_core.mjs"]
weight = 4.0

