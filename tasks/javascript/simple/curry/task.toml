id = "js-s-curry"
title = "Curry with placeholders"
stack = "javascript"
tier = "simple"
timeout_secs = 300
max_cost_usd = 0.25
prompt = '''
Implement `curry.mjs` in the project root as an ES module with two named
exports:

    _                                  the placeholder value
    curry(fn, arity = fn.length)       the curried wrapper

`curry` returns a function that gathers arguments across as many calls as
it takes. While fewer than `arity` positions are filled it returns a NEW
curried function carrying what it has so far; once all `arity` positions
are filled it calls `fn` with the gathered arguments and returns the
result.

Argument placement:

- Arguments of one call fill the still-open positions left over from
  earlier calls, in order, and anything beyond that is appended.
- `_` reserves a position: it is stored as an open slot rather than a
  value, and the next call's arguments fill the open slots first. So with
  `sub = curry((a, b) => a - b)`, `sub(_, 5)(10)` is `10 - 5`.
- Arguments beyond `arity` are kept and forwarded to `fn` after the first
  `arity` ones, in the order they were supplied.

Other requirements:

- Partially applied functions are reusable and independent: applying more
  arguments to one never changes what another one holds.
- The `length` of a curried function is how many positions it still needs —
  `curry(f3).length` is 3, `curry(f3)(1).length` is 2, and
  `curry(f3)(_, 2).length` is 2 as well.
- Calling a curried function with no arguments at all makes no progress and
  returns a function that still wants the same positions.
- The `this` of the call that supplies the final argument is forwarded to
  `fn`.
- `arity` of 0 means the wrapper calls `fn` as soon as it is called.
- `curry` throws a `TypeError` if `fn` is not a function or if an explicit
  `arity` is not a non-negative integer.
- `_` must be a symbol, so it can never collide with real data.

Create the module at `curry.mjs` (replace the placeholder already there)
and keep both export names exactly as given.
'''

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_core.mjs"]
cmd = ["node", "--test", "tests_hidden_core.mjs"]
weight = 4.0

