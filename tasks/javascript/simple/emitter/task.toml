id = "js-s-emitter"
title = "Event emitter with once and off"
stack = "javascript"
tier = "simple"
timeout_secs = 300
max_cost_usd = 0.25
prompt = '''
Implement `emitter.mjs` in the project root as an ES module exporting one
class:

    export class Emitter { ... }

Instances hold listener registrations in memory — no dependencies, no
platform event API. The methods:

- `on(event, handler)` registers `handler` for `event` and returns an
  unsubscribe function. Registering the same handler twice for the same
  event yields two independent registrations, and the handler is then
  called twice per emit.
- `once(event, handler)` registers a handler that runs at most once. It is
  removed BEFORE it is invoked, so an emit triggered from inside it does
  not run it again. Also returns an unsubscribe function.
- The unsubscribe function returned by `on`/`once` removes exactly that one
  registration. It returns `true` if it removed a live registration and
  `false` if there was nothing left to remove; calling it again is
  harmless.
- `off(event, handler)` removes the EARLIEST surviving registration of that
  handler for that event (a `once` registration counts), and returns `true`
  if one was removed, `false` otherwise.
- `emit(event, ...args)` calls the handlers registered for `event` at the
  moment the emit began, in registration order, passing `...args` and with
  `this` bound to the emitter. It returns the number of handlers it called.
  A handler registered DURING this emit is not called by it; a
  registration removed during this emit before it was reached is skipped.
  If handlers throw, every remaining handler still runs, and afterwards
  `emit` throws the first error that was raised.
- `listenerCount(event)` returns how many registrations `event` currently
  has; `emit` for an event with none returns 0.
- `events()` returns the event names that currently have at least one
  registration. An event drops off the list when its last registration
  goes, and re-appears at the END of the list if it gains one again.

Event names may be strings or symbols; anything else throws a `TypeError`,
as does a handler that is not a function.

Create the module at `emitter.mjs` (replace the placeholder already there)
and keep `Emitter` exported by that name.
'''

