id = "js-s-lazyrange"
title = "Lazy range iterator with combinators"
stack = "javascript"
tier = "simple"
timeout_secs = 300
max_cost_usd = 0.25
prompt = '''
Implement `range.mjs` in the project root as an ES module with one named
export:

    range(start, end, step = 1) -> lazy sequence

`range` returns a LAZY sequence object — never an array. It must produce
values only as they are pulled, so a sequence spanning millions of numbers
costs nothing until it is consumed.

The sequence object:

- is iterable: `seq[Symbol.iterator]()` returns a FRESH iterator every time,
  so the same sequence can be walked more than once and gives the same
  values each time;
- each iterator is itself iterable — `it[Symbol.iterator]()` returns `it`;
- each iterator follows the protocol exactly: `next()` yields
  `{ value, done: false }` per element, then `{ value: undefined, done:
  true }` forever after, and `return()` ends it early, answering
  `{ value: undefined, done: true }` and making every later `next()` done;
- carries four methods, all of which are also present on whatever `map`,
  `filter` and `take` return:
  - `map(fn)` — a new lazy sequence of `fn(value, index)`;
  - `filter(predicate)` — a new lazy sequence of the values for which
    `predicate(value, index)` is truthy, where `index` counts the values
    the predicate has seen;
  - `take(n)` — a new lazy sequence of at most the first `n` values; it
    must stop pulling from its source as soon as it has `n`;
  - `toArray()` — the values collected into a real array.

Numbers: `start` counts up (or down) by `step` and stops BEFORE `end`, so
`end` is exclusive. A negative `step` counts down. `range(5, 5)` and
`range(5, 0)` are empty. `start`, `end` and `step` must be finite numbers
or a `TypeError` is thrown; a `step` of 0 throws a `RangeError`. `take(n)`
throws a `TypeError` unless `n` is a non-negative integer; `map` and
`filter` throw a `TypeError` unless given a function.

Laziness is part of the contract: `range(0, 1e9).map(f).take(3).toArray()`
must return promptly, having called `f` exactly three times.

Create the module at `range.mjs` (replace the placeholder already there)
and keep the export named `range`.
'''

