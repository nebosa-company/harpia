id = "js-c-stackvm"
title = "Stack-machine interpreter with closures"
stack = "javascript"
tier = "complex"
timeout_secs = 1800
max_cost_usd = 4.0
prompt = '''
Implement `vm.mjs` in the project root as an ES module with one named
export:

    run(program, options = {}) -> { stack, output, globals }

`program` is an array of INSTRUCTIONS. Each instruction is an array whose
first element is the opcode string; anything else throws a `TypeError`, as
does a `program` that is not an array.

`options.globals` (default `{}`) seeds the global variables.
`options.maxSteps` (default 100000) caps how many instructions may run;
exceeding it throws an `Error` mentioning the step limit, which is how an
endless loop is stopped.

The machine has an operand stack PER CALL FRAME, and lexically scoped
variables. The opcodes:

- `["PUSH", value]` pushes a literal.
- `["POP"]`, `["DUP"]` (push a copy of the top), `["SWAP"]` (exchange the
  top two).
- `["ADD"]`, `["SUB"]`, `["MUL"]`, `["DIV"]`, `["MOD"]` pop the right
  operand, then the left, and push the result. They need two numbers and
  throw a `TypeError` otherwise, except that `ADD` also concatenates two
  strings. `DIV` and `MOD` by zero throw a `RangeError`.
- `["LT"]`, `["GT"]` compare two numbers (a `TypeError` otherwise) and push
  a boolean; `["EQ"]` compares any two values by `Object.is`.
- `["NOT"]` pops a value and pushes its negation as a boolean.
- `["LABEL", name]` marks a position and does nothing else. Labels are
  local to the instruction list they appear in, and a duplicate label in
  one list throws an `Error` before that list runs.
- `["JMP", label]` jumps; `["JZ", label]` pops a value and jumps only when
  it is falsy. An unknown label throws an `Error`.
- `["LOAD", name]` pushes a variable's value, searching the current scope
  and then its enclosing scopes; an unbound name throws a `ReferenceError`.
- `["STORE", name]` pops a value and assigns it to `name` in the nearest
  scope that already binds it, or defines it in the current scope when
  nothing does.
- `["CLOSURE", params, body]` pushes a closure: `params` is a list of
  parameter names and `body` an instruction list. It captures the scope it
  was created in — by reference, so two closures made in one scope see each
  other's writes, and a closure outlives the call that made it.
- `["CALL", argc]` pops `argc` arguments (the last one pushed is the last
  argument), then pops the callee. Calling something that is not a closure
  throws a `TypeError`. The body runs in a fresh scope whose parent is the
  captured scope, with the parameters bound; missing arguments are `null`
  and extra ones are dropped. `argc` must be a non-negative integer.
- `["RET"]` pops the frame's top value and returns it to the caller, which
  pushes it. Running off the end of a body returns `null`.
- `["PRINT"]` pops a value and appends it to the output.
- `["HALT"]` stops the whole program at once, nested calls included.

Popping from an empty frame stack throws an `Error` mentioning stack
underflow, and an unknown opcode throws an `Error` mentioning that.

`run` returns the TOP-LEVEL frame's stack (bottom first), the `output`
array in print order, and `globals`: a plain object of the global scope's
variables when the program stopped.

Create the module at `vm.mjs` (replace the placeholder already there) and
keep the export named `run`.
'''

[[oracles]]
kind = "hidden-tests"
inject = ["tests_hidden_core.mjs"]
cmd = ["node", "--test", "tests_hidden_core.mjs"]
weight = 4.0

