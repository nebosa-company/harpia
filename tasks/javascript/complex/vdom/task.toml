id = "js-c-vdom"
title = "Virtual-DOM diff and patch over plain objects"
stack = "javascript"
tier = "complex"
timeout_secs = 1800
max_cost_usd = 4.0
prompt = '''
Implement `vdom.mjs` in the project root as an ES module. There is no
browser here: the "DOM" is plain objects, which keeps the whole module
independent of any platform.

Exports:

    h(type, props, ...children) -> vnode
    render(vnode)               -> host node
    diff(oldVNode, newVNode)    -> array of patch operations
    patch(host, patches)        -> the resulting host tree
    toHtml(host)                -> string

A VNODE is `{ type, props, children, key }`:

- `type` is a tag name; anything that is not a non-empty string throws a
  `TypeError`.
- `props` is an object, `{}` when `null`/`undefined` was passed. A `key`
  prop is lifted out of `props` and onto `vnode.key`; without one, `key` is
  `null`. A key that is not a string or number throws a `TypeError`.
- `children` is flattened (nested arrays disappear), with `null`,
  `undefined`, `true` and `false` dropped and numbers converted to
  strings. A string child is a TEXT child. Element children come from `h`.
- Inside one children list, either EVERY child is a keyed element or no
  child has a key at all — any mix (including a keyed element beside a text
  child) throws an `Error`, as do duplicate keys.

A HOST NODE is `{ tag, attrs, children }`; a text node is simply a string.
`render` turns a vnode into host nodes, dropping any prop whose value is
`null`, `undefined` or `false` from `attrs` and keeping the rest in
insertion order.

`toHtml` serializes a host node: `<tag name="value">children</tag>`, attrs
in `attrs` order, a `true` value rendering as `name=""` and any other value
through `String`. In text, `&`, `<` and `>` become `&amp;`, `&lt;` and
`&gt;`; in attribute values `"` also becomes `&quot;`.

`diff(oldVNode, newVNode)` compares two ELEMENT vnodes (anything else
throws a `TypeError`) and returns operations to bring a host tree rendered
from the old one up to date. Comparing a tree with itself returns an empty
array. Every operation carries a `path`: the child indices to walk from the
root, so `[]` is the root and `[0, 2]` is its first child's third child.
The vocabulary:

    { op: "replace", path, node }          host node (or string) replacing
                                           the one at path
    { op: "text", path, value }            new text for the text node at
                                           path
    { op: "props", path, set, remove }     `set` is an object of attrs to
                                           write, `remove` a list of names
                                           to delete; only emitted when at
                                           least one of them has content
    { op: "insert", path, index, node }    insert a host node among the
                                           children of the node at path
    { op: "remove", path, index }          drop that child
    { op: "move", path, from, to }         move a child to another index

Rules: nodes of different types are replaced, never patched. Children
without keys are compared position by position. Children WITH keys are
matched by key, so reordering them must produce moves and never a replace —
and `patch` must move the existing host objects, keeping their identity,
rather than rebuild them.

`patch(host, patches)` applies the operations in order, mutating the host
tree in place, and returns the resulting root (which is a new object only
when the root itself was replaced). It does not modify the array it is
given. A non-object host or non-array patch list throws a `TypeError`.

Create the module at `vdom.mjs` (replace the placeholder already there) and
keep every export name exactly as given.
'''

[[oracles]]
