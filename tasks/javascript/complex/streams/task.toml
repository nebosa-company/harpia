id = "js-c-streams"
title = "Async-iterator stream combinators with backpressure"
stack = "javascript"
tier = "complex"
timeout_secs = 1800
max_cost_usd = 4.0
prompt = '''
Implement `streams.mjs` in the project root as an ES module: a small
pull-based streaming toolkit built on async iteration. No dependencies, no
timers.

A SOURCE is anything iterable — an array, a sync generator, an async
generator, or one of this module's own streams. A STREAM is what these
functions return: an object with a `[Symbol.asyncIterator]()` method, so
`for await (const v of stream)` works.

Exports:

    fromIterable(source)      -> stream of the source's values
    map(source, fn)           -> stream of fn(value, index); fn may be async
    filter(source, predicate) -> values where predicate(value, index) is
                                 truthy; the predicate may be async and its
                                 index counts the values it has seen
    take(source, n)           -> at most the first n values
    chunk(source, size)       -> arrays of `size` values, the last one
                                 shorter if the stream ends early; an empty
                                 source yields nothing
    concat(...sources)        -> every source's values, in order
    zip(a, b)                 -> [valueA, valueB] pairs, ending as soon as
                                 either side ends
    pipeline(source, ...ops)  -> applies each op, a function taking a
                                 source and returning a stream, in order
    toArray(source)           -> promise for all the values in an array
    channel(options)          -> a push-driven stream, described below

Pull-based means LAZY: nothing is produced or transformed until a consumer
asks. Taking 3 values from an endless source must call `map`'s function
exactly 3 times and pull exactly 3 values.

Early termination must be propagated. When a consumer stops — `break` out
of a `for await`, or `take` reaching its limit — every upstream iterator is
closed, so a generator's `finally` block runs.

Errors propagate: a source that throws, or a callback that throws or
rejects, surfaces out of the consuming `for await` or the `toArray`
promise.

`channel(options)` is the writable end, and `options.capacity` (a positive
number, default `Infinity`) is what makes it apply BACKPRESSURE. It
returns:

- `stream` — the readable side, consumed like any other stream;
- `push(value)` — returns a promise that resolves once the value has been
  accepted, which for a full channel is only after a consumer has taken
  one out. Pushing to a closed channel returns a rejected promise;
- `close()` — after the buffered values have been read, the stream ends;
- `size` — how many values are buffered right now.

A consumer that asks before anything has been pushed waits, and gets the
value as soon as one arrives.

Argument checking: `map` and `filter` need a function, `pipeline` needs
functions as ops, and anything else throws a `TypeError`; `take` needs a
non-negative integer and `chunk` a positive integer, or a `TypeError`;
`channel` throws a `RangeError` for a capacity that is not positive.

Create the module at `streams.mjs` (replace the placeholder already there)
and keep every export name exactly as given.
'''

