id = "js-m-scheduler"
title = "Generator-based cooperative scheduler"
stack = "javascript"
tier = "mid"
timeout_secs = 720
max_cost_usd = 1.0
prompt = '''
Implement `scheduler.mjs` in the project root as an ES module. It runs
generator functions as cooperative tasks on virtual time — there are no
timers, no promises and no wall clock anywhere in this module.

Exports:

    createScheduler() -> scheduler
    sleep(rounds)     -> instruction
    send(channel, value) -> instruction
    receive(channel)  -> instruction
    join(id)          -> instruction
    fork(genFn, ...args) -> instruction

A scheduler has three methods:

- `spawn(genFn, ...args)` starts a task from a generator function and
  returns its id. Ids are integers handed out from 1 upward in spawn order.
  A `genFn` that is not a function, or that does not return an iterator,
  throws a `TypeError`.
- `run(options)` runs everything to a standstill and returns a report.
  `options.maxRounds` (default 10000) caps the work: exceeding it throws an
  `Error`.
- `queued(channel)` returns a copy of the values still sitting in a
  channel.

Scheduling is round-robin over virtual rounds, numbered from 1:

- In each round every unfinished task gets AT MOST ONE step, visited in
  ascending id order. A step is a single resumption of the generator, which
  runs until its next `yield` or until it finishes.
- A task started with `fork` during a round takes its first step in the
  NEXT round.
- Rounds keep coming until every task has finished or nothing can move.

The instruction a task yields decides what happens next:

- `yield` on its own — or a yielded value that is not one of the
  instructions below — just gives up the rest of the round. The `yield`
  expression evaluates to `undefined`.
- `yield sleep(n)` parks the task for the next `n` rounds; `sleep(0)`
  behaves exactly like a bare `yield`. `n` must be a non-negative integer,
  or `sleep` throws a `TypeError`.
- `yield send(channel, value)` appends the value to that channel's FIFO
  queue and never blocks.
- `yield receive(channel)` blocks the task until the channel has a value.
  On the task's first turn where a value is waiting it takes the FRONT
  value and the `yield` expression evaluates to it. Two tasks receiving on
  one channel therefore get different values.
- `yield join(id)` blocks until that task has finished. If it returned, the
  `yield` evaluates to its return value; if it threw, that same error is
  thrown INTO the joining task at the `yield`, where it can be caught. An
  id that was never spawned throws a `RangeError` into the joining task.
- `yield fork(genFn, ...args)` spawns a task and evaluates to its new id.

Ending states: a task that returns is `"done"` with its return value; one
that lets an error escape is `"failed"` with that error and does not
disturb the other tasks; one that can never move again — waiting on a
channel nothing will fill, or joining a task that will never finish — is
`"blocked"` once the scheduler gives up.

`run` returns:

    { rounds, tasks: [{ id, status, value, error }, ...] }

`rounds` is how many rounds were started; `tasks` is in id order; `value`
is set only for `"done"` tasks and `error` only for `"failed"` ones, both
`undefined` otherwise.

Create the module at `scheduler.mjs` (replace the placeholder already
there) and keep all six export names exactly as given.
'''

