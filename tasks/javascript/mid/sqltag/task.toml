id = "js-m-sqltag"
title = "Tagged-template SQL builder"
stack = "javascript"
tier = "mid"
timeout_secs = 720
max_cost_usd = 1.0
prompt = '''
Implement `sqltag.mjs` in the project root as an ES module with five named
exports. It builds PARAMETERIZED SQL: interpolated values never reach the
query text, they become numbered placeholders.

    sql`...`                     -> fragment
    ident(name)                  -> fragment
    raw(text)                    -> fragment
    join(entries, separator)     -> fragment
    escapeLiteral(value)         -> string

A fragment is an object carrying at least:

- `text` — the SQL, with `$1`, `$2`, ... in place of the interpolated
  values, numbered from 1 in the order they appear;
- `values` — the array of those values, in the same order.

`sql` is a template tag. Literal template text is copied verbatim,
whitespace and newlines included. Each `${...}` becomes:

- another fragment: it is spliced in and its placeholders are RENUMBERED to
  fit their new positions, its values landing in the outer array in order.
  Fragments nest to any depth, and a fragment may be used in more than one
  query without being changed by it;
- an array: expanded into that many placeholders joined with `", "` — so
  `IN (${[1, 2, 3]})` becomes `IN ($1, $2, $3)`. Entries may themselves be
  fragments. An EMPTY array throws a `RangeError`, because there is no
  valid expansion;
- anything else: one placeholder, with the value stored untouched — a
  string full of quotes and semicolons is still just a parameter.

`undefined`, functions and symbols are never valid interpolated values and
throw a `TypeError`; `null` is a perfectly good value.

`ident(name)` renders a quoted identifier: wrapped in double quotes, with
any `"` inside doubled. It carries no values. A non-string or empty name
throws a `TypeError`.

`raw(text)` splices text in verbatim with no escaping and no values — the
deliberate escape hatch. A non-string throws a `TypeError`.

`join(entries, separator = ", ")` concatenates entries — fragments or
plain values, each handled as `sql` would — with `separator` between them.
An empty list gives an empty fragment. A non-array, or a non-string
separator, throws a `TypeError`.

`escapeLiteral(value)` returns SQL literal text, for the places
placeholders cannot go: a string becomes `'...'` with every `'` doubled, a
finite number its digits, a bigint its digits, `true`/`false` become
`TRUE`/`FALSE`, `null` becomes `NULL`, and a `Date` becomes its ISO string
in single quotes. Anything else — `undefined`, `NaN`, `Infinity`, objects,
arrays, functions, symbols — throws a `TypeError`.

Create the module at `sqltag.mjs` (replace the placeholder already there)
and keep the five export names exactly as given.
'''

