id = "js-m-signals"
title = "Glitch-free reactive signals"
stack = "javascript"
tier = "mid"
timeout_secs = 720
max_cost_usd = 1.0
prompt = '''
Implement `signals.mjs` in the project root as an ES module with five named
exports:

    signal(initial)  -> { value }        readable and writable
    computed(fn)     -> { value }        derived, read-only
    effect(fn)       -> dispose          side effects, re-run on change
    batch(fn)        -> whatever fn returns
    untracked(fn)    -> whatever fn returns

Everything is synchronous: no timers, no promises, no microtask
scheduling.

- `signal(initial)` holds a value behind a `value` accessor. Writing a
  value that is `Object.is`-equal to the current one changes nothing and
  wakes nobody.
- `computed(fn)` derives a value. It is LAZY — `fn` does not run until
  something reads `.value` — and CACHED: repeated reads do not re-run `fn`
  while none of the signals it read have changed. It re-runs on the first
  read after a dependency changed. Assigning to a computed's `.value`
  throws a `TypeError`. A computed that ends up reading itself throws an
  `Error` whose message mentions a cycle.
- `effect(fn)` runs `fn` immediately, remembering everything it read, and
  runs it again whenever any of those change. It returns a dispose
  function that stops it, returning `true` the first time and `false`
  afterwards.
- Dependencies are re-collected on every run: a computed or effect that
  stops reading a signal stops depending on it, and one that starts
  reading a new signal starts depending on it.
- `untracked(fn)` runs `fn` and returns its result without any signal read
  inside it becoming a dependency.
- `batch(fn)` runs `fn` and holds effects back until it returns, so several
  writes wake each affected effect once. Batches nest: only the outermost
  one releases the effects. It returns whatever `fn` returned, and if `fn`
  throws, the pending effects still run before the error propagates.

Glitch-freedom is the point. Given `a`, `b = computed(a + 1)`,
`c = computed(a * 10)` and an effect reading BOTH `b` and `c`, changing `a`
runs that effect EXACTLY once, and it sees `b` and `c` already consistent
with the new `a` — never one updated and one stale. Effects woken by the
same change run in creation order.

An effect is allowed to write signals; effects woken by those writes run
after the current round finishes.

`computed`, `effect`, `batch` and `untracked` throw a `TypeError` when
given something that is not a function.

Create the module at `signals.mjs` (replace the placeholder already there)
and keep the five export names exactly as given.
'''

