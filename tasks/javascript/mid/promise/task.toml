id = "js-m-promise"
title = "Hand-rolled Promise with correct microtask order"
stack = "javascript"
tier = "mid"
timeout_secs = 720
max_cost_usd = 1.0
prompt = '''
Implement `mypromise.mjs` in the project root as an ES module exporting one
class:

    export class MyPromise { ... }

It is a promise implementation written from scratch. The built-in
`Promise` may not be used to do the work — no `Promise.resolve`, no
`new Promise`, no `async` functions standing in for the state machine.
`queueMicrotask` is available and is the right scheduling primitive.

Construction and state:

- `new MyPromise(executor)` calls `executor(resolve, reject)`
  SYNCHRONOUSLY. A throw from the executor rejects the promise. A
  non-function executor throws a `TypeError`.
- A promise settles once. After `resolve` or `reject` has been called, all
  later calls to either are ignored.
- `resolve(x)` follows the standard resolution procedure: if `x` is an
  object or function with a callable `then`, that `then` is called with
  `(resolveFn, rejectFn)` and this promise adopts whatever it reports,
  recursively; the first of the two callbacks wins and later calls are
  ignored; a `then` that throws before reporting rejects this promise.
  Reading `x.then` throwing also rejects it. Resolving a promise with
  ITSELF rejects it with a `TypeError`.

`then` and friends:

- `then(onFulfilled, onRejected)` returns a NEW `MyPromise`. Handlers are
  ALWAYS invoked asynchronously, as microtasks — never during the `then`
  call itself, even when the promise is already settled.
- Returning a value from a handler fulfills the returned promise with it;
  returning a thenable adopts it; throwing rejects the returned promise.
- A handler argument that is not a function is ignored, and the value or
  reason passes through to the returned promise unchanged.
- Several `then` calls on one promise all fire, in registration order.
- `catch(onRejected)` is `then(undefined, onRejected)`.
- `finally(onFinally)` runs its callback for either outcome and passes the
  original value or reason through. If the callback returns a thenable the
  settlement waits for it; if the callback throws, or its thenable rejects,
  that becomes the outcome instead.

Statics:

- `MyPromise.resolve(value)` returns `value` unchanged when it already is a
  `MyPromise`, and otherwise a promise resolved with it.
- `MyPromise.reject(reason)` — a rejected promise; a `MyPromise` reason is
  NOT adopted.
- `MyPromise.all(iterable)` fulfills with the values in input order once
  every entry has fulfilled, rejects with the first rejection it sees, and
  fulfills with `[]` for an empty iterable. Plain values, native promises
  and thenables are all accepted entries.
- `MyPromise.race(iterable)` settles like the first entry to settle.

Ordering is part of the contract. Two chains built on settled promises must
interleave exactly as the native ones do: with `a1 -> a2 -> a3` and
`b1 -> b2 -> b3` started in that order, the callbacks run
`a1, b1, a2, b2, a3, b3`.

Instances must be awaitable with `await` and usable anywhere a thenable is.

Create the module at `mypromise.mjs` (replace the placeholder already
there) and keep the class exported as `MyPromise`.
'''

