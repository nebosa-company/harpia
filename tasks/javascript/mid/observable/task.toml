id = "js-m-observable"
title = "Proxy observable with path subscriptions"
stack = "javascript"
tier = "mid"
timeout_secs = 720
max_cost_usd = 1.0
prompt = '''
Implement `observable.mjs` in the project root as an ES module with three
named exports:

    observable(target)                 -> a deep observable proxy
    subscribe(proxy, path, listener)   -> unsubscribe function
    raw(proxy)                         -> the underlying object

`observable(target)` wraps a plain object or array in a `Proxy` and hands
it back. Anything else throws a `TypeError`. Reading through the proxy is
transparent: `Object.keys`, `JSON.stringify`, spreading, the `in` operator
and `Array.isArray` all behave as they would on the raw object.

Nesting is lazy. Reading a property whose value is a plain object or an
array returns an observable proxy of it, created on first read and CACHED,
so reading the same nested value twice returns the identical proxy. Values
that are not plain objects or arrays — numbers, strings, `null`, `Date`s,
`Map`s, class instances, functions — come back untouched.

Every write is reported as a change record:

    { path, kind, value, previous }

- `path` is the dotted path from the root, using property keys as written,
  so an array element is `"items.0"` and a nested field `"meta.title"`.
- `kind` is `"set"` for a write and `"delete"` for a `delete`.
- `value` is the new value for a set, `undefined` for a delete. It is
  always the RAW value, never a proxy — assigning a proxy stores the object
  behind it.
- `previous` is the raw value the property held, or `undefined` if it had
  none.

A write that leaves a property with the value it already had — same key,
`Object.is`-equal value — reports nothing. Symbol-keyed properties are
never reported. Each individual set or delete the engine performs is one
change record, so a single array method call may report several.

`subscribe(proxy, path, listener)` registers `listener` for a path and
every path BELOW it: a listener on `"meta"` hears about `"meta.title"`, and
the empty string `""` is the root, which hears about everything. The
listener receives the change record. Delivery order for one change is the
exact path first, then each ancestor in turn, ending at the root; within
one path, listeners run in subscription order. The set of listeners is
decided when the change happens, so a listener registered by another
listener during delivery does not see that change. `subscribe` returns a
function that removes only that registration, returning `true` the first
time and `false` afterwards. It throws a `TypeError` for a value that is
not an observable, a non-string path or a non-function listener.

`raw(proxy)` returns the object a proxy wraps — the root object for the
root proxy, the nested object for a nested one — and throws a `TypeError`
for anything that is not an observable.

Create the module at `observable.mjs` (replace the placeholder already
there) and keep the three export names exactly as given.
'''

