id = "js-m-memottl"
title = "WeakMap memoizer with TTL and injectable clock"
stack = "javascript"
tier = "mid"
timeout_secs = 720
max_cost_usd = 1.0
prompt = '''
Implement `memo.mjs` in the project root as an ES module with one named
export:

    memoize(fn, options = {}) -> memoized function

The memoized function caches by the IDENTITY of its first argument, which
must be an object or a function — anything else throws a `TypeError`. The
cache must be a real `WeakMap` keyed on that argument, so a caller that
drops its object does not pin the cached result. Any further arguments
select an entry within that object's bucket.

`options`:

- `ttl` — how long an entry stays fresh, in whatever unit the clock counts.
  An entry is fresh while `clock() - storedAt < ttl`, so a `ttl` of 0 means
  every call recomputes. The default is `Infinity`: entries never expire.
  A `ttl` that is not a number, is `NaN`, or is negative throws a
  `TypeError`.
- `clock` — a zero-argument function returning the current time, consulted
  on every call. Defaults to `Date.now`. A non-function throws a
  `TypeError`.
- `keyFor` — builds the sub-key from the arguments AFTER the first:
  `keyFor(...rest)`. The default is `JSON.stringify(rest)`. A non-function
  throws a `TypeError`.

`memoize` itself throws a `TypeError` when `fn` is not a function.

Behavior:

- A fresh entry is returned without calling `fn` again. A missing or stale
  entry calls `fn` and stores the result together with the current time.
- `this` is forwarded to `fn`, as is every argument.
- An exception from `fn` propagates and is NOT cached: the next call tries
  again.
- A returned promise IS cached, so concurrent callers share one in-flight
  result. If it rejects, the entry is dropped so a later call retries. The
  rejection still reaches the caller, and the memoizer must not leave an
  unhandled rejection behind.

The memoized function also carries:

- `cache` — the `WeakMap` currently backing it.
- `stats()` — `{ hits, misses }`, where a hit is a call served from a fresh
  entry and a miss is a call that had to run `fn`.
- `invalidate(subject)` — drops everything cached for that object,
  returning `true` if there was anything to drop and `false` otherwise.
- `clear()` — empties the whole cache.

Create the module at `memo.mjs` (replace the placeholder already there) and
keep the export named `memoize`.
'''

[[oracles]]
