id = "sh-s-dirsize-report"
title = "Human-readable directory size report"
stack = "bash"
tier = "simple"
prompt = '''
Finish `dirsize.sh` in the project root (a stub is already there). It is run
as `bash dirsize.sh [--top N] DIR` under bash 5 on Linux.

For every immediate subdirectory of DIR, total the sizes in bytes of every
regular file anywhere beneath it, however deeply nested. Symlinks and the
directory entries themselves count as nothing. Files sitting directly in DIR
belong to no subdirectory and are ignored entirely.

Output, on stdout:

- one line per subdirectory, `<size><TAB><name>`, where `<name>` is the bare
  directory name, ordered by total descending and, for equal totals, by name
  ascending in byte order;
- then a final line `<size><TAB>TOTAL` holding the sum over every
  subdirectory.

`<size>` is rendered like this: a total below 1024 is printed as the exact
integer followed by `B`, for example `512B`. Otherwise divide by 1024
repeatedly, moving through the units K, M, G and T, stopping at the largest
unit that leaves a value below 1024 (T is the last resort), and print that
value with exactly one decimal place followed by the unit letter, for
example `1.5K` or `2.0M`.

`--top N` limits the per-directory lines to the N largest, but the TOTAL
line always covers every subdirectory. N must be a positive integer. A
subdirectory holding no files at all still gets a line, with `0B`.

Exit codes: 0 on success; 1 with `not a directory: <DIR>` on stderr when DIR
is missing or is not a directory; 2 with a usage line on stderr for an
unknown option, a missing DIR, or a non-positive or non-integer N.

Use only bash and the standard POSIX tools. Do not read or write anything
outside DIR.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_core.sh"]
cmd = ["wsl", "bash", "oracle_core.sh"]
