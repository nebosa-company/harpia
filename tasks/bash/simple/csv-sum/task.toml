id = "sh-s-csv-sum"
title = "CSV column summer"
stack = "bash"
tier = "simple"
prompt = '''
Finish `csvsum.sh` in the project root (a stub is already there). It is run
as `bash csvsum.sh --sum COL [--group-by COL] [--where COL=VALUE] FILE`
under bash 5 on Linux, and does its arithmetic with awk.

Input files are simple CSV: a header row naming the columns, then data rows,
fields separated by commas. There is no quoting and no embedded comma. Any
whitespace around a field is not part of its value.

Behaviour:

- Blank lines (empty or whitespace only) are ignored everywhere.
- A data row whose field count differs from the header's is ignored. If any
  rows were ignored this way, print `skipped: <n>` to stderr once, at the
  end. This does not change the exit code.
- `--where COL=VALUE` keeps only the rows whose COL field equals VALUE
  exactly. VALUE may be empty and may itself contain `=` characters; only
  the first `=` separates the column from the value.
- Without `--group-by`, print one line: the total of the `--sum` column over
  the kept rows, formatted with exactly two decimal places.
- With `--group-by G`, print one line per distinct value of G among the kept
  rows, as `<value><TAB><total>` with the total formatted to two decimal
  places, ordered by value ascending in byte order.
- A value is a number when it matches `-?[0-9]+(\.[0-9]+)?`. If a kept row
  holds a non-number in the summed column, print
  `bad number: <value> on line <n>` to stderr and exit 3, where n is the
  1-based physical line number in the file (the header is line 1).

Exit codes: 0 on success; 1 with `no such file: <path>` on stderr when FILE
does not exist; 2 with a usage line on stderr for bad or missing options; 3
on a non-numeric value; 4 with `no such column: <name>` on stderr when any
named column is absent from the header.

Use only bash and the standard POSIX text tools. Do not read or write
anything outside the file named on the command line.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_core.sh"]
cmd = ["wsl", "bash", "oracle_core.sh"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_edge.sh"]
cmd = ["wsl", "bash", "oracle_edge.sh"]
weight = 2.0

[[oracles]]
kind = "security"
check = "injection-canary"

[[oracles]]
