id = "sh-s-word-split-bug"
title = "Backup copier mangles unusual file names"
stack = "bash"
tier = "simple"
prompt = '''
`backup.sh` in the project root copies the flat contents of one directory
into another. It has worked fine on our own scratch trees for a year, but it
falls apart on the incoming share, where the names come from other people:

- a name containing a space produces `cp: cannot stat ...: No such file or
  directory` and the reported count is too high;
- a name containing `*` or `?` sometimes copies a different file, or copies
  the same file more than once;
- a name that begins with `-` makes `cp` complain about an unrecognised
  option;
- a name containing a newline is copied as two nonexistent files.

Fix `backup.sh` so that it handles every legal file name. Keep its
command-line interface and its output format exactly as they are. The
contract it is meant to satisfy, run as `bash backup.sh SRC DEST` under
bash 5 on Linux:

- Copy every regular file directly inside SRC into DEST under the same name.
  SRC is not searched recursively.
- Subdirectories, symlinks and any other non-regular entries are skipped and
  are not counted.
- DEST is created if it does not exist. A file already in DEST with the same
  name is overwritten.
- SRC is left untouched.
- Print `copied: <n>` on stdout, where n is the number of files copied.

Exit codes: 0 on success; 1 with `no such directory: <SRC>` on stderr when
SRC is missing or is not a directory; 2 with a usage line on stderr when the
number of arguments is not exactly two.

Do not read or write anything outside SRC and DEST.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_core.sh"]
cmd = ["wsl", "bash", "oracle_core.sh"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_edge.sh"]
cmd = ["wsl", "bash", "oracle_edge.sh"]
weight = 2.0

[[oracles]]
kind = "security"
check = "injection-canary"

[[oracles]]
