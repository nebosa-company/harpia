id = "sh-s-retry-backoff"
title = "Retry wrapper with exponential backoff"
stack = "bash"
tier = "simple"
prompt = '''
Finish `retry.sh` in the project root (a stub is already there). It is run as
`bash retry.sh --attempts N --base-delay S [--max-delay M] -- CMD [ARGS...]`
under bash 5 on Linux, and re-runs a flaky command until it succeeds.

Behaviour:

- Run CMD with its arguments. CMD's own stdout and stderr pass straight
  through; `retry.sh` must not capture, buffer or redirect them.
- If CMD exits 0, `retry.sh` exits 0 immediately without waiting.
- Otherwise print `attempt <k>/<N> failed with <code>` to stderr, where k is
  the 1-based attempt number and code is CMD's exit status.
- CMD is run at most N times in total. When the N-th attempt has failed,
  exit with that attempt's exit status. There is no wait after the last
  attempt.
- Between attempt k and attempt k+1, wait by running the command
  `sleep <delay>`, where delay is `S * 2^(k-1)`. When `--max-delay M` is
  given, a delay larger than M is replaced by M. Delays are whole seconds
  and are printed without a decimal point.
- A command that cannot be executed at all fails like any other, with
  whatever status the shell reports.

N must be an integer of at least 1. S and M must be integers of at least 0.
`--` is required, and at least one word must follow it.

Exit codes: 0 when some attempt succeeds; the last attempt's status when all
of them fail; 2 with a usage line on stderr when an option is unknown, an
option value is missing or malformed, `--` is absent, or nothing follows it.

Use only bash builtins and the `sleep` command; look `sleep` up on `PATH`
rather than by absolute path. Do not read or write any files.
'''
timeout_secs = 300
max_cost_usd = 0.25

[[oracles]]
