id = "sh-m-logrotate-lock"
title = "Log rotation under an exclusive lock"
stack = "bash"
tier = "mid"
prompt = '''
Finish `rotate.sh` in the project root (a stub is already there). It is run
as `bash rotate.sh --file LOG --keep K [--max-bytes B] [--wait S]` under
bash 5 on Linux. Several cron entries call it on the same log at the same
minute, so the whole operation is serialised with `flock`.

Behaviour, in this order:

1. If LOG does not exist, print `no such file: <LOG>` to stderr and exit 1.
2. Take an exclusive lock on the file `<LOG>.lock`, waiting at most S
   seconds for it (default 10). If the lock is still not available, print
   `busy: <LOG>` to stderr, change nothing, and exit 4.
3. Holding the lock, look at LOG's size. If it is smaller than B bytes
   (default 1048576), print nothing and exit 0 with everything untouched.
4. Otherwise rotate. Delete `<LOG>.K` if it exists, along with any
   `<LOG>.<n>` whose n is a number greater than K. Then, counting down from
   K-1 to 1, move `<LOG>.<i>` to `<LOG>.<i+1>` when it exists. Then move LOG
   to `<LOG>.1` and create LOG again, empty. Print `rotated: <LOG>` on
   stdout.

The lock is held from before the size check until the rotation is complete,
so a second invocation either waits its turn or reports `busy`. The lock
file itself is never rotated.

K must be an integer of at least 1. B and S must be integers of at least 0.

Exit codes: 0 on success (whether or not it rotated); 1 for a missing LOG;
2 with a usage line on stderr for an unknown option, a missing option value,
a missing `--file` or `--keep`, or a malformed number; 4 when the lock could
not be taken.

Use only bash and the standard POSIX tools plus `flock`. Do not read or
write anything outside the directory holding LOG.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_core.sh"]
cmd = ["wsl", "bash", "oracle_core.sh"]
weight = 4.0

[[oracles]]
