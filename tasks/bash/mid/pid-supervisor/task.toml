id = "sh-m-pid-supervisor"
title = "Pidfile supervisor with start, stop, status and restart"
stack = "bash"
tier = "mid"
prompt = '''
Finish `svc.sh` in the project root (a stub is already there). It is run as

    bash svc.sh <action> --pidfile P [--log L] [--kill-after S] [-- CMD ARGS...]

under bash 5 on Linux, where `<action>` is `start`, `stop`, `status` or
`restart`. The action is always the first argument.

The pidfile holds one decimal process id on a single line. A pidfile that is
absent means "not running". A pidfile that is present but whose id is not a
decimal number, or names a process that no longer exists, is stale. Liveness
is decided with `kill -0`.

`--log` defaults to the pidfile's path with `.log` appended.
`--kill-after` defaults to 5 and must be an integer of at least 0.

`start` requires `--` followed by at least one word; so does `restart`. For
`stop` and `status`, a `--` is a usage error.

- `start`
  - Already running: print `already running: <pid>` on stdout, exit 0,
    change nothing.
  - Otherwise (missing or stale pidfile) launch CMD in the background with
    its stdin taken from `/dev/null` and both its stdout and its stderr
    appended to the log file. Write the new process id to the pidfile,
    replacing whatever was there, print `started: <pid>` and exit 0.
- `status`
  - Pidfile missing: print `stopped`, exit 3.
  - Stale: print `stale`, exit 4, and leave the pidfile alone.
  - Running: print `running: <pid>`, exit 0.
- `stop`
  - Pidfile missing: print `not running`, exit 3.
  - Stale: delete the pidfile, print `stale`, exit 0.
  - Running: send SIGTERM and wait up to `--kill-after` seconds for the
    process to disappear. If it does, delete the pidfile and print
    `stopped: <pid>`. If it does not, send SIGKILL, wait for it to
    disappear, delete the pidfile and print `killed: <pid>`. Either way
    exit 0.
- `restart` runs the `stop` logic and then the `start` logic. It prints the
  `stopped: <pid>` or `killed: <pid>` line only when a live process was
  actually terminated — a missing or stale pidfile prints nothing extra —
  and then prints the `started: <pid>` line. Exit 0.

Exit codes: 0, 3 and 4 as described; 2 with a usage line on stderr for a
missing or unknown action, a missing `--pidfile`, an unknown option, a
missing option value, a malformed `--kill-after`, a `start` or `restart`
without a command, or a `--` given to `stop` or `status`.

Do not read or write anything outside the pidfile and the log file.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_core.sh"]
cmd = ["wsl", "bash", "oracle_core.sh"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_edge.sh"]
cmd = ["wsl", "bash", "oracle_edge.sh"]
weight = 2.0

