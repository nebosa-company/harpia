id = "sh-m-pipefail-bug"
title = "Record report loses counts and exit codes"
stack = "bash"
tier = "mid"
prompt = '''
`report.sh` in the project root turns a raw record file into a cleaned,
sorted one. It has three faults that were reported together:

- the `records:` line always says 0, whatever the input, even though
  `records.txt` clearly has content;
- when the preprocessor fails part way through, the script still exits 0, so
  the nightly job reports a successful run over a truncated file;
- records that should be rejected land in `rejects.txt` but the script still
  exits 0, and `rejects.txt` keeps growing from run to run instead of being
  replaced.

Fix `report.sh`. Keep its command-line interface, its file names and its
message wording as they are. The contract it is meant to satisfy, run as
`bash report.sh INPUT OUTDIR` under bash 5 on Linux:

1. With anything other than exactly two arguments, print a usage line to
   stderr and exit 2.
2. If INPUT does not exist, print `input not found: <INPUT>` to stderr and
   exit 1.
3. Create OUTDIR if it does not exist.
4. The record stream is `bash "$PREPROCESS" "$INPUT"` when the environment
   variable `PREPROCESS` is set and non-empty, and `cat "$INPUT"` otherwise.
5. From that stream, strip leading and trailing whitespace from every line,
   then drop the lines that are now empty and the lines that now begin with
   `#`. Sort what is left in byte order, removing duplicates, and write it to
   `OUTDIR/records.txt`, one record per line.
6. Print `records: <n>` on stdout, where n is the number of lines in
   `OUTDIR/records.txt`.
7. If the stream command exited non-zero, exit with that same status right
   there: no rejects are examined and no `rejects.txt` is written.
8. Otherwise examine every record. A record is acceptable when it matches
   `^[A-Za-z0-9_.-]+$`. `OUTDIR/rejects.txt` is rebuilt from scratch on every
   run: if any records are unacceptable, they are written to it in the order
   they appear in `records.txt`, `rejected: <m>` is printed to stderr, and
   the exit status is 3. If there are none, no `rejects.txt` is left behind
   and the exit status is 0.

Do not read or write anything outside INPUT and OUTDIR.
'''
timeout_secs = 720
max_cost_usd = 1.0

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_core.sh"]
cmd = ["wsl", "bash", "oracle_core.sh"]
weight = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_edge.sh"]
cmd = ["wsl", "bash", "oracle_edge.sh"]
weight = 2.0

