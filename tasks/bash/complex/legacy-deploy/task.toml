id = "sh-c-legacy-deploy"
title = "Legacy deploy script: three faults and a missing feature"
stack = "bash"
tier = "complex"
prompt = '''
The deploy tool in this project root is `deploy.sh`, with its helpers under
`lib/` and its defaults in `config/app.conf`. It runs under bash 5 on Linux
and can be invoked from any working directory; it finds its own helpers
relative to itself.

Three things are wrong with it, reported by three different teams:

- Files whose names contain spaces are silently missing from the deployed
  tree, and the file count printed at the end does not match what actually
  landed in the destination.
- A deployment whose verification step fails is still reported as
  successful, and it still updates the recorded state.
- When two deployments run at the same time, `history.tsv` ends up with
  fewer entries than there were deployments, and `current.txt` is sometimes
  empty or holds two ids run together.

There is also a missing feature: operators want a dry run, and a way to see
what was deployed recently.

Fix the faults and add the feature. The full contract:

    bash deploy.sh [--dry-run] deploy --id ID --src DIR --dest DIR \
                   [--state DIR] [--verify CMD]
    bash deploy.sh history [--state DIR] [--limit N]

`--state` defaults to whatever `config/app.conf` sets, and `--verify`
likewise; either may be overridden on the command line. The state directory
is created when it is needed.

### deploy

1. `--id`, `--src` and `--dest` are all required.
2. SRC missing or not a directory: print `no such directory: <SRC>` to
   stderr, exit 1.
3. Copy every regular file anywhere under SRC into DEST at the same relative
   path, creating intermediate directories. File and directory names may
   contain spaces; every one of them must arrive.
4. If a verify command is in effect, run `bash -c CMD` with the working
   directory set to DEST. If it exits non-zero, print `verify failed` to
   stderr and exit 5, leaving `history.tsv` and `current.txt` exactly as
   they were.
5. Otherwise append the line `ID<TAB><number of files copied>` to
   `<state>/history.tsv` and write ID, followed by a newline, into
   `<state>/current.txt`. Two deployments running at once must never lose a
   history entry and must never leave `current.txt` holding anything other
   than one complete id: hold an exclusive `flock` on `<state>/.lock` across
   both updates, and put `current.txt` in place by renaming a temporary file
   over it.
6. Print `deployed: <ID> (<n> files)` on stdout, with the word `files` even
   when n is 1.

### --dry-run

With `--dry-run`, a `deploy` reports what it would do and touches nothing on
disk: not the destination, not the state directory, nothing. It prints

- `DRY: copy <relative path>` for every file that would be copied, ordered
  by relative path ascending in byte order;
- then `DRY: verify`, but only when a verify command is in effect;
- then `DRY: record <ID>`.

and exits 0. The missing-SRC check still applies.

### history

Print the ids from `<state>/history.tsv`, newest first, one per line.
`--limit N` prints at most the first N of those; N is an integer of at least
1. A state directory with no `history.tsv` prints nothing and exits 0.

### Exit codes

0 on success; 1 and 5 as described; 2 with a usage line on stderr for a
missing or unknown action, an unknown option, a missing option value, a
missing required option, a malformed `--limit`, or a second positional
argument.

Do not read or write anything outside SRC, DEST and the state directory.
'''
timeout_secs = 1800
max_cost_usd = 4.0

[[oracles]]
kind = "hidden-tests"
inject = ["oracle_core.sh"]
cmd = ["wsl", "bash", "oracle_core.sh"]
weight = 4.0

[[oracles]]
