# DeepSeek's harness (dsh). Runs under WSL only — no Windows wheel for its
# runtime. The shim converts Windows paths to /mnt/d form, starts the usage
# proxy inside WSL's own network namespace (a Windows-bound 127.0.0.1 proxy
# is unreachable from WSL2), and launches the jsonrpc-agent SDK example.
id = "dsh"
command = [
    "wsl", "bash",
    "${HARPIA_DSH_AGENT:-/mnt/d/repos/harpia/harnesses/dsh-agent.sh}",
    "--workspace", "{workspace}",
    "--prompt-file", "{prompt_file}",
    "--session-id", "{session_id}",
]
telemetry = "proxy-jsonl"
# Written by the WSL-side proxy the shim starts; relative to the workspace.
telemetry_path = "../dsh-usage.jsonl"
upstream = "https://api.deepseek.com"

# NOTE: keep [env] last — every key after a table header belongs to it.
# Windows env does not cross into WSL by itself; WSLENV forwards the key.
[env]
WSLENV = "DEEPSEEK_API_KEY/u"
