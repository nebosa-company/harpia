# Perpetum, driving deepseek-v4-flash through its ds-fast link.
# Lifecycle "perpetum": the runner performs `perp init --root {workspace}`,
# writes .harness/links.md, and mints {req_id} before this command runs.
id = "perpetum"
lifecycle = "perpetum"
command = [
    "D:/repos/perpetum.io/perp.exe",
    "run",
    "--root", "{workspace}",
    "--requirement", "{req_id}",
    "--brief", "{prompt}",
    "--cycle", "1",
    "--stage", "D",
]
telemetry = "perpetum-journal"
telemetry_path = ".harness/journal.jsonl"

# Written into the sandbox's .harness/links.md; every role points at it.
[perpetum_link]
name = "ds-fast"
kind = "deepseek"
base_url = "https://api.deepseek.com"
model = "{model}"
auth_env = "DEEPSEEK_API_KEY"
price = [0.0028, 0.14, 0.28]
